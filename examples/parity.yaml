# Parity file (PLATFORM_PARITY_FILE). Illustrative only: the endpoints, jobs
# and rules below are examples, not a reviewed baseline of a real service.
#
# Before every new run (not a rollback) the server checks the target against
# what the app needs and writes the report to the audit log ("parity"). It
# never stops a run: mode audit is the only mode. Secret metadata, audit
# collector readiness and Barman backup probes are optional; see
# parity-three-environments.yaml. Unconfigured probes are unknown, and even
# healthy partial evidence does not prove usability, delivery or restore.
#
# - identity: SubjectAccessReview on the target cluster, as the app's service
#   account, for every rule. The platform's own kube credentials for that
#   cluster need permission to create SubjectAccessReviews.
# - metrics-alerting: up{namespace,job} and timestamp(up) on the target's
#   Prometheus. Alert delivery is not probed, so this stays unknown even when
#   the scrape passes.
version: 1
mode: audit
environments:
  eks:
    prometheus:
      url: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
      maxAge: 2m
apps:
  - name: moimroom
    namespace: moimroom          # matched to the plan's target namespace
    serviceAccount: moimroom
    prometheusJob: moimroom
    rbac:
      - {id: read-own-config, verb: get, resource: configmaps, allowed: true}
      - {id: no-secret-list, verb: list, resource: secrets, allowed: false}
      - {id: no-other-namespace, verb: get, resource: configmaps, namespace: kube-system, allowed: false}
