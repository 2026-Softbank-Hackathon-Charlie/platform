# Korean text and settings for the Notion "API 명세서" page (go run ./tools/apidoc).
# Anything api/openapi.yaml has but this file does not is shown in English and
# listed as missing. Keys follow the contract: operationId, schema name,
# "Schema.field" (nested: "Schema.parent.child"), parameter name or
# "name@operationId" when one name means different things.

notionPage: 40a8bee9ada480b49399d443ce528230
repo: https://github.com/2026-Softbank-Hackathon-Charlie/platform
server: https://api.3-36-23-54.sslip.io

# Section order and headings of the endpoint details.
tags:
- name: system
  title: 시스템
- name: auth
  title: 로그인 (auth)
- name: plans
  title: 계획 (plans)
- name: migrations
  title: 마이그레이션 (migrations)
- name: environments
  title: 환경 (environments)
- name: traffic
  title: 트래픽 (traffic)
- name: audit
  title: 감사 로그 (audit)
- name: security
  title: 보안 (security)
- name: agent
  title: 에이전트 활동 (agent)
- name: apps
  title: 앱 (apps)
- name: deployments
  title: 배포 (deployments)

# Per operationId. summary: one line for the endpoint table. role: who may call it.
# notes: Notion markdown shown in the endpoint's toggle. Order here is the order on the page.
operations:
  getRoot:
    summary: 서비스 이름과 문서 링크
    role: 인증 없음
    notes: 서비스 이름과 계약 문서, 헬스 체크 경로를 돌려준다. 브라우저로 API 호스트에 접속했을 때 응답이 보이게 하는 용도다.
  getHealth:
    summary: 헬스 체크
    role: 인증 없음
    notes: 서버가 살아 있으면 200을 돌려준다.
  getOpenAPI:
    summary: 이 계약 문서(YAML)
    role: 인증 없음
    notes: openapi.yaml을 그대로 돌려준다.
  getMe:
    summary: 토큰 주인 확인
    role: 모든 역할
    notes: 토큰의 이름과 역할을 돌려준다. CLI가 로그인을 확인할 때 쓴다.
  login:
    summary: 관리자 로그인 (콘솔 세션 발급)
    role: 인증 없음
    notes: |-
      PLATFORM_ADMINS에 등록한 관리자의 아이디와 비밀번호를 확인하고 콘솔 세션 토큰을 돌려준다. 세션은 operator이고 12시간 동안 쓸 수 있다. 이후 요청에는 `Authorization: Bearer <token>`으로 보낸다.

      - 없는 아이디와 틀린 비밀번호는 같은 401 invalid_credentials다. 응답 내용과 시간으로 아이디가 있는지 알 수 없다.
      - 아이디마다 10분 안에 10번 실패하면 429 too_many_attempts이고, Retry-After에 다시 시도할 수 있을 때까지의 초를 준다. 막힌 동안에는 비밀번호를 확인하지 않는다.
      - 서버는 비밀번호 확인을 전체에서 동시에 2개까지만 한다. 빈자리가 없으면 확인하지 않고 바로 429 too_many_attempts, Retry-After 1로 답한다. 이 응답은 아이디의 실패로 세지 않고 감사 로그에도 남기지 않는다.
      - 관리자가 없는 서버는 503 login_not_configured다.
      - 성공과 실패를 모두 감사 로그에 남긴다. 비밀번호는 남기지 않는다.
  logout:
    summary: 로그아웃 (세션이나 CLI 토큰 끝내기)
    role: 모든 역할
    notes: 요청한 콘솔 세션이나 CLI 토큰을 끝낸다. 그 토큰은 이후 401이다. PLATFORM_TOKENS의 정적 토큰은 끝낼 수 없어서 그대로 쓸 수 있고, 응답은 똑같이 204다.
  startDeviceLogin:
    summary: CLI 기기 로그인 시작
    role: 인증 없음
    notes: |-
      CLI가 브라우저 없이 로그인하는 device code 흐름(RFC 8628 방식)을 시작한다. 사람에게 userCode와 verificationUri(콘솔의 CLI 로그인 화면)를 보여 주고, 관리자가 콘솔에서 승인할 때까지 interval초마다 POST /v1/auth/device/token을 보낸다.

      - deviceCode는 CLI만 아는 비밀이다. 화면이나 로그에 남기지 않는다.
      - client는 관리자가 승인하기 전에 보는 문자열이다. 무엇이 요청하는지 적는다 (예: `charlie v0.5.0 on rin-sbx-12`). 앞뒤 공백을 빼고 1자에서 200자다. 글자, 결합 부호, 숫자, 문장 부호, 기호와 ASCII 공백만 쓸 수 있다. 다른 공백과 줄 구분자, 제어와 서식 문자, 사용자 정의 영역 문자, 보이지 않는 채움 문자(U+3164 등)는 400 invalid_request다.
      - 10분 뒤에 만료된다. 승인 대기 중인 기기 로그인이 이미 1000개면 429 too_many_attempts이고 Retry-After는 60이다.
  pollDeviceLogin:
    summary: 승인된 기기 로그인을 CLI 토큰으로 교환
    role: 인증 없음
    notes: |-
      승인된 기기 로그인을 CLI 토큰으로 바꾼다. 토큰에는 승인한 관리자의 이름과 승인할 때 고른 역할이 들어가고, 30일 동안 쓸 수 있다. 기기 로그인 하나는 토큰 하나만 준다.

      - 승인 전이면 400 authorization_pending이다. interval초 뒤에 다시 보낸다.
      - 관리자가 거절했으면 400 access_denied이고, 그 기기 로그인은 지워진다.
      - 모르거나, 만료됐거나, 이미 토큰으로 바꾼 deviceCode는 400 expired_token이다. 처음부터 다시 시작한다.
  getDeviceLogin:
    summary: 기기 로그인 조회 (승인 전 확인)
    role: operator, 콘솔 세션
    notes: 콘솔이 승인 전에 어떤 client가 요청하는지 보여 주는 데 쓴다. userCode는 대소문자, 공백, `-`를 무시한다. deviceCode는 돌려주지 않는다. CLI 토큰과 정적 토큰은 operator여도 403 console_session_required다. 모르거나 만료된 코드는 404 device_login_not_found다.
  approveDeviceLogin:
    summary: 기기 로그인 승인 (CLI 토큰의 역할 선택)
    role: operator, 콘솔 세션
    notes: |-
      승인 대기 중인 기기 로그인을 승인한다. CLI의 다음 폴링이 요청한 관리자의 이름과 본문의 role을 가진 토큰을 받는다. 봇에는 필요한 만큼만 준다. 읽기만 하면 viewer, 계획을 제출하면 agent, 배포와 승인까지 해야 할 때만 operator다.

      - 비밀번호로 로그인한 콘솔 세션만 승인할 수 있다. CLI 토큰과 정적 토큰은 operator여도 403 console_session_required다. CLI 토큰을 가진 봇이 자기의 다음 토큰을 스스로 승인할 수 없게 하기 위해서다.
      - role이 없거나 모르는 값이면 400 invalid_request다.
      - 승인하면 만료 시각이 지금부터 10분 뒤보다 이르지 않게 늘어난다. 응답의 expiresAt이 바뀔 수 있다. 늦게 폴링하는 CLI도 토큰을 받게 하기 위해서다.
      - 이미 승인하거나 거절한 것은 409 device_login_state_conflict, 모르거나 만료된 코드는 404 device_login_not_found다.
  denyDeviceLogin:
    summary: 기기 로그인 거절
    role: operator, 콘솔 세션
    notes: 승인 대기 중인 기기 로그인을 거절한다. CLI의 다음 폴링은 access_denied를 받는다. 콘솔 세션만 거절할 수 있고, CLI 토큰과 정적 토큰은 403 console_session_required다. 이미 승인하거나 거절한 것은 409 device_login_state_conflict, 모르거나 만료된 코드는 404 device_login_not_found다.
  listApps:
    summary: 등록된 앱과 실행 환경 목록
    role: 모든 역할
    notes: 서버의 PLATFORM_APPS_FILE에 등록된 앱과 각 앱이 실행되는 환경을 설정 순서대로 돌려준다. 파일이 설정되지 않았으면 빈 목록이다.
  draftPlan:
    summary: 앱과 경로로 계획 초안 생성
    role: agent, operator
    notes: |-
      앱 하나와 경로(source, target)를 받아 서버 설정으로 엔진 계획을 만든다. 계획 JSON을 손으로 쓰지 않기 위한 API다. 초안은 저장하지 않으므로, 그대로 또는 수정해서 POST /v1/plans로 제출한다.

      - id는 `<app>-<source>-to-<target>`이다. context는 환경 설정에서, cluster와 DB 호스트는 앱 설정에서 가져온다.
      - DSN은 환경의 passwordEnv를 `${VAR}`로 참조해서 비밀번호를 읽는다.
      - 두 환경 모두 버킷이 있으면 files를 채운다. 요청에서 files를 false로 주면 뺀다.
      - 서버에 게이트웨이가 있으면 gateway mode는 http, 없으면 none이다.
  submitPlan:
    summary: 엔진 계획 제출 (승인 대기로 저장)
    role: agent, operator
    notes: |-
      엔진 계획을 그대로 제출한다. 서버는 보안 정책(kubeconfig 경로 금지, 게이트웨이와 DB 호스트 허용 목록, 환경 참조)을 적용하고 계획을 pending_approval로 저장한다.

      - DSN은 `postgres://` URL이어야 하고, 허용된 변수 하나를 비밀번호 전체로만 참조할 수 있다. 예: `postgres://app:${SRC_PGPASSWORD}@host:5432/db`
      - 앱의 passwordEnv는 그 앱의 DB 호스트로 가는 DSN에서만 쓸 수 있다.
      - gateway.token은 `${GATEWAY_TOKEN}`만 허용한다. 다른 필드에는 `$`를 쓸 수 없다.
  listPlans:
    summary: 계획 목록 (최신순)
    role: 모든 역할
    notes: 모든 계획을 최신순으로 돌려준다.
  getPlan:
    summary: 계획 하나 조회
    role: 모든 역할
    notes: 계획 요약을 돌려준다. DSN과 토큰은 서버 밖으로 나가지 않는다.
  putPlanAttachment:
    summary: 계획 첨부 파일 업로드
    role: agent, operator
    notes: |-
      계획이 참조하는 파일을 올린다. 예를 들어 target.manifest를 `attachment:<name>`으로 참조하는 대상 CNPG Cluster 매니페스트를 올린다.

      - 계획이 pending_approval일 때만 올릴 수 있다.
      - 올릴 때마다 계획의 revision이 1 오르므로, 승인자는 고정된 내용을 승인하게 된다.
      - 같은 이름으로 다시 올리면 교체된다. 본문은 원본 바이트이며 최대 1 MiB다.
      - 없는 첨부를 참조하는 계획을 승인하면 409가 난다.
      - name 규칙은 `^[A-Za-z0-9._-]{1,100}$`이고, `.`과 `..`은 쓸 수 없다.
  getPlanAttachment:
    summary: 계획 첨부 파일 다운로드
    role: 모든 역할
    notes: 올린 내용을 그대로 돌려준다. 그 이름의 첨부가 없으면 404 attachment_not_found다.
  approvePlan:
    summary: 계획 승인 (사람의 승인 단계)
    role: operator
    notes: |-
      AI가 만든 계획과 실제 실행 사이에 있는 사람의 승인 단계다. 검토한 계획의 revision을 함께 보낸다.

      - 첨부가 있는 계획을 revision 없이 승인하거나, 검토 후 첨부가 올라와 revision이 바뀌었으면 409 plan_state_conflict다.
      - 이미 승인된 계획을 다시 승인해도 아무 변화가 없다.
  rejectPlan:
    summary: 계획 거절
    role: operator
    notes: 승인 대기 중인 계획을 거절한다. 거절된 계획은 시작할 수 없다.
  startMigration:
    summary: 승인된 계획 실행 시작 (202)
    role: operator
    notes: |-
      승인된 계획을 시작한다. run이 만들어지는 즉시 202를 돌려주며, 마이그레이션이 끝났다는 뜻이 아니다.

      - run은 데이터를 동기화하고, canary를 주면 읽기 트래픽 일부를 target으로 보낸 뒤, awaiting_switch에서 운영자가 /switch를 부를 때까지 기다린다. autoSwitch가 true면 기다리지 않고 바로 전환한다.
      - observe를 주면 전환이 성공한 뒤 target을 게이트 기준으로 관찰하고, observe.autoRollback이면 위반 시 스스로 롤백을 시작한다.
      - 재시도할 때 같은 Idempotency-Key를 보내면 처음 만든 run을 돌려받는다.
      - verify.writtenRecords가 `stream:<name>`인 계획은 그 스트림에 레코드가 쌓여야 시작된다. 그 전에는 400 invalid_request다.
      - rollbackOf가 있는 계획으로 시작한 run에는 같은 rollbackOf가 붙는다.
  listMigrations:
    summary: run 목록 (최신순)
    role: 모든 역할
    notes: 모든 run을 최신순으로 돌려준다.
  getMigration:
    summary: run 하나 조회
    role: 모든 역할
    notes: run의 현재 상태와 결과, 엔진 상태를 돌려준다.
  streamMigrationEvents:
    summary: run 이벤트 스트림 (SSE)
    role: 모든 역할
    notes: |-
      Server-Sent Events로 run의 진행을 보낸다.

      - 첫 메시지는 `snapshot`(data는 Run)이며 SSE id가 없다.
      - 이후 RunEvent마다 kind를 SSE event 이름으로, seq를 SSE id로 보낸다.
      - run이 끝나면 마지막 snapshot을 보내고 스트림을 닫는다. run이 활성 상태인 동안(awaiting_switch 포함)은 `: keep-alive` 주석으로 연결을 유지한다.
      - `Last-Event-ID` 헤더나 `?after=`로 다시 연결하면 놓친 이벤트를 재생한다. 이벤트는 저장되므로 유실되지 않는다.
      - 브라우저의 EventSource는 Authorization 헤더를 넣을 수 없으므로 fetch 기반 SSE 클라이언트를 쓴다.
  switchMigration:
    summary: 전환(cutover) 승인
    role: operator
    notes: awaiting_switch인 run의 전환을 승인한다. 엔진은 쓰기를 붙잡고(hold), target을 승격하고, 트래픽을 옮긴다. 다른 상태의 run이면 409다.
  abortMigration:
    summary: 실행 중단
    role: operator
    notes: |-
      실행 중인 마이그레이션을 멈춘다. 결과는 엔진이 어느 경계를 지났는지에 따라 정해진다.

      - 쓰기를 붙잡기 전: 아무것도 바뀌지 않고 aborted로 끝난다.
      - target 승격을 요청하기 전: source로 롤백하고 rolled_back으로 끝난다.
      - 그 이후: halted로 멈추고 운영자의 판단을 기다린다.

      응답은 중단 요청을 받았다는 뜻이므로, 최종 상태는 run을 계속 조회해서 확인한다.
  resumeMigration:
    summary: 중단된 run 이어서 실행
    role: operator
    notes: interrupted(서버 재시작), failed, aborted 상태의 run을 이어서 실행한다. 이미 성공한 단계는 건너뛴다. 시작할 때와 마찬가지로 계획의 written-records 스트림에 레코드가 있어야 한다.
  rollbackMigration:
    summary: 성공한 run 원클릭 롤백 (202)
    role: operator
    notes: |-
      succeeded인 run을 왔던 방향의 반대로 다시 이전한다.

      - 서버가 run 계획의 역방향 계획을 만든다. source와 target, 파일 버킷, 게이트웨이 백엔드를 서로 바꾸고, 예전 source가 레플리카로 남아 있으므로 target manifest는 넣지 않는다.
      - 역방향 계획은 id `<plan id>-rollback`과 rollbackOf를 붙여 호출자가 승인한 상태로 저장되고, 바로 시작된다. 새 run에도 rollbackOf가 붙는다.
      - run 하나는 한 번만 롤백된다. 이전 롤백 시작이 실패했으면(예: cluster_busy) 새 계획을 만들지 않고 그 계획을 다시 시작한다. 그 계획이 이미 시작됐으면 409 run_state_conflict가 해당 run을 알려 준다.
      - 요청 본문의 autoSwitch 기본값은 true다.
  getMatrix:
    summary: 환경 쌍별 최근 결과 매트릭스
    role: 모든 역할
    notes: source와 target 환경 쌍마다 가장 최근에 끝난 run을 돌려준다.
  appendWrittenRecords:
    summary: 성공한 쓰기 기록 추가 (유실 검증용)
    role: agent, operator
    notes: |-
      부하 생성기(k6)가 성공을 확인한 쓰기를 기록한다.

      - 계획의 verify.writtenRecords가 `stream:<name>`이면, 서버는 verify 단계 직전에 스트림의 모든 레코드를 파일로 쓰고 엔진은 각 레코드가 target DB에 있는지 확인한다.
      - 테이블 이름은 소문자로 저장한다(따옴표 없는 PostgreSQL 식별자). table이나 pk에 제어 문자가 있으면 거부한다.
      - 한 번에 1개에서 5000개까지 보낼 수 있다.
  getWrittenRecordStats:
    summary: 기록 스트림의 레코드 수
    role: 모든 역할
    notes: 스트림에 쌓인 레코드 수를 돌려준다. 아무도 쓰지 않은 스트림은 count가 0이다.
  listEnvironments:
    summary: 환경 목록과 실시간 클러스터 상태
    role: 모든 역할
    notes: 등록된 환경을 설정 순서대로, 실시간 클러스터 상태와 함께 돌려준다.
  getEnvironment:
    summary: 환경 하나 조회
    role: 모든 역할
    notes: 환경 하나와 그 클러스터 상태를 돌려준다.
  getTraffic:
    summary: 게이트웨이 상태와 요청 통계
    role: 모든 역할
    notes: 트래픽 게이트웨이의 현재 상태와 요청 통계를 돌려준다. 게이트웨이가 설정되지 않았으면 503 gateway_not_configured, 응답하지 않으면 502 gateway_unreachable이다. TrafficState, RouteRequest, WeightsRequest는 게이트웨이 자체 관리 API에서도 같은 타입으로 쓴다.
  listAudit:
    summary: 감사 로그 (최신순)
    role: 모든 역할
    notes: 상태를 바꾸는 모든 요청과 거부된 모든 요청을 최신순으로 돌려준다. 응답의 nextBefore를 다음 요청의 before로 넘겨서 페이지를 넘긴다.
  getSecurity:
    summary: 전 환경 보안과 거버넌스 상태
    role: 모든 역할
    notes: |-
      모든 환경의 보안과 거버넌스 상태를 한 번에 돌려준다. Kubernetes 클러스터, AWS 계정(IAM, EC2, CloudTrail, GuardDuty, Security Hub, S3), 플랫폼의 감사 로그와 설정을 읽어 SecurityFinding으로 정규화한다.

      - 모든 finding은 실제로 읽은 결과다. 읽지 못한 소스는 sources에 상태와 메시지로만 나오고 finding을 만들지 않는다.
      - 결과는 60초 동안 캐시한다. refresh=true면 다시 수집하지만 10초에 한 번까지만 수집하고, 그 안의 refresh는 최신 결과를 받는다.
      - 필터는 findings와 sources의 개수, summary에 모두 적용된다.
      - 오류 코드: invalid_request(400), security_not_configured(503).
  createAgentSession:
    summary: 에이전트 작업 세션 시작
    role: agent, operator
    notes: AI 에이전트의 작업 하나(마이그레이션 계획, 샌드박스 리허설, 진단)에 대한 활동 기록을 시작한다. 세션은 running으로 시작하고 actor는 토큰 이름이다.
  listAgentSessions:
    summary: 에이전트 세션 목록 (최신순)
    role: 모든 역할
    notes: 세션을 최신순으로 돌려준다. planRef나 runId로 거를 수 있다.
  getAgentSession:
    summary: 에이전트 세션 하나와 합계
    role: 모든 역할
    notes: 세션과 이벤트 합계(이벤트 수, 도구 호출 수, 토큰 수, 소요 시간)를 돌려준다.
  appendAgentEvent:
    summary: 에이전트 이벤트 기록
    role: 세션 actor, operator
    notes: |-
      도구 호출, 도구 결과, 메시지, 차단된 동작, 결정, 오류 중 하나를 기록한다.

      - 세션의 actor나 operator만 추가할 수 있다. 세션 하나에 이벤트는 최대 5000개다.
      - input과 output은 각각 64 KiB 이하의 임의 JSON 값이다.
      - 자격 증명은 `"[redacted]"`로 저장한다. 대상은 자격 증명처럼 보이는 키(password, passwd, pwd, pass, secret, token, authorization, cookie, api key, private key, credential, access key) 아래의 문자열 값, name이나 key가 그런 이름인 객체의 value, 문자열 안의 `NAME=value`와 `NAME: value` 할당, URL 비밀번호, bearer 토큰, AWS 액세스 키 ID, PEM 개인 키다. 숫자와 불리언은 그대로 두므로 토큰 수는 남는다.
      - 저장하는 모든 문자열에서 NUL 문자를 지우고 잘못된 UTF-8은 치환한다.
      - 오류 코드: agent_session_not_found(404), agent_session_finished(409), session_full(409), too_large(413).
  streamAgentEvents:
    summary: 에이전트 이벤트 스트림 (SSE 또는 JSON)
    role: 모든 역할
    notes: |-
      run 이벤트 스트림과 같은 규약의 Server-Sent Events다.

      - 첫 메시지는 `snapshot`(data는 AgentSession)이며 SSE id가 없다.
      - 이후 AgentEvent마다 type을 SSE event 이름으로, seq를 SSE id로 보낸다.
      - 세션이 끝나면 마지막 snapshot을 보내고 닫는다. 실행 중에는 `: keep-alive` 주석으로 연결을 유지한다.
      - `Last-Event-ID`나 `?after=`로 다시 연결하면 놓친 이벤트를 재생한다.
      - `format=json`이면 스트림 대신 저장된 이벤트 한 페이지를 AgentEventList로 돌려준다. after 이후 최대 limit개를 주고, 더 남아 있으면 nextAfter를 채운다.
  finishAgentSession:
    summary: 에이전트 세션 종료
    role: 세션 actor, operator
    notes: '실행 중인 세션을 끝낸다. 세션의 actor나 operator만 끝낼 수 있다. PLATFORM_AGENT_IDLE(기본 30분) 동안 이벤트가 없는 세션은 플랫폼이 cancelled로 끝내고 summary에 "no activity for 30m; closed by the platform"을 남긴다. 오류 코드: agent_session_not_found(404), agent_session_finished(409).'
  createApp:
    summary: GitHub 저장소에서 앱 등록과 첫 배포
    role: operator
    notes: |-
      GitHub 저장소의 앱을 등록하고 배포한다. 저장소에는 서비스마다 Dockerfile과 루트의 `platform.yaml`이 있어야 한다. `branch` head의 `platform.yaml`을 GitHub App으로 읽어 `POST /v1/apps/validate`와 같은 규칙으로 검사하고, `name`으로 앱을 저장한 뒤 첫 배포(trigger `register`)를 `environments` 전부로 큐에 넣는다. `autoDeploy`이면 이후 그 브랜치의 push도 배포한다.

      - 배포는 서비스마다 이미지를 빌드하고, gitops 저장소에 `apps/<instance>/<env>.yaml`을 커밋하고, Argo CD가 Application `<instance>-<env>`를 네임스페이스 `<instance>`에 동기화하게 한다. `branch`가 기본 인스턴스(앱 이름)다.
      - `platform.yaml`에 s3 리소스가 있으면 모든 대상 환경에 저장소 드라이버가 있어야 한다. 플랫폼이 인스턴스마다 버킷과 그 버킷 전용 키를 만들어 봉인한다(ADR 0016).
      - 앱 이름 `api`, `console`, `app`, `headlamp`는 플랫폼과 infra가 쓴다.
      - 오류 코드: invalid_request(400), app_exists(409, 같은 이름의 앱이 있거나 예약된 이름), storage_cleanup_pending(409, 지운 같은 이름 앱의 버킷과 키를 아직 지우는 중), invalid_app_spec(422), github_unreachable(502), github_not_configured(503), storage_not_configured(503, s3 리소스가 있는데 저장소 드라이버가 없는 환경).
  createAppInstance:
    summary: 브랜치를 인스턴스로 추가하고 첫 배포
    role: operator
    notes: |-
      등록한 앱의 다른 브랜치를 인스턴스 `<app>--<slug>`로 따로 배포한다(ADR 0015). 브랜치 head의 `platform.yaml`을 등록과 같은 규칙으로 검사하고(`name`은 앱 이름이어야 한다) 첫 배포를 앱의 모든 환경으로 큐에 넣는다.

      - 인스턴스 이름은 48자까지이고, 길면 슬러그를 자르고 해시 6자를 붙인다.
      - s3 리소스가 있으면 인스턴스마다 버킷과 키를 따로 받는다.
      - 오류 코드: invalid_request(400), app_not_found(404), app_not_registered(409), branch_exists(409), instance_exists(409), instance_limit(409, 기본 인스턴스를 포함해 3개), storage_cleanup_pending(409), invalid_app_spec(422), github_unreachable(502), github_not_configured(503), storage_not_configured(503).
  createDeployment:
    summary: 지금 배포하거나 빌드 없이 재배포
    role: operator
    notes: |-
      등록한 앱을 지금 배포한다(trigger `manual`). `branch`가 인스턴스를 고르고(기본은 앱의 브랜치), `ref`를 커밋으로 풀어 그 커밋의 `platform.yaml`을 등록과 같이 검사한 뒤 배포를 큐에 넣는다. 202가 바로 오고, 진행은 `GET /v1/deployments/{id}/events`로 본다.

      - `redeploy: true`(trigger `redeploy`)이면 빌드도 GitHub 읽기도 없이 그 인스턴스의 마지막 healthy 배포를 같은 커밋, 이미지, `platform.yaml`로 지금의 시크릿과 함께 다시 배포한다. 시크릿을 바꾼 뒤에 쓴다. `ref`와 함께 쓸 수 없다.
      - 재배포는 그 healthy 배포가 간 환경에만 간다. `environments`를 빼면 그 배포의 환경 중 앱이 아직 배포하는 환경 모두이고, 그 배포가 가지 않은 환경을 `environments`에 넣으면 409 nothing_to_redeploy다.
      - 그 인스턴스에 끝나지 않은 배포가 있으면 재배포는 409 deployment_in_progress다. 진행 중인 배포는 gitops 커밋 때의 시크릿을 쓰므로 끝난 뒤에 다시 보낸다. 그 사이에 들어온 배포는 재배포를 superseded로 끝내고, 끝나지 않은 배포 옆에서 큐에 들어간 재배포는 스스로 superseded로 끝난다.
      - 오류 코드: invalid_request(400, 앱이 배포하지 않는 브랜치, 등록하지 않은 환경, 없는 ref, ref와 redeploy를 함께 보냄), app_not_found(404), app_not_registered(409), nothing_to_redeploy(409, healthy 배포가 없거나 그 배포가 요청한 환경 또는 앱이 아직 배포하는 환경에 가지 않음), deployment_in_progress(409), invalid_app_spec(422), github_unreachable(502), github_not_configured(503).
  listAppSecrets:
    summary: 앱 시크릿 이름 목록
    role: 모든 역할
    notes: |-
      GitHub에서 등록한 앱의 시크릿 이름, 바꾼 시각, 바꾼 사람을 돌려준다. 값은 돌려주지 않는다.

      - app은 모든 인스턴스가 받는 앱 단위 시크릿이고, instances는 덮어쓰기가 하나라도 있는 인스턴스별 목록이다. 둘 다 이름순이다.
      - 인스턴스는 앱 단위 시크릿 위에 자기 덮어쓰기를 얹어서 받는다. platform.yaml의 env와 이름이 같으면 시크릿이 이긴다.
      - 시크릿은 다음 배포 때 환경 변수로 들어간다(ADR 0019).
      - 오류 코드: app_not_found(404), app_not_registered(409, PLATFORM_APPS_FILE에만 있는 앱), secrets_not_configured(503, 서버에 PLATFORM_SECRETS_KEY가 없음).
  updateAppSecrets:
    summary: 앱 시크릿 넣기와 지우기
    role: operator
    notes: |-
      한 범위의 시크릿을 한 번에 바꾸고, 바꾼 뒤의 이름 목록을 돌려준다. instance가 없으면 앱 단위, 있으면 그 인스턴스의 덮어쓰기를 바꾼다. 기본 인스턴스는 앱 이름으로 가리킨다.

      - set은 이름과 값이고, 있는 이름이면 값을 바꾼다. delete는 지울 이름이고, 없는 이름은 무시한다. 덮어쓰기를 지우면 그 인스턴스는 앱 단위 값으로 돌아간다.
      - 이름은 `^[A-Z_][A-Z0-9_]*$`, 64자까지이고 PORT, DATABASE_URL, S3_*는 쓸 수 없다. 값은 1바이트에서 4096바이트까지다. 앱 단위와 인스턴스마다 50개까지이고, 바꾼 뒤의 개수로 센다. 지우거나 값만 바꾸는 요청은 개수가 이미 50개를 넘어도 된다. set과 delete에는 각각 이름을 50개까지 넣는다.
      - instance가 비어 있으면 앱 단위로 본다.
      - 값은 서버의 시크릿 키로 AES-256-GCM 암호화해 저장하고 로그에 쓰지 않는다. 감사 로그에는 검증을 통과한 이름(set, deleted)만 남는다. 400으로 거절한 요청은 이름 대신 개수(setCount, deleteCount)만 남는다.
      - 떠 있는 인스턴스는 다시 배포할 때까지 이전 값을 쓴다.
      - 오류 코드: invalid_request(400, 이름이 틀리거나 예약됨, 빈 값이나 너무 긴 값, 50개 초과, 같은 이름을 넣고 지움, 바꿀 것이 없음), app_not_found(404), instance_not_found(404, 앱의 인스턴스가 아님), app_not_registered(409), secrets_not_configured(503).
  getAppSecret:
    summary: 앱 시크릿 값 하나 (눈 버튼)
    role: operator
    notes: |-
      시크릿 하나의 값을 돌려준다. 콘솔의 눈 버튼이 부른다.

      - instance가 없으면 앱 단위 값, 있으면 그 인스턴스의 덮어쓰기다. 덮어쓰기가 없으면 앱 단위 값이 있어도 404 secret_not_found다.
      - GET이지만 부를 때마다 감사 로그에 남는다. 규칙에 맞는 이름과 인스턴스만 남고 값은 남지 않는다. 응답에는 `Cache-Control: no-store`가 붙는다.
      - 감사 로그를 값보다 먼저 쓴다. 쓰지 못하면 값을 주지 않고 503 audit_unavailable로 답한다.
      - viewer와 agent 토큰은 403이다.
      - 오류 코드: app_not_found(404), instance_not_found(404), secret_not_found(404), app_not_registered(409), secrets_not_configured(503), audit_unavailable(503).

# Parameter descriptions.
params:
  ref: '계획 ref (예: pln_3f9c1a0b2d4e)'
  runId: run id
  name@getEnvironment: '환경 이름 (예: gke)'
  Idempotency-Key: 재시도 시 같은 값을 보내면 처음 run을 돌려준다
  Last-Event-ID: 마지막으로 받은 이벤트의 seq. 그 뒤부터 재생한다
  after: seq가 이 값보다 큰 이벤트부터 재생한다. Last-Event-ID와 같다
  window: 통계 구간, 1s에서 5m 사이
  limit@listAudit: 돌려받을 항목 수
  before: id가 이 값보다 작은 항목만 (페이지 넘김)
  environment: '이 환경만 (예: gke, aws-account, platform). 모르는 이름이면 400'
  severity: 최소 심각도. high면 critical과 high를 돌려준다
  refresh: true면 캐시를 무시하고 다시 수집한다 (10초에 한 번까지)
  planRef: 이 계획의 세션만
  runId@listAgentSessions: 이 run의 세션만
  limit@listAgentSessions: 돌려받을 세션 수
  id: '에이전트 세션 id (예: ags_3f9c1a0b2d4e)'
  format: sse면 스트림, json이면 이벤트 목록 한 페이지
  limit@streamAgentEvents: format=json일 때 돌려받을 최대 이벤트 수
  stream: 스트림 이름, `^[a-z0-9][a-z0-9-]{0,62}$`. 계획에서는 verify.writtenRecords에 `stream:<name>`으로 참조한다
  name@putPlanAttachment: 첨부 이름, `^[A-Za-z0-9._-]{1,100}$` (`.`과 `..` 제외)
  name@getPlanAttachment: 첨부 이름
  userCode: 'CLI가 보여 준 코드 (예: BCDF-GHJK). 대소문자, 공백, `-`는 무시한다'
  name@listAppSecrets: 앱 이름
  name@updateAppSecrets: 앱 이름
  name@getAppSecret: 앱 이름
  secret@getAppSecret: '시크릿 이름 (예: HOST_CODE)'
  instance@getAppSecret: 이 인스턴스의 덮어쓰기를 읽는다. 없으면 앱 단위 값

# Schema toggles under the 스키마 section, in this order. Enum-only schemas are listed in 열거형 instead.
schemaGroups:
- title: 공통
  schemas:
  - Error
  - ErrorBody
  - Health
  - Principal
  - ServiceInfo
- title: 로그인
  schemas:
  - LoginRequest
  - Session
  - DeviceLoginStartRequest
  - DeviceLoginStart
  - DeviceTokenRequest
  - DeviceLogin
  - DeviceLoginApproveRequest
- title: 계획
  schemas:
  - EnginePlan
  - EnginePlanEndpoint
  - PlanRecord
  - PlanSummary
  - PlanEndpoint
  - PlanList
  - ReviewRequest
  - PlanAttachment
  - PlanDraftRequest
  - AppList
  - App
  - AppDatabase
  - AppEnvironment
