# One paragraph above a schema's field table.
schemas:
  Error: '모든 오류 응답의 본문이다. `{"error": {"code": "...", "message": "..."}}`'
  EnginePlan: migration-engine의 계획(migration-engine/pkg/plan)이다. `${VAR}` 참조는 서버에서 펼친다. 정의되지 않은 필드는 거부한다.
  PlanEndpoint: 계획 엔드포인트에서 비밀이 아닌 값만 보여 주는 형태다.
  PlanRecord: 서버에 저장된 계획이다. 계획 원문(DSN, 토큰)은 돌려주지 않고 summary만 돌려준다.
  CanaryOptions: 전환 전에 읽기 요청(GET, HEAD, OPTIONS) 중 weights 비율만큼 target으로 보내고, 쓰기는 계속 source로 보낸다. step마다 게이트가 그 step 동안의 target 요청을 검사한다. 게이트가 실패하면 읽기를 모두 source로 되돌리고 run은 rolled_back으로 끝난다. 요청이 gate.minRequests보다 적고 다른 위반이 없는 step은 inconclusive이고 canary는 다음 step으로 넘어간다. 마지막 step만은 요청이 충분한 채로 통과해야 한다. 1, 10, 25, 50, 75, 90, 100처럼 조금씩 늘리는 step을 권장한다. gateway mode http가 필요하다.
  ObserveOptions: 전환이 성공한 뒤 run이 끝나기 전에 게이트웨이에서 target을 계속 관찰한다. step마다 그 step 동안 target으로 간 요청에 게이트를 평가한다. 요청이 gate.minRequests보다 적거나 게이트웨이 데이터가 없는 step은 inconclusive로 기록만 하고 위반으로 보지 않는다. 롤백은 전체를 다시 이전하는 작업이므로 측정된 위반에서만 시작하기 때문이다. 첫 위반 step에서 관찰을 끝낸다. 데이터는 이미 옮겨졌으므로 run은 succeeded로 끝나고, 위반 내용은 observe와 statusReason에 남는다. autoRollback이면 서버가 actor slo-guard로 이 run의 롤백을 시작하고, 아니면 운영자가 판단한다. gateway mode http가 필요하다.
  RunResult: 콘솔이 보여 주는 숫자다. 값이 없으면 아직 측정하지 않은 것이다.
  EngineState: 엔진이 저장하는 run 상태(migration-engine/pkg/engine.State)다.
  RunEvent: run 이벤트 스트림의 이벤트다. kind별 data는 아래 'SSE 이벤트' 절에 정리했다.
  EnvironmentStatus: 클러스터에서 실시간으로 읽고 몇 초 동안 캐시한다. 읽지 못한 값은 채우지 않는다.
  DatabaseCluster: CloudNativePG Cluster 하나다.
  DatabaseBackup: WAL 보관자로 켜진 Barman Cloud plugin이 있는 Cluster의 백업이다(ADR 0025). 그런 plugin이 없으면 생략한다. 시각은 plugin의 ObjectStore에서 읽고, 읽지 못하면 생략하고 EnvironmentStatus.error에 이유를 적는다.
  BackendTotals: 게이트웨이 시작 이후 클라이언트가 이 백엔드에서 받은 응답이다. 이 백엔드에서 실패한(5xx 또는 무응답) 읽기를 게이트웨이가 다른 백엔드로 한 번 더 보냈다면 requests와 errors가 아니라 retried에 세고, 재시도는 응답한 백엔드 쪽에 센다. 구간 통계(BackendStats)는 재시도된 응답까지 모두 세므로 canary 게이트는 실패하는 백엔드를 그대로 본다.
  RouteRequest: 게이트웨이 관리 API에서 쓰기 백엔드를 바꾸는 요청이다.
  WeightsRequest: 게이트웨이 관리 API에서 읽기 비율을 바꾸는 요청이다.
  SecurityFinding: 공급자별 보안, 거버넌스 신호 하나를 공통 형식으로 정규화한 것이다.
  StorageKey: 앱 인스턴스 버킷의 키 하나다(환경 하나). 키 id는 끝 4자만 나온다.
  StorageKeyScope: 키가 버킷에 할 수 있는 것이다. 드라이버가 배포할 때마다 거는 권한이고 클라우드에서 다시 읽지 않는다. 드라이버를 쓸 수 없으면 빠진다.
  WrittenRecord: 부하 생성기가 성공을 확인한 쓰기 하나다(엔진의 written-records 형식).
  App: 'PLATFORM_APPS_FILE에 있는 애플리케이션, GitHub에서 등록한 애플리케이션, 또는 같은 이름으로 둘 다인 애플리케이션이다. namespace, database, environments는 마이그레이션이 쓰고, deploy는 등록한 앱에만 있다. 파일에 없는 등록 앱은 namespace가 앱 이름, database가 `{name: app, user: app, schemas: []}`이고 environments가 없다.'
  Session: '콘솔 세션이나 CLI 토큰이다. token을 `Authorization: Bearer <token>`으로 보낸다.'
  DeviceLogin: 관리자가 콘솔에서 보는 기기 로그인이다. deviceCode는 들어 있지 않다.
  AppSecrets: 앱의 시크릿 이름이다. 값은 들어 있지 않다.
  AppSecretInfo: 값을 뺀 시크릿 하나다.
  AppSecretsUpdate: 한 범위(앱 단위 또는 인스턴스 하나)의 시크릿을 한 번에 바꾸는 요청이다. set과 delete 중 하나는 있어야 한다.
  AppSecretValue: 값을 포함한 시크릿 하나다. operator만 받는다.
  PushToken: '`repo`의 내용(contents)에만 쓸 수 있는 GitHub App 설치 토큰이다.'
  BucketObservation: 파일 복사가 쓸 rclone remote로 서버가 측정한 값이다.
  BucketSample: 프리픽스 하나 아래 처음 객체들을 설명하는 개수다. 키, 값, 내용은 들어 있지 않다.
  SourceStats: 용량 게이트가 측정하는 source 데이터베이스다. hot standby target은 max_connections와 max_worker_processes가 source 이상이어야 시작하고, 게이트는 max_connections가 sessions의 1.2배 이상이기를 요구한다.
  AppCreated: 등록한 앱과 큐에 넣은 첫 배포(trigger register)다.
  AppDeploy: 플랫폼이 GitHub에서 등록한 앱을 배포하는 방식이다. 앱은 자기 `branch`를 앱 이름의 기본 인스턴스로, `POST /v1/apps/{name}/instances`로 추가한 브랜치를 각각 다른 인스턴스로 배포하고, instances에 모두 나온다. repo, environments, createdAt, createdBy를 뺀 나머지 필드는 기본 인스턴스를 설명한다. spec은 `branch`에서 검사를 통과한 가장 최신 platform.yaml이고 specCommit에서 읽은 것이다. 등록할 때와 배포할 때마다 다시 읽는다. lastDeployment는 끝났든 아니든 기본 인스턴스의 가장 최근 배포다.
  AppInstance: 등록한 앱이 배포하는 브랜치 하나다(ADR 0015). 기본 인스턴스는 앱의 `branch`를 배포하고 이름이 앱 이름이다. 다른 인스턴스는 운영자가 추가한 브랜치를 배포하고 이름이 `<app>--<slug>`다. 이 이름이 네임스페이스, gitops 디렉터리 `apps/<instance>/`, Argo CD Application `<instance>-<env>`, 호스트 `<instance>.<app domain>`에 쓰인다. spec은 그 브랜치에서 검사를 통과한 가장 최신 platform.yaml이고 specCommit에서 읽은 것이다.
  AppInstanceCreated: 추가한 인스턴스와 큐에 넣은 첫 배포(trigger register)다.
  AppEnvironmentStatus: 인스턴스의 한 환경에서의 실시간 상태로, Argo CD Application `<instance>-<env>`에서 읽는다. 배포가 그 환경에 닿기 전까지는 pending이다.
  AppSpec: |-
    앱 저장소 루트의 `platform.yaml`에 기본값을 채운 것이다. pkg/appspec이 엄격하게 파싱하고(모르는 키는 오류) 다음 규칙을 검사한다.

    - `name`은 `^[a-z0-9][a-z0-9-]{1,30}[a-z0-9]$`(3자에서 32자)에 맞고 `--`가 없어야 한다. `--`는 인스턴스 이름(`<name>--<branch slug>`)에서 앱과 브랜치를 나누기 때문이다. name은 기본 인스턴스(네임스페이스, Argo CD Application `<name>-<env>`, 공개 URL `https://<name>.hopcharlie.dev`)와 모든 인스턴스가 함께 쓰는 이미지 `<registry>/hopcharlie/apps/<name>/<service>`의 이름이 된다.
    - 서비스는 1개에서 5개, 리소스는 종류마다 1개까지다. 서비스 이름과 리소스 이름은 `^[a-z]([a-z0-9-]{0,22}[a-z0-9])?$`에 맞고 겹치지 않아야 한다.
    - `port`는 쓰면 1에서 65535다. `port`가 없거나 0인 서비스는 워커다. Service와 probe가 없고 실행되면 준비된 것으로 보며, `public`일 수 없고 `healthCheck`를 쓸 수 없다. 워커만 있는 앱도 되고, 그 앱에는 URL이 없다.
    - `replicas`는 1에서 5이고, `public`인 서비스는 1개까지이며, `healthCheck`를 쓰면 `/`로 시작해야 한다.
    - `memory`는 쓰면 바이트 정수로 256Mi에서 1536Mi, `cpu`는 밀리코어 정수로 50m에서 500m다(ADR 0024). 모든 서비스의 (replicas + 1) x memory 합은 3Gi 이하, (replicas + 1) x cpu 합은 1500m 이하여야 한다. memory를 쓰지 않은 서비스는 256Mi, cpu를 쓰지 않은 서비스는 50m로 센다. 롤링 업데이트 동안 서비스마다 파드가 하나 더 떠도 DB와 함께 네임스페이스 quota 안에 들게 하기 위해서다. 노드에 남은 용량은 quota보다 작을 수 있어서, CPU 몫을 거의 다 쓰는 앱은 노드에 그만큼 자리가 날 때까지 Pending일 수 있다.
    - `path`와 `dockerfile`은 상대 경로이고 `..`이 없어야 한다.
    - `env` 키는 `^[A-Z_][A-Z0-9_]*$`에 맞고 플랫폼이 넣는 변수(`PORT`, `DATABASE_URL`, `PGHOST`, `PGPORT`, `PGDATABASE`, `PGUSER`, `PGPASSWORD`, `JDBC_DATABASE_URL`, `S3_*`)가 아니어야 한다.

    AppSpecValidation은 규칙을 어긴 파일의 spec도 돌려주므로 규칙을 스키마 키워드로 다시 적지 않는다.
  AppSpecValidation: platform.yaml을 검사한 결과다. spec은 파일을 디코딩할 수 있으면 규칙을 어겨도 기본값을 채워 들어 있다. commit은 저장소를 검사할 때 브랜치를 찾은 뒤 파일을 읽은 커밋이다.
  AppSpecValidateRequest: '`repo`(와 `branch`)나 `spec` 중 하나를 보낸다.'
  AppSpecInvalid: 422 invalid_app_spec의 본문이다. error는 보통의 Error 본문이고, validation에 실패한 항목이 나온다.
  Deployment: 앱의 커밋 하나를 인스턴스 하나에, 하나 이상의 환경으로 배포한 것이다.
  DeploymentEvent: |-
    배포의 단계 하나다.

    - phase: 배포가 `phase`에 들어갔다. `message`에 설명이 더 있을 수 있다.
    - log: `phase`에서 나온 빌드나 배포 출력 한 줄이 `message`에 있다.
    - environment: `env`의 상태가 바뀌었다. `message`에 어떻게 바뀌었는지 나온다(예: "Synced, Healthy").
    - done: 배포가 `phase`(healthy, failed, superseded)로 끝났다. 실패했으면 `message`가 오류다. 배포의 마지막 이벤트다.

# Field descriptions in the schema tables.
fields:
  EnginePlan.id: 계획 id
  EnginePlan.files: rclone으로 옮길 오브젝트 스토리지
  EnginePlan.files.source: 서버에 등록된 버킷과 정확히 같아야 한다 (앱 버킷 또는 PLATFORM_PLAN_BUCKETS)
  EnginePlan.files.target: 등록된 버킷이어야 하고 source와 달라야 한다
  EnginePlan.files.flags: rclone 플래그. 허용된 플래그만 통과한다
  EnginePlan.files.rclone: '"rclone"이거나 생략한다. remote 자격 증명은 서버 환경 변수(`RCLONE_CONFIG_<REMOTE>_*`)에서 가져온다'
  EnginePlan.gateway.mode: http면 게이트웨이 관리 API로 트래픽을 옮기고, none이면 건너뛴다 (리허설, 수동)
  EnginePlan.gateway.url: 게이트웨이 관리 API 주소(PLATFORM_GATEWAY_URL). 등록한 앱의 DB를 옮기는 계획이면 정확히 그 앱의 범위 `<PLATFORM_GATEWAY_URL>/apps/<app>`이어야 하고, 어느 앱의 DB도 아니면 관리 API 주소 그대로(게이트웨이의 기본 앱)다. 초안은 앱의 범위를 쓴다
  EnginePlan.gateway.token: '`${GATEWAY_TOKEN}`만 허용한다'
  EnginePlan.gateway.sourceBackend: 기본값은 source.env
  EnginePlan.gateway.targetBackend: 기본값은 target.env
  EnginePlan.verify.schemas: 비교할 스키마, 기본값 ["public"]
  EnginePlan.verify.tables: 비교할 테이블 필터, `schema.table` 또는 `table`
  EnginePlan.verify.fenceGate: 쓰기를 붙잡은 상태에서 target 승격 전에 테이블별 개수와 해시를 비교한다. 불일치면 자동 롤백한다. 기본값 true
  EnginePlan.verify.writtenRecords: '`stream:<name>`이면 해당 스트림의 쓰기가 모두 target에 있는지 확인한다'
  EnginePlan.thresholds.maxLagBytes: 허용하는 복제 지연, 기본값 16 MiB
  EnginePlan.thresholds.catchupTimeout: 복제 지연을 따라잡는 제한 시간, 기본값 10m
  EnginePlan.thresholds.switchoverTimeout: switchover 제한 시간, 기본값 2m
  EnginePlan.thresholds.maxDowntime: 허용하는 최대 쓰기 중단 시간, 기본값 3m
  EnginePlan.thresholds.maxFenceGate: fence 게이트에 허용하는 최대 시간. delta가 쓰기를 붙잡기 전에 미리 재 본다. 기본값 20s
  EnginePlanEndpoint.env: 환경 이름
  EnginePlanEndpoint.kubeconfig: 서버 정책상 kubeconfig 경로는 쓸 수 없다
  EnginePlanEndpoint.context: kube context
  EnginePlanEndpoint.cluster: CNPG Cluster 이름
  EnginePlanEndpoint.dsn: '`postgres://` DSN. 비밀번호는 허용된 `${VAR}` 하나로만 참조한다'
  EnginePlanEndpoint.manifest: 'target에만 쓴다. 예: `attachment:target.yaml`'
  PlanEndpoint.dbHost: DSN이 접속하는 host:port (자격 증명 제외). 승인자가 DB 비밀번호가 어디로 가는지 볼 수 있게 보여 준다
  PlanSummary.files: 오브젝트 스토리지도 옮기는 계획인지
  PlanRecord.revision: 제출 시 1이고 첨부를 올릴 때마다 1 오른다. 검토한 revision으로 승인한다
  PlanRecord.rollbackOf: 이 계획이 되돌리는 run
  PlanRecord.reviewedBy: 승인 또는 거절한 사람
  PlanRecord.runId: 이 계획으로 시작한 run
  PlanRecord.attachments: 이 계획에 올린 파일
  ReviewRequest.revision: 승인에만 쓴다. 승인자가 검토한 revision이며, 첨부가 있는 계획이면 필수다
  StartMigrationRequest.autoSwitch: 데이터가 동기화되면 /switch를 기다리지 않고 바로 전환한다
  StartMigrationResponse.links.self: run 경로
  StartMigrationResponse.links.events: 이벤트 스트림 경로
  ObserveOptions.duration: 전체 관찰 시간, 10s에서 30m 사이
  ObserveOptions.stepDuration: 게이트 평가 한 번이 다루는 구간
  ObserveOptions.autoRollback: 위반 시 서버가 롤백을 바로 시작한다
  ObserveResult.passed: 'true: 전체 기간을 관찰했고 위반이 없으며 판정 가능한 step이 하나 이상 있었다. false: 위반한 step이 있다. 없음: 관찰 중이거나, 일찍 끝났거나, 판정 가능한 측정이 없었다'
  ObserveResult.violation: 위반한 게이트의 사유
  ObserveResult.stoppedReason: 기간을 다 채우기 전에 관찰이 끝난 이유
  ObserveResult.rollbackRunId: 자동 롤백 run (그 run의 rollbackOf가 이 run이다)
  ObserveResult.rollbackError: 자동 롤백을 시작하지 못한 이유
  CanaryOptions.weights: step별로 target에 보낼 읽기 비율(%)
  GateThresholds.maxErrorRate: 요청 대비 5xx와 프록시 오류의 비율
  GateThresholds.minRequests: 요청이 이보다 적으면 게이트를 통과할 수 없다. 마지막이 아닌 canary step은 inconclusive, 마지막 canary step은 실패, observe step은 inconclusive다
  AbortRequest.reason: 중단 사유
  RollbackRequest.reason: 롤백 사유
  RollbackRequest.autoSwitch: 데이터가 동기화되면 바로 전환한다. false면 awaiting_switch에서 /switch를 기다린다
  Run.statusReason: run이 그렇게 끝난 이유
  Run.rollbackOf: 이 run이 되돌리는 run
  Run.switchApprovedBy: 전환을 승인한 사람
  RunResult.downtimeMillis: 게이트웨이에서 쓰기를 붙잡은 시간
  RunResult.durationMillis: 시작부터 끝까지 걸린 시간
  RunResult.requests: run 동안 게이트웨이가 처리한 요청 수
  RunResult.failedRequests: run 동안의 5xx와 프록시 오류 수
  RunResult.missingRows: target에 없는 source 행 수
  RunResult.missingWrites: k6가 확인한 쓰기 중 target에 없는 수
  RunResult.missingFiles: target에 없는 객체 수
  RunResult.verified: verify 보고서에 문제가 없다
  CanaryStep.weight: 이 step의 target 읽기 비율(%)
  CanaryStep.verdict: 'ok: 통과했다. inconclusive: 마지막이 아닌 step에서 요청이 너무 적었고 canary는 계속됐다. failed: run이 롤백됐다'
  EngineState.steps: '단계 이름이 키다: precheck, prepare, presync, delta, fence, switchover, start-target, cutover, verify, finalize. start-target은 cold 계획의 target 앱을 띄우고, 다른 계획은 건너뛴다. 이 단계가 생기기 전의 run에는 이어서 실행하기 전까지 start-target 기록이 없다'
  EngineState.writesHeld: 게이트웨이가 쓰기를 붙잡고 있다
  EngineState.fenceLsn: 쓰기를 붙잡은 시점의 LSN
  EngineState.sourceDemoted: source가 강등됐다
  EngineState.promoteRequested: 이 시점 이후로는 자동으로 롤백하지 않는다
  EngineState.trafficOnTarget: 트래픽이 target으로 옮겨졌다
  StepRecord.evidence: 단계가 남긴 근거 데이터
  RunEvent.kind: 이벤트 종류. SSE event 이름으로도 쓴다
  RunEvent.data: kind별 데이터
  Environment.gatewayBackend: 이 환경을 서비스하는 게이트웨이 백엔드
  Environment.live: 게이트웨이가 지금 쓰기를 이 환경으로 보낸다
  EnvironmentStatus.reachable: API 서버가 /version에 응답했다
  EnvironmentStatus.error: '상태가 불완전한 이유. reachable이 true여도 채워질 수 있고(예: RBAC로 nodes 조회 금지), 그 부분은 빠진다'
  EnvironmentStatus.databases: CNPG 클러스터. 없거나 CNPG가 설치되지 않았으면 빈 배열, 읽지 못했으면 생략한다
  NodeSummary.architectures: 노드 CPU 아키텍처 목록
  DatabaseCluster.replica: spec.replica.enabled이거나, topology가 다른 클러스터를 primary로 지정한다
  DatabaseBackup.objectStore: Cluster 네임스페이스에 있는 plugin의 ObjectStore
  DatabaseBackup.walArchiving: Cluster의 ContinuousArchiving 조건이 False이면 false다. WAL이 오브젝트 스토어에 올라가지 않는다. 아직 조건을 보고하지 않은 Cluster는 보관 중으로 본다
  DatabaseBackup.firstRecoverabilityPoint: 복원으로 되돌릴 수 있는 가장 이른 시각
  TrafficState.writeBackend: 읽기가 아닌 모든 요청이 가는 백엔드
  TrafficState.readWeights: 백엔드별 읽기 비율, 합계는 100
  TrafficState.writesHeld: 쓰기를 붙잡고 있는지
  TrafficState.heldWrites: 지금 대기 중인 쓰기 요청 수
  TrafficState.maxHold: 이보다 오래 붙잡힌 쓰기는 503 hold_timeout을 받고 전달되지 않는다. hold 자체는 해제할 때까지 유지된다
  TrafficState.stats: 백엔드별 이동 구간 통계
  TrafficState.totals: 게이트웨이 시작 이후 백엔드별 누적값
  BackendTotals.errors: 클라이언트에 도달한 500 이상 응답
  BackendTotals.retried: 다른 백엔드로 한 번 더 보낸 실패한 읽기
  RouteRequest.backend: 쓰기를 보낼 백엔드
  WeightsRequest.readWeights: 백엔드별 읽기 비율
  Matrix.environments: 환경 이름 목록
  MatrixRoute.runId: 이 쌍에서 끝난 run이 없으면 없다
  AuditEntry.action: 메서드와 경로 템플릿
  AuditEntry.target: 실제 요청 경로
  AuditEntry.status: 응답의 HTTP 상태
  AuditList.nextBefore: 다음 페이지를 볼 때 before로 넘긴다
  SecurityFinding.id: 수집할 때마다 같은 값이다. environment, source, check, resource와 공급자의 finding id(GuardDuty finding id, Security Hub finding ARN) 또는 규칙의 프로토콜, 포트, CIDR로 만든 해시다
  SecurityFinding.environment: 환경 이름, 또는 aws-account, platform
  SecurityFinding.source: kubernetes, aws-iam, aws-ec2, aws-cloudtrail, aws-guardduty, aws-securityhub, aws-s3, platform-audit, platform-config, storage-keys
  SecurityFinding.check: finding을 만든 규칙
  SecurityFinding.resource: 'finding의 대상. 예: shop/Deployment/web/app/app 또는 ARN'
  SecurityFinding.observedAt: 소스가 보고한 시각, 또는 읽은 시각
  SecuritySource.message: 상태가 ok가 아닌 이유, 또는 읽은 내용
  SecuritySource.findings: 이 응답에 포함된 이 소스의 finding 수
  SecuritySummary.byEnvironment: 환경별 개수. 소스가 있는 환경은 finding이 없어도 나온다
  SecurityReport.generatedAt: 소스를 읽은 시각
  SecurityReport.storageKeys: 앱 인스턴스의 버킷 키. 환경(sources 순서), 인스턴스 순이고 인스턴스마다 쓰는 키, 옛 키, 기록에 없는 키 순이다. 소스 storage-keys가 기록을 읽지 못했거나 제때 답하지 않은 환경의 키는 빠지므로, 모든 storage-keys 소스가 ok일 때만 빈 목록이 키가 없다는 뜻이다
  StorageKey.driver: 키를 만든 드라이버. aws, gcs, minio
  StorageKey.bucket: 키가 쓸 수 있는 유일한 버킷
  StorageKey.keyId: 키 id의 끝 4자
  StorageKey.createdAt: 클라우드가 키를 만든 시각(aws는 IAM CreateDate, gcs는 HMAC timeCreated). minio는 기록하지 않아 없고, 읽지 못한 키도 없다
  StorageKey.message: 상태가 ok가 아닌 이유나 할 일
  StorageKeyScope.actions: S3 작업(aws, minio) 또는 GCS 역할(gcs)
  StorageKeyScope.boundary: 'aws: 앱 사용자를 만들 때 붙이는 permissions boundary. 어떤 정책도 이 범위를 넘지 못한다'
  SecurityReport.findings: 심각한 것부터 정렬한다
  AgentSessionTotals.durationMillis: 이벤트 durationMillis의 합. 실제 경과 시간은 endedAt - createdAt이다
  AgentSession.actor: 세션을 시작한 토큰 이름
  AgentSession.summary: 종료할 때 남긴 요약
  AgentEventRequest.tool: tool_call, tool_result, blocked일 때 도구 이름
  AgentEventRequest.input: 임의 JSON 값, 64 KiB 이하
  AgentEventRequest.output: 임의 JSON 값, 64 KiB 이하
  AgentEvent.input: 임의 JSON 값. 자격 증명처럼 보이는 값은 "[redacted]"
  AgentEvent.output: 임의 JSON 값. 자격 증명처럼 보이는 값은 "[redacted]"
  AgentEventList.nextAfter: 이 페이지 뒤에 이벤트가 더 있으면 채운다. after로 넘기면 이어서 읽는다
  WrittenRecord.table: '`schema.table` 또는 `table`'
  WrittenRecord.pk: 기본 키를 텍스트로 쓴다. 복합 키는 `(a,b)`
  WrittenRecord.at: 쓰기가 성공한 시각. 기본값은 서버가 받은 시각
  WrittenRecordsAccepted.accepted: 저장한 레코드 수
  WrittenRecordStats.latestAt: 가장 최근 레코드의 시각. 스트림이 비어 있으면 없다
  PlanAttachment.size: 바이트 수
  PlanAttachment.sha256: 내용의 SHA-256 (hex)
  App.environments: PLATFORM_APPS_FILE에 따라 앱이 실행되는 환경, PLATFORM_ENVS_FILE 순서. GitHub에서만 등록한 앱은 비어 있다 (deploy.environments 참고)
  AppDatabase.schemas: 검증에서 비교할 스키마. 비어 있으면 엔진 기본값(public)
  AppEnvironment.dbHost: 클러스터 -rw 서비스의 host:port
  AppEnvironment.bucket: 앱 파일이 있는 rclone remote와 버킷
  PlanDraftRequest.files: false면 두 환경에 버킷이 있어도 오브젝트 스토리지를 뺀다
  PlanDraftRequest.writtenRecordsStream: verify.writtenRecords를 `stream:<name>`으로 채운다
  PlanDraftRequest.sourceStats: source 데이터베이스도 측정한다. 응답이 PlanDraftResult가 된다
  PlanDraftResult.sourceStatsReason: sourceStats가 없는 이유. not_measured는 비밀번호 변수가 없거나, 데이터베이스에 접속하지 못했거나, 쿼리가 실패한 경우다
  SourceStats.sessions: 지금의 클라이언트 세션 수 (pg_stat_activity의 client backend)
  SourceStats.bytes: 접속을 받는 데이터베이스의 전체 크기. 측정하지 못했으면 없다
  SourceStats.walBytesPerSecond: 측정 구간 동안 초당 쓴 WAL 바이트. 측정하지 못했으면 없다
  SourceStats.windowSeconds: WAL 측정 구간의 길이
  BucketInspectRequest.bucket: 레지던시 정책에 등록된 버킷, 계획에서 쓰는 형식(`remote:bucket[/path]`)
  BucketInspectRequest.prefix: 객체를 설명할, 목록에 나온 첫 단계 프리픽스 하나 (`/`로 끝난다)
  BucketObservation.hosting: '`provider`: 공급자 엔드포인트의 AWS S3나 GCS이고, 위치는 공급자가 알려 준다. `self`: 운영자가 운영하는 저장소(MinIO)이고, 리전은 자체 설정일 뿐이다'
  BucketObservation.location: 소문자 위치 코드. 자체 호스팅 저장소가 알려 주지 않으면 비어 있다
  BucketObservation.locationType: region, dual-region, multi-region 중 하나. 모르면 비어 있다
  BucketObservation.endpointIPs: 엔드포인트 호스트를 해석한 주소
  BucketObservation.prefixes: 첫 단계 프리픽스. ""는 버킷 경로 바로 아래의 객체를 뜻한다
  BucketObservation.replicas: 이 버킷이 복제하는 대상 버킷 (inspect가 읽지 않는다)
  BucketObservation.tiered: 자체 호스팅 저장소의 수명 주기 규칙이 객체를 다른 계층으로 옮긴다
  BucketPrefixStatus.status: '`unclassified`: 목록에는 있지만 정책에 없다(run이 거부된다). `missing`: 정책에는 있지만 목록에 없다'
  BucketPrefixStatus.label: 정책에 레이블이 있으면 그 레이블
  BucketSample.objects: 읽은 객체 수 (최대 50)
  BucketSample.truncated: 읽은 것보다 객체가 더 있다
  BucketSample.metadataKeys: 사용자 메타데이터 이름 (값은 넣지 않는다)
  BucketSample.keyPatterns: 개인정보 패턴마다 그 패턴에 맞는 키의 수
  BucketSample.maxDepth: 프리픽스 아래 가장 깊은 키의 깊이 (경로 세그먼트 수)
  BucketInspection.environment: 정책상 버킷이 있는 환경
  BucketInspection.label: 버킷의 레이블. 버킷 경로 바로 아래의 객체에 적용된다
  SecurityOCSFExport.ocsfVersion: 이벤트가 따르는 OCSF 버전
  SecurityOCSFExport.generatedAt: 소스를 읽은 시각 (SecurityReport.generatedAt과 같다)
  SecurityOCSFExport.findings: OCSF 스키마가 정의한 Detection Finding(2004)과 Compliance Finding(2003) 이벤트 (snake_case 키, `time`은 epoch 밀리초). 형태는 이 API가 아니라 OCSF 표준을 따르므로 여기서 다시 적지 않는다
  AppCreateRequest.repo: GitHub App 설치가 볼 수 있는 저장소의 owner/name
  AppCreateRequest.branch: platform.yaml을 읽고 push를 배포하는 브랜치
  AppCreateRequest.environments: 배포할 환경, PLATFORM_ENVS_FILE의 이름
  AppCreateRequest.autoDeploy: branch에 push할 때마다 배포한다
  AppDeploy.environments: 앱을 배포하는 환경, PLATFORM_ENVS_FILE 순서
  AppDeploy.autoDeploy: branch에 push할 때마다 배포한다
  AppDeploy.url: 트래픽 게이트웨이를 거쳐 공개 서비스가 답하는 주소. 공개 서비스가 없으면 없다
  AppDeploy.createdBy: 앱을 등록한 토큰 이름
  AppDeploy.status: environments의 환경마다 하나, 같은 순서
  AppDeploy.instances: 앱의 모든 인스턴스. 기본 인스턴스가 먼저이고 나머지는 브랜치 이름순
  AppInstance.default: 앱 자신의 브랜치다. 이 인스턴스는 앱과 함께만 지워진다
  AppInstance.autoDeploy: branch에 push할 때마다 이 인스턴스를 배포한다
  AppInstance.url: '`https://<instance>.<domain>`, 트래픽 게이트웨이를 거쳐 공개 서비스가 답하는 주소. 공개 서비스가 없으면 없다'
  AppInstance.createdBy: 앱을 등록한(기본 인스턴스) 또는 브랜치를 추가한 토큰 이름
  AppInstance.status: 앱의 환경마다 하나, 앱의 순서
  AppInstanceCreateRequest.branch: 앱 저장소의 브랜치. 앱 자신의 브랜치는 안 된다
  AppInstanceCreateRequest.autoDeploy: branch에 push할 때마다 배포한다
  AppEnvironmentStatus.syncStatus: 'Argo CD sync 상태: Synced, OutOfSync, Unknown'
  AppEnvironmentStatus.healthStatus: 'Argo CD health 상태: Healthy, Progressing, Degraded, Suspended, Missing, Unknown'
  AppEnvironmentStatus.commit: 그 환경에서 실행 중인 앱 커밋
  AppEnvironmentStatus.url: 이 환경에서 공개 서비스가 답하는 주소 (알 때만)
  AppSpecService.path: docker 빌드 컨텍스트, 저장소 루트 기준 상대 경로
  AppSpecService.dockerfile: path 기준 상대 경로
  AppSpecService.port: 서비스가 듣는 포트. 서비스는 이 값을 PORT로 받는다. 워커는 쓰지 않고, 그러면 Service, probe, PORT가 없다
  AppSpecService.memory: 'Kubernetes 수량, 바이트 정수로 256Mi에서 1536Mi. 컨테이너의 memory request이자 limit이다. 쓰지 않으면 환경 기본값(request 64Mi, limit 256Mi)'
  AppSpecService.cpu: 'Kubernetes 수량, 밀리코어 정수로 50m에서 500m. 컨테이너의 CPU request이고 CPU limit은 없다. 쓰지 않으면 환경 기본값(50m)'
  AppSpecService.healthCheck: 서비스가 준비되면 2xx로 답하는 HTTP 경로
  AppSpecService.public: '트래픽 게이트웨이를 거쳐 `https://<app>.hopcharlie.dev`로 서비스한다'
  AppSpecService.env: '플랫폼이 넣는 변수 외의 환경 변수. 값은 문자열이다. YAML이 숫자, 불리언, null로 읽는 값(`4`, `yes`, `0755`, `~`)은 오류이므로 따옴표로 감싼다. platform.yaml은 git에 있으므로 비밀을 넣지 않는다. 값에 `$(NAME)`을 쓰면 Kubernetes가 플랫폼이 넣은 변수로 바꾸므로 앱이 읽는 이름으로 넘길 수 있다. 예: `KC_DB_URL_HOST: "$(PGHOST)"`, `SPRING_DATASOURCE_URL: "$(JDBC_DATABASE_URL)"`, `AWS_ACCESS_KEY_ID: "$(S3_ACCESS_KEY)"`'
  AppSpecResource.type: 'postgres: CNPG Cluster `<app>-<name>`. 모든 서비스가 시크릿 `<app>-<name>-app`의 `uri` 키에서 DATABASE_URL을 받고, 같은 시크릿에서 PGHOST(`host`), PGPORT(`port`), PGDATABASE(`dbname`), PGUSER(`username`), PGPASSWORD(`password`), JDBC_DATABASE_URL(`jdbc-uri`)을 받는다. s3: 버킷. 모든 서비스가 S3_ENDPOINT, S3_BUCKET, S3_REGION, S3_PATH_STYLE, S3_ACCESS_KEY, S3_SECRET_KEY를 받는다'
  AppSpecFieldError.path: platform.yaml 안의 위치. 파일 전체의 오류(없음, YAML이 아님, 모르는 키)면 비어 있다
  AppSpecValidation.errors: 통과하면 비어 있다
  AppSpecValidateRequest.repo: owner/name. branch의 head에서 GitHub App으로 platform.yaml을 읽는다
  AppSpecValidateRequest.spec: 대신 검사할 platform.yaml 내용, 64 KiB까지
  Deployment.branch: 이 배포가 배포하는 인스턴스의 브랜치. 앱의 브랜치이거나 추가한 브랜치다
  Deployment.instance: 배포하는 인스턴스 (AppInstance 이름)
  Deployment.ref: 요청한 것. 브랜치, 태그, 커밋 sha 중 하나
  Deployment.commit: ref를 푼 전체 커밋 sha
  Deployment.triggeredBy: '토큰 이름(register, manual) 또는 push한 사람의 `github:<login>`(push)'
  Deployment.images: '이미지를 빌드한 서비스마다 하나, digest로 고정한다: `<registry>/hopcharlie/apps/<app>/<service>@sha256:<digest>`. 이미지에는 커밋 태그도 붙는다'
  Deployment.environments: 대상 환경마다 하나, 앱의 순서
  Deployment.error: 배포가 실패한 이유
  Deployment.buildId: AWS CodeBuild 빌드 id, 또는 로컬 docker 빌드의 id (E2E)
  Deployment.startedAt: 배포 작업자(deployer)가 큐에서 가져간 시각
  Deployment.finishedAt: 최종 상태에 도달한 시각
  DeploymentEnvironment.syncStatus: 'Application `<instance>-<env>`의 Argo CD sync 상태'
  DeploymentEnvironment.healthStatus: 'Application `<instance>-<env>`의 Argo CD health 상태'
  DeploymentEnvironment.url: 이 환경에서 공개 서비스가 답하는 주소 (알 때만)
  DeploymentEnvironment.message: Argo CD의 sync 메시지나 환경이 실패한 이유 같은 최신 설명
  DeploymentCreateRequest.branch: '앱이 배포하는 브랜치. 앱 자신의 브랜치나 `POST /v1/apps/{name}/instances`로 추가한 브랜치다. 인스턴스를 고르며, 기본값은 앱의 브랜치'
  DeploymentCreateRequest.ref: 그 인스턴스에 배포할 앱 저장소의 브랜치, 태그, 커밋 sha. 기본값은 branch
  DeploymentCreateRequest.environments: 앱 환경의 일부. 기본값은 전부
  Principal.name: 토큰 이름
  Session.token: 이 응답에서만 보인다. 서버는 해시만 저장한다
  DeviceLoginStartRequest.client: 무엇이 요청하는지. 관리자가 승인하기 전에 본다
  DeviceLoginStart.deviceCode: POST /v1/auth/device/token에 보내는 CLI의 비밀. 화면에 보여 주지 않는다
  DeviceLoginStart.userCode: 넷씩 두 묶음인 8글자. 사람이 콘솔에 넣는다
  DeviceLoginStart.verificationUri: 코드를 넣는 콘솔 화면 주소
  DeviceLoginStart.expiresIn: 기기 로그인이 만료될 때까지 남은 초
  DeviceLoginStart.interval: 폴링 사이에 기다릴 초
  DeviceLogin.reviewedBy: 승인하거나 거절한 관리자. 검토한 뒤에만 있다
  DeviceLogin.role: CLI 토큰이 받을 역할. 승인한 뒤에만 있다
  DeviceLogin.expiresAt: 만료 시각. 승인하면 승인 시각 뒤 10분보다 이르지 않게 늘어난다
  DeviceLoginApproveRequest.role: CLI 토큰에 줄 역할 (viewer, agent, operator)
  AppSecretInfo.updatedBy: 마지막으로 넣은 사람
  InstanceSecrets.secrets: 이 인스턴스의 덮어쓰기, 이름순
  AppSecrets.app: 앱 단위 시크릿, 이름순. 덮어쓰지 않은 인스턴스는 모두 이 값을 받는다
  AppSecrets.instances: 덮어쓰기가 하나라도 있는 인스턴스, 인스턴스 이름순
  AppSecretsUpdate.instance: 이 인스턴스의 덮어쓰기를 바꾼다(기본 인스턴스는 앱 이름). 없거나 비어 있으면 앱 단위 시크릿을 바꾼다
  AppSecretsUpdate.set: 넣거나 바꿀 시크릿, 이름과 값, 50개까지. 값은 UTF-8로 1바이트에서 4096바이트
  AppSecretsUpdate.delete: 지울 이름, 50개까지. 없는 이름은 무시한다
  AppSecretValue.instance: 이 값이 덮어쓰기인 인스턴스. 앱 단위 값이면 없다
  PushTokenRequest.repo: scripts/import-repo.sh로 들여온 저장소의 owner/name. `.git`을 붙이지 않는다
  PushToken.repo: 저장소의 지금 owner/name. 이름이 바뀌었으면 요청과 다르다
  PushToken.token: '토큰이다. git HTTPS에서 사용자 `x-access-token`의 비밀번호로 쓴다. 로그에 남기지 않는다'
  PushToken.expiresAt: GitHub이 토큰을 더 받지 않는 시각. 만든 때부터 1시간 뒤다
  DeploymentCreateRequest.redeploy: 인스턴스의 마지막 healthy 배포를 같은 커밋과 이미지로 빌드 없이 지금의 시크릿으로 그 배포가 간 환경에만 다시 배포한다. ref와 함께 쓸 수 없다

# Meaning of enum values, used by {{enum:Name:...}} in template.md.
enums:
  Role:
    viewer: 모든 것을 읽는다
    agent: 읽기와 계획 제출 (AI 플래너)
    operator: 승인, 시작, 전환, 중단, 앱 등록과 배포를 포함한 모든 작업
  PlanStatus:
    pending_approval: 사람의 승인을 기다린다
    approved: 승인됨. 시작할 수 있다
    rejected: 거절됨. 시작할 수 없다
    starting: run을 만드는 중이다. 실패하면 approved로 돌아간다
    started: run이 만들어졌다 (runId가 채워진다)
  RunStatus:
    running: 단계를 실행 중이다
    awaiting_switch: 데이터가 동기화됐고 운영자의 /switch를 기다린다
    succeeded: 트래픽과 데이터가 target에 있고 검증을 통과했다
    rolled_back: source가 다시 트래픽을 받는다. 잃은 데이터는 없다
    halted: target 승격을 요청한 뒤 실패했다. 운영자가 판단한다 (엔진이 승격을 확인하면 resume으로 이어 간다)
    failed: 되돌릴 수 없는 단계 전에 실패했다. resume 가능
    aborted: 되돌릴 수 없는 단계 전에 운영자가 멈췄다. resume 가능
    interrupted: run이 활성 상태일 때 서버가 재시작됐다. resume 가능
  RunPhase:
    sync: precheck, prepare, presync, delta
    canary: 읽기 트래픽 일부를 target으로 보낸다
    awaiting_switch: /switch를 기다린다
    cutover: fence, switchover, start-target, cutover (여기서 쓰기를 붙잡는다)
    verify: verify, finalize
    observe: 선택. 전환 성공 후 target 트래픽을 게이트로 관찰한다
    done: run이 끝났다
  StorageKeyUse:
    current: 인스턴스의 파드가 받는 키
    old: 새 키로 바꾼 뒤 아직 재시작하지 않은 파드가 쓸 수 있는 옛 키. 파드를 다시 띄운 healthy 배포 뒤에 지운다
    unrecorded: '플랫폼 기록에 없는 키(예: 손으로 만든 키). 다음 새 키를 만들기 전에 드라이버가 지운다'
  StorageKeyState:
    ok: 클라우드에 있고 활성이다
    inactive: 클라우드에 있지만 비활성이다. 플랫폼은 있는 키로 세므로 쓰는 키가 비활성이면 활성화하거나 지울 때까지 앱이 버킷을 쓰지 못한다
    missing: 기록한 키가 클라우드에 없다(플랫폼 밖에서 지움). 다음 배포가 새 키를 만든다
    unread: 클라우드에서 읽지 못했다. message에 이유가 나온다
  SecuritySourceStatus:
    ok: 전부 읽었다
    unavailable: '소스가 응답하지 않았다 (예: 클러스터에 접근 불가)'
    not_configured: 이 서버에 해당 소스의 자격 증명이나 설정이 없다. message에 빠진 항목이 나온다
    error: '자격 증명을 가져오지 못했거나(예: 인스턴스 메타데이터 시간 초과), 일부 또는 전체 읽기가 실패했다(예: 권한 거부). 실패 전에 읽은 finding은 유지한다'
