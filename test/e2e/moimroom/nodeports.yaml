# Host access: the engine reaches the databases, the gateway reaches the apps.
apiVersion: v1
kind: Service
metadata: { name: moimroom-src-db-host, namespace: moimroom }
spec: { type: NodePort, selector: { cnpg.io/cluster: moimroom-src-db }, ports: [{ port: 5432, targetPort: 5432, nodePort: 30742 }] }
---
apiVersion: v1
kind: Service
metadata: { name: moimroom-dst-db-host, namespace: moimroom }
spec: { type: NodePort, selector: { cnpg.io/cluster: moimroom-dst-db }, ports: [{ port: 5432, targetPort: 5432, nodePort: 30743 }] }
---
apiVersion: v1
kind: Service
metadata: { name: moimroom-src-host, namespace: moimroom }
spec: { type: NodePort, selector: { app.kubernetes.io/instance: moimroom-src }, ports: [{ port: 8080, targetPort: 8080, nodePort: 30201 }] }
---
apiVersion: v1
kind: Service
metadata: { name: moimroom-dst-host, namespace: moimroom }
spec: { type: NodePort, selector: { app.kubernetes.io/instance: moimroom-dst }, ports: [{ port: 8080, targetPort: 8080, nodePort: 30202 }] }
