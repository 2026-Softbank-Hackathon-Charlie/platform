# One S3-compatible store per environment (photos). run.sh replaces MINIO_IMAGE
# (lib.sh) and creates the Secret minio-root. The host reaches each through a
# NodePort so the engine's rclone can copy between them.
apiVersion: apps/v1
kind: Deployment
metadata: { name: minio-src, namespace: moimroom, labels: { app: minio-src } }
spec:
  replicas: 1
  selector: { matchLabels: { app: minio-src } }
  template:
    metadata: { labels: { app: minio-src } }
    spec:
      containers:
        - name: minio
          image: MINIO_IMAGE
          args: ["server", "/data"]
          envFrom: [{ secretRef: { name: minio-root } }]
          ports: [{ containerPort: 9000 }]
          readinessProbe: { httpGet: { path: /minio/health/ready, port: 9000 }, periodSeconds: 2 }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: minio-src, namespace: moimroom }
spec: { selector: { app: minio-src }, ports: [{ port: 9000, targetPort: 9000 }] }
---
apiVersion: v1
kind: Service
metadata: { name: minio-src-host, namespace: moimroom }
spec: { type: NodePort, selector: { app: minio-src }, ports: [{ port: 9000, targetPort: 9000, nodePort: 30762 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: minio-dst, namespace: moimroom, labels: { app: minio-dst } }
spec:
  replicas: 1
  selector: { matchLabels: { app: minio-dst } }
  template:
    metadata: { labels: { app: minio-dst } }
    spec:
      containers:
        - name: minio
          image: MINIO_IMAGE
          args: ["server", "/data"]
          envFrom: [{ secretRef: { name: minio-root } }]
          ports: [{ containerPort: 9000 }]
          readinessProbe: { httpGet: { path: /minio/health/ready, port: 9000 }, periodSeconds: 2 }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: minio-dst, namespace: moimroom }
spec: { selector: { app: minio-dst }, ports: [{ port: 9000, targetPort: 9000 }] }
---
apiVersion: v1
kind: Service
metadata: { name: minio-dst-host, namespace: moimroom }
spec: { type: NodePort, selector: { app: minio-dst }, ports: [{ port: 9000, targetPort: 9000, nodePort: 30763 }] }
