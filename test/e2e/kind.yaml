# One kind cluster holding both CNPG clusters, like the engine rehearsal.
# Host ports reach each Postgres (lib.sh SRC_DB_PORT, DST_DB_PORT).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: hop-e2e
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      - { containerPort: 30432, hostPort: 55642, listenAddress: "127.0.0.1" }
      - { containerPort: 30433, hostPort: 55643, listenAddress: "127.0.0.1" }
