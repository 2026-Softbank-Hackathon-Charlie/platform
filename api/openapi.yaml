openapi: 3.0.3
info:
  title: HopCharlie Platform API
  version: 1.0.0
  description: |
    The single contract shared by the platform server, the `charlie` CLI and the
    web console. Go types are generated into `pkg/apiv1`; the console generates
    TypeScript types from this file (`npx openapi-typescript`).

    Every `/v1` request needs `Authorization: Bearer <token>`, except the
    GitHub App webhook (`POST /v1/webhooks/github`), which GitHub signs
    instead, and the login endpoints under `/v1/auth` marked as public.
    Each token has a role:

    | role     | may |
    |----------|-----|
    | viewer   | read everything |
    | agent    | read, and submit plans (the AI planner) |
    | operator | everything, including approve, start, switch, abort, register and deploy apps |

    A token is one of three kinds, all sent the same way:

    - A console session: an administrator (`PLATFORM_ADMINS`) logs in with
      a username and password (`POST /v1/auth/login`). Role operator, 12 hours.
    - A CLI token: the CLI starts a device login (`POST /v1/auth/device`),
      an administrator logged in to the console enters the code it shows,
      and the CLI exchanges the approved login for a token
      (`POST /v1/auth/device/token`). It carries the approver's name and
      the role the approver picked when approving (operator, agent or
      viewer), 30 days. Only a console session may approve, so a CLI token
      can never mint another token.
    - A static token from `PLATFORM_TOKENS` for programs that cannot log
      in (the AI planner, the load generator, E2E tests). It never expires.

    Sessions and CLI tokens end early with `POST /v1/auth/logout`.

    Errors always use the `Error` body.

    The traffic gateway serves `TrafficState`, `RouteRequest` and `WeightsRequest`
    on its own admin API; they live here so both servers share one type.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []

tags:
  - name: system
  - name: auth
  - name: plans
  - name: migrations
  - name: environments
  - name: traffic
  - name: audit
  - name: apps
  - name: deployments
  - name: github
  - name: onboarding

paths:
  /healthz:
    get:
      tags: [system]
      operationId: getHealth
      security: []
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /openapi.yaml:
    get:
      tags: [system]
      operationId: getOpenAPI
      security: []
      responses:
        "200":
          description: This document.
          content:
            application/yaml:
              schema: { type: string }

  /v1/me:
    get:
      tags: [system]
      operationId: getMe
      description: Who the token belongs to. The CLI calls this to check a login.
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Principal" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/Internal" }

  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      description: |
        Logs an administrator in with a username and password from
        `PLATFORM_ADMINS` and returns a console session token (role
        operator, valid for 12 hours or until POST /v1/auth/logout).

        Error codes: invalid_request (400), invalid_credentials (401: an
        unknown username or a wrong password; the answer does not say
        which), too_many_attempts (429: 10 failed attempts for this
        username in the last 10 minutes, or the server is already checking
        as many logins as it can at once; `Retry-After` gives the seconds to
        wait), login_not_configured (503: the server has no administrators).
        Every success and failure is written to the audit log; a login
        refused because the server was busy is not.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "invalid_credentials: unknown username or wrong password"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Internal" }

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      description: |
        Ends the console session or CLI token that made the request; the
        token answers 401 from then on. A static token from
        `PLATFORM_TOKENS` cannot be ended this way and keeps working; the
        answer is 204 all the same.
      responses:
        "204":
          description: Logged out.
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/Internal" }

  /v1/auth/device:
    post:
      tags: [auth]
      operationId: startDeviceLogin
      security: []
      description: |
        Starts a device login for the CLI (after RFC 8628). Show the person
        `userCode` and `verificationUri` (the console's CLI login page);
        they log in to the console as an administrator and enter the code.
        Meanwhile poll POST /v1/auth/device/token with `deviceCode` every
        `interval` seconds until it returns a token or `expiresIn` seconds
        (10 minutes) pass. `deviceCode` is this client's secret: never show
        or log it. `client` is shown to the administrator before they
        approve, so say what is asking, e.g. "charlie v0.5.0 on rin-sbx-12".

        Error codes: invalid_request (400), too_many_attempts (429: 1000
        device logins are already pending).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceLoginStartRequest" }
      responses:
        "200":
          description: The device login, pending approval.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceLoginStart" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Internal" }

  /v1/auth/device/token:
    post:
      tags: [auth]
      operationId: pollDeviceLogin
      security: []
      description: |
        Exchanges an approved device login for a CLI token with the name of
        the administrator who approved it and the role they picked, valid for 30 days or
        until POST /v1/auth/logout. One device login gives one token: the
        first successful answer ends it.

        Error codes, all 400: invalid_request, authorization_pending (not
        approved yet: ask again after `interval` seconds), access_denied (an
        administrator denied it; it is gone), expired_token (unknown,
        expired, or already exchanged).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceTokenRequest" }
      responses:
        "200":
          description: The CLI token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400":
          description: "invalid_request, authorization_pending, access_denied, expired_token"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Internal" }

  /v1/auth/device/{userCode}:
    parameters:
      - $ref: "#/components/parameters/UserCode"
    get:
      tags: [auth]
      operationId: getDeviceLogin
      description: |
        A device login that has not expired, so the console can show which
        client asks before the administrator approves. Needs operator and
        a console session. Error codes: console_session_required (403),
        device_login_not_found (404: unknown or expired).
      responses:
        "200":
          description: The device login.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceLogin" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Internal" }

  /v1/auth/device/{userCode}/approve:
    parameters:
      - $ref: "#/components/parameters/UserCode"
    post:
      tags: [auth]
      operationId: approveDeviceLogin
      description: |
        Approves a pending device login. The CLI's next poll gets a token
        with the caller's name and the `role` picked here; give a bot only
        what it needs (viewer to read, agent to also submit plans, operator
        to deploy and approve). Approving also gives the CLI 10 more minutes
        from now to exchange it, so `expiresAt` may move later.
        Needs operator and a console session (a password login): CLI tokens
        and static tokens get 403 console_session_required.
        Error codes: invalid_request (400: no or unknown role),
        console_session_required (403), device_login_not_found (404: unknown
        or expired), device_login_state_conflict (409: already approved or
        denied).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceLoginApproveRequest" }
      responses:
        "200":
          description: The device login, now approved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceLogin" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Internal" }

  /v1/auth/device/{userCode}/deny:
    parameters:
      - $ref: "#/components/parameters/UserCode"
    post:
      tags: [auth]
      operationId: denyDeviceLogin
      description: |
        Denies a pending device login. The CLI's next poll gets
        access_denied. Needs operator and a console session.
        Error codes: console_session_required (403),
        device_login_not_found (404: unknown or expired),
        device_login_state_conflict (409: already approved or denied).
      responses:
        "200":
          description: The device login, now denied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceLogin" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Internal" }

  /v1/plans:
    post:
      tags: [plans]
      operationId: submitPlan
      description: |
        Submit an engine plan as-is. The server applies its security policy
        (no kubeconfig paths, gateway and DB host allowlists, environment
        references) and stores the plan as `pending_approval`. A DSN must be a
        `postgres://` URL and may reference one allowed variable, as its whole
        password (`postgres://app:${SRC_PGPASSWORD}@host:5432/db`); an app's
        `passwordEnv` only in a DSN to that app's database host.
        `gateway.token` may only be `${GATEWAY_TOKEN}`; no other field may
        contain `$`. Roles: agent, operator.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnginePlan" }
      responses:
        "201":
          description: Stored, waiting for a human.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
        default: { $ref: "#/components/responses/Internal" }
    get:
      tags: [plans]
      operationId: listPlans
      responses:
        "200":
          description: All plans, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/plans/{ref}:
    parameters:
      - $ref: "#/components/parameters/PlanRef"
    get:
      tags: [plans]
      operationId: getPlan
      description: A plan summary. DSNs and tokens never leave the server.
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/plans/{ref}/approve:
    parameters:
      - $ref: "#/components/parameters/PlanRef"
    post:
      tags: [plans]
      operationId: approvePlan
      description: |
        The human gate between AI planning and execution. Send the plan's
        `revision` you reviewed: approving a plan that has attachments without
        it, or with a revision that changed since (an attachment was uploaded),
        fails with 409 `plan_state_conflict`. Approving twice is a no-op. Role operator.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewRequest" }
      responses:
        "200":
          description: Approved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/plans/{ref}/reject:
    parameters:
      - $ref: "#/components/parameters/PlanRef"
    post:
      tags: [plans]
      operationId: rejectPlan
      description: Reject a pending plan. A rejected plan can never start. Role operator.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewRequest" }
      responses:
        "200":
          description: Rejected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/migrations:
    post:
      tags: [migrations]
      operationId: startMigration
      description: |
        Start an approved plan. Returns 202 as soon as the run exists; it does not
        mean the migration finished. The run syncs data, optionally sends a share
        of read traffic to the target (canary), and then waits in
        `awaiting_switch` until an operator calls `/switch`, unless `autoSwitch`
        is true. With `observe`, a succeeded cutover is followed by an observe
        phase that checks the target against the gate and can start the
        rollback by itself (`observe.autoRollback`). Send the same `Idempotency-Key` to get the original run back on
        a retry. A plan with `verify.writtenRecords: "stream:<name>"` starts only
        once the stream has records (400 `invalid_request` before that). A plan
        with `rollbackOf` gives the run the same `rollbackOf`. When the server
        has a residency policy, the source's databases are listed and the
        whole physical copy is checked against it before the run exists; a
        denial is 409 `residency_denied` (reason codes and `db.schema.table`
        in the message) and the plan stays approved. A plan's `files` copy is
        allowed only between buckets the policy registers, and only when the
        source bucket's classification allows the target bucket's country.
        Rollback plans (`rollbackOf`) are exempt. Unless the server turns the
        check off, the source's and the target's PostgreSQL major versions are
        compared (the target's from its database, or else from the manifest's
        `spec.imageCatalogRef.major` or `spec.imageName` tag); different majors
        are 409 `version_mismatch` (versions in the message), since physical
        replication cannot cross them, and a version that cannot be read does
        not block. When the server measures
        capacity, it reads the source and target for a few seconds first and
        answers 409 `capacity_insufficient` (measured numbers in the message)
        if the target accepts too few connections (fewer than the source's
        client sessions x 1.2), has a `max_connections` or
        `max_worker_processes` below the source's (a hot standby will not
        start then), or the replica cannot catch up within
        `thresholds.catchupTimeout`; values it cannot measure never
        refuse. Rollback plans are exempt here too. Role operator.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartMigrationRequest" }
      responses:
        "202":
          description: The run was created.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StartMigrationResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "502": { $ref: "#/components/responses/BadGateway" }
        default: { $ref: "#/components/responses/Internal" }
    get:
      tags: [migrations]
      operationId: listMigrations
      responses:
        "200":
          description: All runs, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/migrations/{runId}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [migrations]
      operationId: getMigration
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/migrations/{runId}/retention:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [migrations]
      operationId: getSourceRetention
      description: Read the persisted source cleanup schedule. An absent job means this run was not enrolled. No historical enrollment is inferred from success.
      responses:
        "200":
          description: Latest persisted cleanup status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceRetentionResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Internal" }
    post:
      tags: [migrations]
      operationId: preserveSource
      description: Operator only. Extend retainUntil, or set keep=true to cancel automatic cleanup. Exactly one is required. Cannot shorten retention, enroll a run, or change a deleting/deleted/cancelled job. Serialized with migrations and the cleanup worker.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                retainUntil: { type: string, format: date-time, description: "A later deadline, in the future and no more than 30 days from now." }
                keep: { type: boolean, description: true cancels automatic cleanup permanently for this run. }
      responses:
        "200":
          description: Updated persisted schedule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceRetentionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/migrations/{runId}/events:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [migrations]
      operationId: streamMigrationEvents
      description: |
        Server-Sent Events.

        - The first message is `snapshot` (data: `Run`), the current state.
          Snapshots carry no SSE id.
        - Then every `RunEvent`, with the event kind as the SSE event name and
          the event `seq` as the SSE id.
        - When the run ends: a final `snapshot`, then the stream closes.
          While the run is active (including `awaiting_switch`) the stream stays
          open, with `: keep-alive` comments.

        Reconnect with `Last-Event-ID` (or `?after=`) to replay the events you
        missed; they are stored, so nothing is lost. Browsers cannot set the
        Authorization header on `EventSource`; use a fetch-based SSE client.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
        - name: after
          in: query
          required: false
          description: Replay events with seq greater than this. Same as Last-Event-ID.
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        "200":
          description: An event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/migrations/{runId}/switch:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [migrations]
      operationId: switchMigration
      description: |
        Approve the cutover of a run in `awaiting_switch`. The engine then holds
        writes, promotes the target and moves traffic. Role operator.
      responses:
        "200":
          description: Cutover started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/migrations/{runId}/abort:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [migrations]
      operationId: abortMigration
      description: |
        Stop a running migration. The engine's boundary decides the result:
        before writes are held nothing changed (`aborted`); before the target
        is asked to promote it rolls back to the source (`rolled_back`); after
        that it halts (`halted`) for an operator. Role operator.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AbortRequest" }
      responses:
        "200":
          description: Abort requested. Watch the run for its final status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/migrations/{runId}/resume:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [migrations]
      operationId: resumeMigration
      description: |
        Continue a run that is `interrupted` (the server restarted), `failed`
        or `aborted`. Steps that already succeeded are skipped. Like a start,
        it needs records in the plan's written-records stream. Role operator.

        A `halted` run resumes too: the engine first checks that the target's
        promotion went through and nothing else is primary (the target is the
        topology primary, writable and settled; the source follows it and runs
        in recovery), counts the switchover as done and carries on from the
        first unfinished step. If it cannot confirm that, the run ends
        `halted` again with the reason in statusReason. A run that halted
        before the promotion was requested is refused the same way.
      responses:
        "200":
          description: Resumed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/BadGateway" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/envs:
    get:
      tags: [environments]
      operationId: listEnvironments
      description: Registered environments with their live cluster status.
      responses:
        "200":
          description: Environments in configuration order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvironmentList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/envs/{name}:
    parameters:
      - $ref: "#/components/parameters/EnvName"
    get:
      tags: [environments]
      operationId: getEnvironment
      responses:
        "200":
          description: The environment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/traffic:
    get:
      tags: [traffic]
      operationId: getTraffic
      description: |
        The traffic gateway's live state and request statistics. Without
        `app`, the gateway's default app; with it, that app's scope
        (`<gateway>/apps/<app>`), which a migration of the app holds and routes.
      parameters:
        - name: window
          in: query
          required: false
          description: Statistics window, a duration between 1s and 5m.
          schema: { type: string, default: "10s" }
        - name: app
          in: query
          required: false
          description: An app registered on this server (GET /v1/apps). Any other name is 400.
          schema: { type: string, example: moimroom }
      responses:
        "200":
          description: Gateway state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrafficState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/matrix:
    get:
      tags: [migrations]
      operationId: getMatrix
      description: The latest finished run for every source and target pair of environments.
      responses:
        "200":
          description: One row per ordered pair.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Matrix" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/audit:
    get:
      tags: [audit]
      operationId: listAudit
      description: Every state-changing request and every denied request, newest first.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: before
          in: query
          required: false
          description: Return entries with id lower than this (pagination).
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Audit entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /:
    get:
      tags: [system]
      operationId: getRoot
      security: []
      description: Names the service and links to the contract, so a browser pointed at the API host gets an answer.
      responses:
        "200":
          description: Service information.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceInfo" }

  /v1/security:
    get:
      tags: [security]
      operationId: getSecurity
      description: |
        The security and governance state of every environment in one view.
        Kubernetes clusters, the AWS account (IAM, EC2, CloudTrail, GuardDuty,
        Security Hub, S3) and the platform's own audit log and configuration
        are read and normalised into `SecurityFinding`s.

        Every finding comes from a real read. A source that could not be read
        is listed in `sources` with its status and a message and contributes no
        findings; nothing is filled in for it. Results are cached for 60
        seconds; `refresh=true` collects again, at most once every 10 seconds
        (a refresh within that window gets the latest result).

        `storageKeys` lists the bucket keys the platform made for app
        instances, with when the provider made each, whether it is active and
        what it may do (ADR 0027). Every environment with a storage driver is
        the source `storage-keys`; a key of an instance's user that the
        platform has no record of is also a finding
        (`storage.unrecorded-key`).

        The filters apply to `findings`, to the counts in `sources` and to
        `summary`; `environment` also applies to `storageKeys`. Error codes:
        invalid_request (400), security_not_configured (503).
      parameters:
        - name: environment
          in: query
          required: false
          description: Only this environment, e.g. `gke`, `aws-account` or `platform`. Unknown names are a 400.
          schema: { type: string }
        - name: severity
          in: query
          required: false
          description: Minimum severity; `high` returns critical and high findings.
          schema: { $ref: "#/components/schemas/SecuritySeverity" }
        - name: refresh
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Findings, sources and counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Internal" }

  /v1/security/ocsf:
    get:
      tags: [security]
      operationId: getSecurityOCSF
      description: |
        The findings of `GET /v1/security` (same collection, cache and
        filters) as Open Cybersecurity Schema Framework events, for tools that
        read OCSF. A threat detection is a Detection Finding (class 2004); a
        configuration check is a Compliance Finding (class 2003) whose
        `compliance.status_id` is Fail, or Warning for an informational one.
        Every event declares `metadata.version` and the `cloud` profile and
        follows the official class schema of that version; the platform's
        tests validate the mapping against it. Nothing new is read: each value
        comes from the matching `SecurityFinding`.

        `vulnerabilities` and `controls` carry the data of
        `GET /v1/security/vulnerabilities` and `GET /v1/security/controls`
        (same collection, `environment` filter, KEV, EPSS and exceptions):
        each vulnerability is a Vulnerability Finding (class 2002), Suppressed
        with the exception's reason while an exception is active, and
        `is_exploit_available` with the CISA KEV catalog URL only when the CVE
        is KEV-listed; `cve.epss` only when FIRST has a score. Each control
        evaluation is a Compliance Finding (class 2003) with
        `compliance.status_id` Pass, Fail or Unknown; not_applicable
        evaluations are left out. `severity` filters `findings` only. When
        they cannot be built, the two arrays are empty. Error codes as for
        `/v1/security`.
      parameters:
        - name: environment
          in: query
          required: false
          schema: { type: string }
        - name: severity
          in: query
          required: false
          schema: { $ref: "#/components/schemas/SecuritySeverity" }
        - name: refresh
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: OCSF events, most severe first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityOCSFExport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Internal" }

  /v1/security/controls:
    get:
      tags: [security]
      operationId: getSecurityControls
      description: |
        The platform's control catalog and every evaluation of it, from the
        same collection and cache as `GET /v1/security` (ADR 0034). Each
        control is one check with its condition, the asset it evaluates, its
        official references (exact or partial) and what it does not
        establish. Each evaluation is pass, fail, unknown or not_applicable
        for one asset.

        A source that answered is not a pass, and no findings are not a pass:
        a control passes only on an asset the check read. Assets of a source
        that could not be read are one `unknown` evaluation with asset `*`.
        `coverage` counts by environment and domain, with not_applicable
        left out of the denominator, and says which domains have no control
        in an environment yet. There is no overall score. Error codes as for
        `/v1/security`.
      parameters:
        - name: environment
          in: query
          required: false
          schema: { type: string }
        - name: refresh
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Controls, evaluations and coverage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityControlReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Internal" }

  /v1/security/vulnerabilities:
    get:
      tags: [security]
      operationId: getSecurityVulnerabilities
      description: |
        Package vulnerabilities of image digests and the running containers
        that use them (ADR 0034). Scans run outside the request (CI or a
        worker); this endpoint only reads stored results and the clusters'
        running images, from the same collection and cache as
        `GET /v1/security`.

        `scanner.status` not_configured means no scan results are connected:
        empty `scans` and `vulnerabilities` then mean "not scanned", not "no
        vulnerabilities". A running container whose digest has no succeeded
        scan is counted in `summary.notScannedContainers`. Error codes as for
        `/v1/security`.
      parameters:
        - name: environment
          in: query
          required: false
          schema: { type: string }
        - name: refresh
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Scans, vulnerabilities and running images.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityVulnerabilityReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Internal" }

  /v1/security/scans:
    post:
      tags: [security]
      operationId: submitSecurityScan
      description: |
        Stores one scan of one running image digest (SEC-04, ADR 0034). The
        platform's image scan workflow runs Grype outside the API and posts
        each result here; the API never scans. A succeeded scan carries
        Grype's JSON report, which the platform parses and normalises
        (severity as the advisory's source gave it, CVSS kept as given). A
        failed or unsupported scan carries `message` and no report, and its
        image counts as not scanned, never as zero vulnerabilities. A new scan
        of a digest replaces its earlier one. The body may be up to 32 MiB.
        Roles: agent, operator.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecurityScanSubmission" }
      responses:
        "201":
          description: The stored scan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityImageScan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Internal" }

  /v1/security/exceptions:
    get:
      tags: [security]
      operationId: listSecurityExceptions
      description: |
        Every security exception, active, expired and revoked (SEC-08, ADR
        0034). Roles: viewer, agent, operator.
      responses:
        "200":
          description: The exceptions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityExceptionList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Internal" }
    post:
      tags: [security]
      operationId: createSecurityException
      description: |
        Records a time-limited exception for one finding or vulnerability
        (SEC-08, ADR 0034). It never changes severity. `reason` is 1-500
        characters after trimming. `expiresAt` is after now and at most 30
        days later, or at most 7 days for a vulnerability whose CVE is
        KEV-listed. 409 when the target already has an active exception.
        Roles: operator.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecurityExceptionRequest" }
      responses:
        "201":
          description: The stored exception.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityException" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Internal" }

  /v1/security/exceptions/{id}:
    delete:
      tags: [security]
      operationId: revokeSecurityException
      description: |
        Revokes an exception now (SEC-08). The record is kept with
        `revokedAt` and `revokedBy`. 409 when it is already revoked.
        Roles: operator.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The revoked exception.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityException" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Internal" }

  /v1/agent/sessions:
    post:
      tags: [agent]
      operationId: createAgentSession
      description: |
        Start an activity log for one task of the AI agent (planning a
        migration, a sandbox rehearsal, a diagnosis). The session starts as
        `running`; its actor is the token's name. Roles: agent, operator.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAgentSessionRequest" }
      responses:
        "201":
          description: The new session.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Internal" }
    get:
      tags: [agent]
      operationId: listAgentSessions
      parameters:
        - name: planRef
          in: query
          required: false
          schema: { type: string }
        - name: runId
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Sessions, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSessionList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/agent/sessions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [agent]
      operationId: getAgentSession
      responses:
        "200":
          description: The session with its totals.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/agent/sessions/{id}/events:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [agent]
      operationId: appendAgentEvent
      description: |
        Record one tool call, tool result, message, blocked action, decision or
        error. Only the session's actor or an operator may append. A session
        holds at most 5000 events. `input` and `output` are any JSON value up
        to 64 KiB each. Credentials are stored as `"[redacted]"`: string values
        under keys that look like credentials (password, passwd, pwd, pass,
        secret, token, authorization, cookie, api key, private key, credential,
        access key; numbers and booleans are kept, so token counts stay), the
        `value` of an object whose `name` or `key` looks like one, and within
        strings `NAME=value` and `NAME: value` assignments, URL passwords,
        bearer tokens, AWS access key ids and PEM private keys. NUL characters
        are removed and invalid UTF-8 is replaced in every stored string.
        Error codes: agent_session_not_found (404), agent_session_finished
        (409), session_full (409), too_large (413).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentEventRequest" }
      responses:
        "201":
          description: The stored event, with its seq.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Internal" }
    get:
      tags: [agent]
      operationId: streamAgentEvents
      description: |
        Server-Sent Events, with the same contract as a run's events.

        - The first message is `snapshot` (data: `AgentSession`). Snapshots
          carry no SSE id.
        - Then every `AgentEvent`, with the event `type` as the SSE event name
          and the event `seq` as the SSE id.
        - When the session finishes: a final `snapshot`, then the stream closes.
          While it runs the stream stays open, with `: keep-alive` comments.

        Reconnect with `Last-Event-ID` (or `?after=`) to replay the events you
        missed. `format=json` returns one page of the stored events as an
        `AgentEventList` instead of a stream: up to `limit` events after
        `after`, and `nextAfter` when more follow.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
        - name: after
          in: query
          required: false
          description: Replay events with seq greater than this. Same as Last-Event-ID.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [sse, json], default: sse }
        - name: limit
          in: query
          required: false
          description: With `format=json`, the most events to return.
          schema: { type: integer, minimum: 1, maximum: 2000, default: 500 }
      responses:
        "200":
          description: An event stream, or a page of the event list with `format=json`.
          content:
            text/event-stream:
              schema: { type: string }
            application/json:
              schema: { $ref: "#/components/schemas/AgentEventList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/agent/sessions/{id}/finish:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [agent]
      operationId: finishAgentSession
      description: |
        End a running session. Only the session's actor or an operator may
        finish it. A running session with no event for `PLATFORM_AGENT_IDLE`
        (default 30 minutes) is finished by the platform as `cancelled` with
        the summary "no activity for 30m; closed by the platform". Error codes:
        agent_session_not_found (404), agent_session_finished (409).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinishAgentSessionRequest" }
      responses:
        "200":
          description: The finished session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Internal" }

  /v1/written-records/{stream}:
    parameters:
      - name: stream
        in: path
        required: true
        description: 'Stream name, `^[a-z0-9][a-z0-9-]{0,62}$`. A plan refers to it as `verify.writtenRecords: "stream:<name>"`.'
        schema: { type: string }
    post:
      tags: [migrations]
      operationId: appendWrittenRecords
      description: |
        Record real table/PK write receipts with declared scope/coverage. Application
        commits do not prove client response delivery. Before verify, the server
        freezes the central stream count/maximum sequence and exports that cohort;
        late reports are excluded and complete collection is not guaranteed.
        Table names use unquoted PostgreSQL identifiers; control characters in
        table/PK are refused. General roles are agent and operator. Dedicated
        application stream tokens can only POST their exact stream with
        application_commits/reservation_inserts, app.reservations, a positive
        integer PK, matching reservation-<pk> eventId, timestamp and generation.
        These tokens cannot read streams or access other APIs. Stable eventId
        retries deduplicate identical payloads; changed payload or stream
        generation/scope/coverage returns 409 written_record_conflict atomically.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WrittenRecordsRequest" }
      responses:
        "202":
          description: Stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WrittenRecordsAccepted" }
        "409": { $ref: "#/components/responses/Conflict" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
        default: { $ref: "#/components/responses/Internal" }
    get:
      tags: [migrations]
      operationId: getWrittenRecordStats
      description: How many records a stream holds. A stream nobody wrote to has count 0.
      responses:
        "200":
          description: The stream's numbers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WrittenRecordStats" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/plans/{ref}/attachments/{name}:
    parameters:
      - $ref: "#/components/parameters/PlanRef"
      - name: name
        in: path
        required: true
        description: '`^[A-Za-z0-9._-]{1,100}$`, other than `.` and `..`.'
        schema: { type: string }
    put:
      tags: [plans]
      operationId: putPlanAttachment
      description: |
        Upload a file the plan refers to, such as the target CNPG Cluster
        manifest (`target.manifest: "attachment:<name>"`). Allowed only while the
        plan is `pending_approval`, and every upload raises the plan's
        `revision` by one, so the approver approves fixed content.
        Uploading the same name again replaces it. The body is the raw content,
        at most 1 MiB. Approving a plan that refers to a missing attachment
        fails with 409. Roles: agent, operator.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanAttachment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        default: { $ref: "#/components/responses/Internal" }
    get:
      tags: [plans]
      operationId: getPlanAttachment
      description: The attachment as uploaded. 404 `attachment_not_found` when the plan has no attachment of that name.
      responses:
        "200":
          description: The content.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/apps:
    get:
      tags: [apps]
      operationId: listApps
      description: |
        Every app the platform knows. First the apps in the server's
        `PLATFORM_APPS_FILE` (what migrations use) in configuration order, then
        the apps registered from GitHub (`POST /v1/apps`) that the file does
        not name, by name. An app in both is listed once, as the file has it,
        with `deploy` set.

        A registered app that is not in the file is listed with `namespace`
        set to its name, `database` set to `{name: app, user: app, schemas: []}`
        (the CNPG defaults the app chart uses) and empty `environments`; where
        it is deployed is in `deploy`.
      responses:
        "200":
          description: File apps in configuration order, then the other registered apps by name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/Internal" }
    post:
      tags: [apps]
      operationId: createApp
      description: |
        Register an app from a GitHub repository and deploy it. The repository
        holds a Dockerfile per service and `platform.yaml` (AppSpec) at its
        root. The platform reads `platform.yaml` at the head of `branch`
        through the GitHub App and checks it as `POST /v1/apps/validate`
        does, stores the app under the spec's `name`, and queues its first
        deployment (trigger `register`) to every environment in
        `environments`. With `autoDeploy`, every later push to `branch`
        deploys as well (`POST /v1/webhooks/github`).

        A deployment builds one image per service, commits
        `apps/<instance>/<env>.yaml` to the gitops repository and lets Argo CD
        sync the Application `<instance>-<env>` into namespace `<instance>`.
        `branch` is the app's default instance, named after the app; more
        branches are added with `POST /v1/apps/{name}/instances`.

        Error codes: invalid_request (400: an environment that is not in
        PLATFORM_ENVS_FILE, a repo that is not owner/name), app_exists (409:
        another registered app has the name, or the platform serves the name
        itself under the app domain: `api`, `console`, `headlamp` and the
        gateway's default app `app`; or the name is a namespace the app
        clusters keep for the platform and infra, such as `kube-system`,
        `argocd` or `traefik`, which the app ApplicationSet would never
        sync; a name only in PLATFORM_APPS_FILE is not taken),
        storage_cleanup_pending (409: the bucket and key of a deleted app or
        instance with this name are still being deleted; try again later),
        invalid_app_spec (422: the repository, the branch or
        platform.yaml could not be read, or platform.yaml breaks a rule),
        github_unreachable (502), github_not_configured (503),
        storage_not_configured (503: platform.yaml has an s3 resource and
        one of the environments has no storage driver, ADR 0016). Role
        operator.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppCreateRequest" }
      responses:
        "201":
          description: Registered; the first deployment is queued.
          headers:
            Location: { schema: { type: string }, description: "/v1/apps/{name}" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/AppSpecInvalid" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/plans/draft:
    post:
      tags: [plans]
      operationId: draftPlan
      description: |
        Build an engine plan for one app and route from the server's
        configuration, so nobody writes plan JSON by hand. The draft is not
        stored: submit it with `POST /v1/plans`, as is or edited.

        - `id` is `<app>-<source>-to-<target>`; contexts come from the
          environments, clusters and database hosts from the app.
        - DSNs read the password from the environment's `passwordEnv` as `${VAR}`.
        - `files` is set when both environments have a bucket, unless `files` is false.
        - `gateway` is mode `http` with the platform gateway when the server has one, otherwise `none`.
        - With `sourceStats: true` the server also measures the source database
          and the response is a `PlanDraftResult`: the plan under `plan`, the
          numbers under `sourceStats`. This takes about five seconds (the WAL
          rate window). It uses the queries of the capacity gate, so a target
          sized from these numbers passes the same check at start. Only numbers
          are returned, never the address, password or a server message; when
          the source cannot be measured, `sourceStats` is absent and
          `sourceStatsReason` is `not_measured`. Without the flag the response
          is the plan itself, as before.

        Roles: agent, operator.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanDraftRequest" }
      responses:
        "200":
          description: The draft plan, or with `sourceStats` a `PlanDraftResult`.
          content:
            application/json:
              schema:
                # One of two shapes chosen by the request's sourceStats; Go
                # callers decode into EnginePlan or PlanDraftResult themselves.
                x-go-type: json.RawMessage
                oneOf:
                  - $ref: "#/components/schemas/EnginePlan"
                  - $ref: "#/components/schemas/PlanDraftResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/ai-activity:
    get:
      tags: [plans]
      operationId: getAIActivity
      description: |
        What the AI runner (hopai) did lately, read from the observability
        stack's ClickHouse (the HyperDX store): the model it asked, the
        read-only tools the model requested, the sandbox steps and rehearsal
        results. Only parsed fields are returned, never a raw log line. The
        console draws its migration map from it. Without
        PLATFORM_AIOBS_CLICKHOUSE_URL the server answers 503
        `observability_not_configured`; if ClickHouse cannot be reached, 502
        `observability_unavailable`.

        Roles: viewer, agent, operator.
      parameters:
        - { name: minutes, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1440, default: 60 }, description: how far back to read }
      responses:
        "200":
          description: The events, oldest first, and their totals.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIActivity" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/ai-runs:
    get:
      tags: [plans]
      operationId: listAIRuns
      description: |
        The AI runner's runs (ai-sandbox hopai as a Kubernetes Job next to the
        platform), newest first. A run plans the move, submits the plan,
        rehearses it in a sandbox and uploads the report; its steps show as
        agent sessions (`GET /v1/agent/sessions`) and its plan in `GET /v1/plans`.
        Finished runs disappear once the cluster cleans up their Job.

        Roles: viewer, agent, operator.
      parameters:
        - { name: app, in: query, required: false, schema: { type: string }, description: only this app's runs }
      responses:
        "200":
          description: The runs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIRunList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Internal" }
    post:
      tags: [plans]
      operationId: startAIRun
      description: |
        Start the AI runner for one app and route, so nobody runs hopai by
        hand. The app and both environments must be in the server's
        configuration (`GET /v1/apps`). One run per app at a time: a second
        one while the first is running answers 409 `ai_run_active`. Without a
        configured Job template (PLATFORM_AIRUN_JOB_TEMPLATE) the server
        answers 503 `ai_runner_not_configured`.

        Roles: operator.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AIRunRequest" }
      responses:
        "202":
          description: The run started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/residency/buckets/inspect:
    post:
      tags: [plans]
      operationId: inspectBucket
      description: |
        Measure a bucket the residency policy registers, the way the gate
        does before a files copy, and compare its first-level prefixes with
        the policy's prefix catalog. With `prefix` (one listed prefix), the
        objects under it are also described for classification: counts of
        content types, extensions, user metadata names and of keys matching
        fixed personal-data patterns (`email`, `kr_resident_number`,
        `kr_phone`, `card_number`, `date`, `uuid`, `non_ascii`). Object keys,
        metadata values and contents are never returned.

        This helps a person or the AI agent propose labels for unclassified
        prefixes. It is not a verdict: only the policy file, reviewed and
        loaded at startup, decides whether a run may start.

        Roles: agent, operator.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BucketInspectRequest" }
      responses:
        "200":
          description: The bucket's policy entry next to its measurement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BucketInspection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502":
          description: "bucket_probe_failed: the bucket could not be measured; the message holds the probe's fixed code"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "residency_not_configured: the server has no residency policy"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/migrations/{runId}/rollback:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [migrations]
      operationId: rollbackMigration
      description: |
        One-click rollback of a `succeeded` run: migrate back the way it came.
        The server builds the reverse of the run's plan (source and target
        swapped, files and gateway backends swapped, no target manifest because
        the old source still exists as a replica), stores it as a new plan with
        id `<plan id>-rollback` and `rollbackOf` set, approved by the caller,
        and starts it. The new run has `rollbackOf` set. A run is rolled back
        at most once: when an earlier rollback's start failed (for example
        `cluster_busy`), its plan is started again instead of a new one, and
        once that plan has started, 409 `run_state_conflict` names its run. Role operator.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RollbackRequest" }
      responses:
        "202":
          description: The rollback run was created.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StartMigrationResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/BadGateway" }
        default: { $ref: "#/components/responses/Internal" }

  /v1/apps/validate:
    post:
      tags: [apps]
      operationId: validateAppSpec
      description: |
        Check a `platform.yaml` without registering anything. Send `repo` (and
        `branch`) to check the file at the head of that branch through the
        GitHub App, or `spec` to check the given content. The answer is 200
        either way; `valid` says whether it passed and `errors` what failed.

        With `repo`, the repository and the branch must be visible to the
        GitHub App installation, `platform.yaml` must be at the repository
        root, and every service's Dockerfile (`<path>/<dockerfile>`) must exist
        at that commit. Registration and manual deployments run the same
        check. Error codes: invalid_request (400: both or neither of repo and
        spec), github_unreachable (502), github_not_configured (503, repo
        only). Any role.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppSpecValidateRequest" }
      responses:
        "200":
          description: The result of the check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSpecValidation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/apps/{name}:
    parameters:
      - $ref: "#/components/parameters/AppName"
    get:
      tags: [apps]
      operationId: getApp
      description: One app, as `GET /v1/apps` lists it.
      responses:
        "200":
          description: The app.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Internal" }
    delete:
      tags: [apps]
      operationId: deleteApp
      description: |
        Unregister an app. The platform supersedes the app's unfinished
        deployments, commits the removal of `apps/<name>/` and of every added
        instance's `apps/<instance>/` from the gitops repository, and forgets
        the app with its instances and deployments. Argo CD then deletes the
        Applications and the resources they created, so the app's data goes
        with them. The platform also removes every instance from the traffic
        gateway and the app's database routes, and then deletes the buckets
        and keys it made for the app: every instance's file bucket and the
        Postgres backup bucket `<prefix><name>---pg` with its user, keys and
        every object version (ADR 0016, 0037). A bucket that cannot be
        deleted yet is retried every few minutes. 202 means that is under
        way.

        Only registered apps can be deleted. Error codes: app_not_found (404),
        app_not_registered (409: the app is only in PLATFORM_APPS_FILE; an app
        in both stays listed from the file, without `deploy`, until the file
        drops it), github_unreachable (502), github_not_configured (503).
        Role operator.
      responses:
        "202":
          description: Unregistered; Argo CD is removing the workloads.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/apps/{name}/environments:
    parameters:
      - $ref: "#/components/parameters/AppName"
    post:
      tags: [apps]
      operationId: addAppEnvironment
      description: |
        Add an environment to a registered app (ADR 0043) and queue a
        deployment of the default instance (trigger `environment`) to all of
        the app's environments, the new one included. The deployment repeats
        the default instance's last healthy deployment: its commit, images and
        platform.yaml, with the secrets as they are now. Nothing is built and
        GitHub is not read. Images are pinned by digest; an image that was
        deleted from its registry since makes the new environment Degraded and
        the deployment fail, and a branch deployment builds it again.

        A postgres app is added an environment only when it has a database
        pair (ADR 0030) whose peer is that environment: the pair is made at
        registration, also for an app registered in one environment while
        exactly one other environment has a database host template. After the
        deployment the database of the new environment is a streaming replica
        of the app's database, and `POST /v1/migrations` can move the app
        there once `deploy.dbTopology.readiness.ready` of `GET
        /v1/apps/{name}` is true. Without such a pair the environment is
        refused, as its database would be an independent primary that can
        never be migrated. An app without a postgres resource is just added
        the environment.

        Branch instances (ADR 0015) go to the new environment at their next
        deployment; this request queues none for them.

        Sending the same request again: while the environment is in the app
        and the default instance's newest deployment that got there (one that
        stopped before it wrote the environment's file, such as a failed
        build, is passed over) is healthy there, 409 environment_exists. While
        it is in the app but that deployment failed or was superseded, or none
        got there, and nothing is in progress, a new deployment is queued and
        the answer is 202 again, so a failed add is retried by sending the
        request again. A push stored while the environment was being added
        deploys to the app's environments as they are when it commits, the
        new one included.

        Adding back an environment removed before (DELETE
        /v1/apps/{name}/environments/{env}) waits until Argo CD deleted what
        it had there: while an Application `<instance>-<env>` of the app is
        still in the management cluster, or a Service or Pod is still in an
        instance's namespace in the environment, 409
        environment_cleanup_pending. The Tailscale operator's Services keep
        their finalizer until it deleted their tailnet devices, so the new
        database gets the same tailnet hostname again. This is read whenever
        the server can read the clusters, also for an app deleted and
        registered again under the same name. A peer added back
        archives its database's WAL under a new path of the backup bucket.

        Checked in this order. Error codes: invalid_request (400: no
        `environment`), app_not_found (404), app_not_registered (409: the app
        is only in PLATFORM_APPS_FILE), env_not_found (404: not an
        environment of this server), environment_exists (409), deployment_in_progress
        (409: a deployment of the default instance is not finished, an earlier
        add included), migration_in_progress (409: a migration run of the app
        is active, by the rule `POST /v1/migrations` uses to refuse another
        run: it has not ended and is running or awaiting its switch, so a run
        that ended halted or was interrupted is not; or the traffic gateway
        holds the app's writes), nothing_to_redeploy (409: the default
        instance has no healthy deployment; deploy the branch first),
        db_pair_unavailable (409: platform.yaml has a postgres resource and the
        app has no database pair whose peer is the environment, or the app is
        also in PLATFORM_APPS_FILE), storage_not_configured (503: an s3
        resource and the environment has no storage driver),
        sealing_not_configured (503: the deployment seals values and the
        environment has no sealed-secrets certificate),
        environment_cleanup_pending (409: the environment was removed from the
        app before and Argo CD has not finished deleting it there),
        environment_cleanup_unknown (502: the management or workload cluster
        could not be read for that; 503: this server cannot read them),
        app_changed (409: the app's environments changed meanwhile; read the
        app and try again), deployment_not_queued (500: the environment was
        added to the app but its deployment could not be stored; send the
        same request again to queue it). Role operator.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppEnvironmentAddRequest" }
      responses:
        "202":
          description: Added; the deployment to the app's environments is queued.
          headers:
            Location: { schema: { type: string }, description: "/v1/apps/{name}" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppEnvironmentAdded" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/apps/{name}/environments/{env}:
    parameters:
      - $ref: "#/components/parameters/AppName"
      - name: env
        in: path
        required: true
        description: An environment of the app.
        schema: { type: string }
    delete:
      tags: [apps]
      operationId: removeAppEnvironment
      description: |
        Take an environment back out of a registered app (ADR 0043), for an
        environment added by mistake or whose deployment cannot get healthy.
        The platform takes the environment's backend out of every instance's
        traffic gateway app (first, so no request goes to workloads that are
        going), commits the removal of `apps/<instance>/<env>.yaml` of every
        instance from the gitops repository, removes the environment from the
        app and deletes the management cluster's database routes of the pair
        (they stand only while both environments of the pair are the app's). Argo CD then deletes the Applications `<instance>-<env>`
        with their namespaces, as when the app is deleted, so the instances'
        data in that environment goes with them; their buckets and keys there
        are deleted by the storage cleanup. The database pair stays, so the
        environment can be added again. Then a deployment of the default
        instance (trigger `environment`) to the remaining environments is
        queued when it has a healthy deployment to repeat, so the primary's
        gitops file gets `dbTopology.peerPresent: false` again.

        Refused for the app's first environment, where its database was born
        primary, and for an environment that is or ever was the write backend:
        the traffic gateway sends an instance's writes there, or a migration
        run of the app that was not failed or aborted had it as source or
        target. Also refused when an instance with an s3 resource and no
        public service went healthy to the environment: it may have written
        files to its bucket there without any request from the gateway, and
        the removal deletes that bucket.

        Once the environment is removed the answer is 202 even when what it
        reads for the answer fails: `app` then has only what the app's record
        says, and `deployment` is left out when it could not be queued (the
        next deployment rewrites the primary's file).

        Checked in this order. Error codes: app_not_found (404),
        app_not_registered (409), env_not_found (404: not an environment of
        the app), primary_environment
        (409: the app's first environment; the app keeps at least one),
        write_backend (409), deployment_in_progress (409: a deployment of any
        instance of the app is not finished), environment_has_files (409: an
        instance with an s3 resource and no public service went healthy
        there; delete the app instead), migration_in_progress (409: a
        migration run of the app is active, as for the POST; a run that ended
        halted or was interrupted is not; or the gateway holds an instance's
        writes),
        github_not_configured (503: no deployer), app_changed (409: the app's
        branches changed while the removal waited; nothing changed, read the
        app and try again. An environment added meanwhile does not stop the
        removal, which keeps it), gateway_unreachable (502:
        nothing changed), github_unreachable (502: the gitops repository; the
        gateway backend is already out, so send the request again). Role
        operator.
      responses:
        "202":
          description: Removed; Argo CD is removing the workloads of the environment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppEnvironmentRemoved" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/apps/{name}/instances:
    parameters:
      - $ref: "#/components/parameters/AppName"
    post:
      tags: [apps]
      operationId: createAppInstance
      description: |
        Deploy another branch of a registered app as its own instance (ADR
        0015). The platform reads `platform.yaml` at the head of `branch`
        through the GitHub App and checks it as registration does (its `name`
        must be the app's name), stores the branch under the instance name
        `<app>--<slug>` (`appspec.InstanceName`), and queues the instance's
        first deployment (trigger `register`) to all the app's environments.
        With `autoDeploy`, every later push to `branch` deploys the instance
        as well.

        Error codes: invalid_request (400: a branch that is not a git branch
        name, or whose slug is empty), app_not_found (404),
        app_not_registered (409: the app is only in PLATFORM_APPS_FILE),
        branch_exists (409: the app's own branch, or a branch already added),
        instance_exists (409: another branch has the same instance name),
        instance_limit (409: the app already has 3 instances, the default one
        included), storage_cleanup_pending (409: the bucket and key of a
        deleted instance with this name are still being deleted; try again
        later), invalid_app_spec (422: the branch or platform.yaml could
        not be read, or platform.yaml breaks a rule), github_unreachable
        (502), github_not_configured (503), storage_not_configured (503:
        the branch's platform.yaml has an s3 resource and one of the app's
        environments has no storage driver). Role operator.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppInstanceCreateRequest" }
      responses:
        "201":
          description: Added; the instance's first deployment is queued.
          headers:
            Location: { schema: { type: string }, description: "/v1/apps/{name}, which lists the instance in deploy.instances" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppInstanceCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/AppSpecInvalid" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/apps/{name}/instances/{instance}:
    parameters:
      - $ref: "#/components/parameters/AppName"
      - $ref: "#/components/parameters/InstanceName"
    delete:
      tags: [apps]
      operationId: deleteAppInstance
      description: |
        Remove an added instance. The platform supersedes the instance's
        unfinished deployments, commits the removal of `apps/<instance>/`
        from the gitops repository, removes the instance from the traffic
        gateway, and forgets the branch with its deployments. Argo CD then
        deletes the namespace and its data; 202 means that is under way.

        Error codes: app_not_found and instance_not_found (404),
        app_not_registered (409: the app is only in PLATFORM_APPS_FILE),
        default_instance (409: the default instance goes only with the app,
        `DELETE /v1/apps/{name}`), cluster_busy (409: the traffic gateway
        holds the instance's writes), github_unreachable (502: the gitops
        repository), gateway_unreachable (502), github_not_configured (503).
        Role operator.
      responses:
        "202":
          description: Removed; Argo CD is removing the workloads.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/apps/{name}/secrets:
    parameters:
      - $ref: "#/components/parameters/AppName"
    get:
      tags: [apps]
      operationId: listAppSecrets
      description: |
        The names of a registered app's secrets, without values: the
        app-wide ones, which every instance gets, and each instance's
        overrides. An instance gets the app-wide secrets with its overrides
        on top. Secrets reach the app as environment variables at its next
        deployment (ADR 0019); a secret with the same name as a
        `platform.yaml` env entry wins over it.

        Error codes: app_not_found (404), app_not_registered (409),
        secrets_not_configured (503: the server has no secrets key). Role
        viewer.
      responses:
        "200":
          description: The secret names.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSecrets" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Internal" }
    put:
      tags: [apps]
      operationId: updateAppSecrets
      description: |
        Sets and deletes secrets of a registered app in one change: app-wide
        ones without `instance`, or one instance's overrides with it
        (deleting an override makes the instance use the app-wide value
        again). Running instances keep their old values until they are
        deployed again; `POST /v1/apps/{name}/deployments` with `redeploy`
        applies them without a build. Values are stored encrypted with the
        server's secrets key and never logged; the audit entry has only the
        names.

        Names match `^[A-Z_][A-Z0-9_]*$`, at most 64 characters, and are not
        set by the platform (PORT, DATABASE_URL, PGHOST, PGPORT, PGDATABASE,
        PGUSER, PGPASSWORD, JDBC_DATABASE_URL, S3_*). Values are 1 to 4096
        bytes. At most 50 secrets per app-wide set and per instance, so at
        most 50 names in `set` and in `delete`.

        Error codes: invalid_request (400: a bad or reserved name, an empty
        value or one too long, too many secrets, a name both set and deleted,
        or nothing to change), app_not_found (404), instance_not_found (404: `instance`
        is not one of the app's instances), app_not_registered (409),
        secrets_not_configured (503). Role operator.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppSecretsUpdate" }
      responses:
        "200":
          description: The secret names after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSecrets" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Internal" }

  /v1/apps/{name}/secrets/{secret}:
    parameters:
      - $ref: "#/components/parameters/AppName"
      - name: secret
        in: path
        required: true
        schema: { type: string, example: HOST_CODE }
      - name: instance
        in: query
        required: false
        description: Read this instance's override instead of the app-wide value.
        schema: { type: string }
    get:
      tags: [apps]
      operationId: getAppSecret
      description: |
        One secret's value, for the console's show button. Every call is
        written to the audit log (with the name, never the value), and the
        answer is not cached (`Cache-Control: no-store`). The audit entry is
        written before the value is sent: when it cannot be written, the
        value is not returned.

        Error codes: app_not_found (404), instance_not_found (404),
        secret_not_found (404), app_not_registered (409),
        secrets_not_configured (503), audit_unavailable (503: the audit
        entry could not be written). Role operator.
      responses:
        "200":
          description: The secret with its value.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSecretValue" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Internal" }

  /v1/apps/{name}/deployments:
    parameters:
      - $ref: "#/components/parameters/AppName"
    post:
      tags: [deployments]
      operationId: createDeployment
      description: |
        Deploy a registered app now (trigger `manual`). `branch` picks the
        instance: the app's own branch (the default instance) or a branch
        added with `POST /v1/apps/{name}/instances`. `ref` is resolved to a
        commit, and `platform.yaml` there is checked as for registration
        before the deployment is created; its `name` must still be the app's
        name. The deployment is queued and 202 returns at once; follow it
        with `GET /v1/deployments/{id}/events`.

        With `redeploy: true` (trigger `redeploy`) nothing is built and
        GitHub is not read: the instance's last healthy deployment is
        deployed again, same commit, same images and same platform.yaml,
        with the secrets as they are now (`PUT /v1/apps/{name}/secrets`).
        Use it after changing secrets. `ref` is not allowed with it. It goes
        only to environments that deployment went to, as another
        environment may run another version: by default all of them the
        app still deploys to; `environments` must name only such
        environments. While the instance has an unfinished deployment, a
        redeploy is refused: that deployment already uses the secrets as
        they were at its gitops commit, so deploy again once it is done. A
        deployment that comes in meanwhile supersedes a redeploy, and a
        redeploy queued beside an unfinished deployment ends superseded.

        Error codes: invalid_request (400: a `branch` the app does not
        deploy, an environment the app is not registered for, a ref the
        repository does not have, or `ref` with `redeploy`), app_not_found
        (404), app_not_registered (409: the app is only in
        PLATFORM_APPS_FILE), nothing_to_redeploy (409: `redeploy` but the
        instance has no healthy deployment, or it did not go to an
        environment asked for or to any the app still deploys to),
        deployment_in_progress (409:
        `redeploy` while the instance has a queued, building, committing or
        syncing deployment), invalid_app_spec (422), github_unreachable
        (502), github_not_configured (503). Role operator.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeploymentCreateRequest" }
      responses:
        "202":
          description: The deployment is queued.
          headers:
            Location: { schema: { type: string }, description: "/v1/deployments/{id}" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/AppSpecInvalid" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Internal" }
    get:
      tags: [deployments]
      operationId: listDeployments
      description: "The app's deployments to all its instances, newest first; with `branch`, only that branch's, `limit` counting those alone. Empty for an app that is only in PLATFORM_APPS_FILE. Error codes: invalid_request (400: a limit out of range, or a `branch` the app does not deploy), app_not_found (404)."
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
        - name: branch
          in: query
          required: false
          description: Only the deployments of this branch's instance. It must be a branch the app deploys.
          schema: { type: string }
      responses:
        "200":
          description: Deployments, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/deployments/{id}:
    parameters:
      - $ref: "#/components/parameters/DeploymentId"
    get:
      tags: [deployments]
      operationId: getDeployment
      description: "Error codes: deployment_not_found (404)."
      responses:
        "200":
          description: The deployment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/deployments/{id}/events:
    parameters:
      - $ref: "#/components/parameters/DeploymentId"
    get:
      tags: [deployments]
      operationId: streamDeploymentEvents
      description: |
        Server-Sent Events, with the same contract as a run's events.

        - The first message is `snapshot` (data: `Deployment`), the current
          state. Snapshots carry no SSE id.
        - Then every `DeploymentEvent`, with the event `type` as the SSE event
          name and the event `seq` as the SSE id.
        - When the deployment ends (`healthy`, `failed` or `superseded`): a
          final `snapshot`, then the stream closes. While it is unfinished
          (including `queued`) the stream stays open, with `: keep-alive`
          comments.

        Reconnect with `Last-Event-ID` (or `?after=`) to replay the events you
        missed; they are stored, so nothing is lost. Error codes:
        deployment_not_found (404).
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
        - name: after
          in: query
          required: false
          description: Replay events with seq greater than this. Same as Last-Event-ID.
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        "200":
          description: An event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/github/repos:
    get:
      tags: [github]
      operationId: listGitHubRepos
      description: |
        The repositories the GitHub App installation can see, by full name,
        to pick one to register. Error codes: github_unreachable (502),
        github_not_configured (503).
      responses:
        "200":
          description: Repositories by full name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubRepoList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/github/push-tokens:
    post:
      tags: [github]
      operationId: createPushToken
      description: |
        A GitHub token that may push to one imported repository, for the AI
        agent that adds a Dockerfile and platform.yaml to an open-source copy
        (ADR 0023). The platform reads the repository's id and current name
        from GitHub (renames and transfers are followed) and creates a GitHub
        App installation token bound to that id (`repository_ids: [id]`) with
        `contents: write`; GitHub expires it after an hour. A token GitHub
        answers with a wider scope is revoked and not returned. Every call
        creates a new token; the platform keeps none of them.

        Only repositories `scripts/import-repo.sh` imported get a token: the
        repository must be in the platform's GitHub organization, under the
        name asked for and its current name, and have the topic
        `hopcharlie-imported`. The configured gitops repository never gets
        one. `repo` in the answer is the current name. The agent pushes the
        `hopcharlie` branch with it, as the password of user `x-access-token`
        for `https://github.com/<repo>.git`, and an operator registers that
        branch with `POST /v1/apps`. GitHub does not enforce the branch: the
        token can write any branch of that one repository.

        The answer has `Cache-Control: no-store`. The audit log records the
        repository and `expiresAt`, never the token, and is written before
        the answer: when it cannot be written, the token is revoked and the
        answer is 503 audit_unavailable.

        Error codes: invalid_request (400: repo is not owner/name, or its
        name is `.`, `..` or ends in `.git`), repo_not_imported (403: the
        repository has no `hopcharlie-imported` topic, is not in the
        organization, or is the gitops repository), repo_not_found (404: the
        repository does not exist, the GitHub App installation cannot see
        it, or the installation cannot grant a token for it),
        github_unreachable (502, also when GitHub answers with a wider
        token), github_not_configured (503), audit_unavailable (503). Roles:
        agent, operator.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushTokenRequest" }
      responses:
        "201":
          description: The token, valid until `expiresAt`.
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushToken" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/webhooks/github:
    post:
      tags: [github]
      operationId: receiveGitHubWebhook
      security: []
      description: |
        The GitHub App's webhook (content type `application/json`). It takes
        no bearer token: `X-Hub-Signature-256` must be the HMAC-SHA256 of the
        raw body with the App's webhook secret, and it is checked before
        anything else.

        Only `push` events act. A push to a branch a registered app deploys
        (its own `branch`, or a branch added as an instance) whose
        `autoDeploy` is on queues one deployment of the pushed head commit
        (`after`) into that branch's instance, to all of the app's
        environments, with trigger `push` and `triggeredBy`
        `github:<sender login>`, and the answer is 202 with the queued
        deployments (one per such instance). The deployer reads
        platform.yaml at that commit; one that breaks a rule fails the
        deployment (`error` says why). Everything else is 204 and
        changes nothing: `ping` and other events, pushes to other branches,
        tags, deleted branches, repositories with no registered app,
        branches without `autoDeploy`, and a delivery (`X-GitHub-Delivery`)
        that was already handled.

        Error codes: invalid_signature (401), invalid_request (400: a signed
        body that is not a push payload), github_not_configured (503: the
        server has no webhook secret).
      parameters:
        - name: X-GitHub-Event
          in: header
          required: true
          schema: { type: string, example: push }
        - name: X-GitHub-Delivery
          in: header
          required: true
          description: GitHub's delivery id; a delivery that was already handled is a 204.
          schema: { type: string }
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema: { type: string, example: "sha256=5d4f..." }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: The GitHub event payload, as GitHub sends it.
              type: object
              additionalProperties: true
      responses:
        "202":
          description: Deployments queued for the push.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentList" }
        "204":
          description: Nothing to do.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "invalid_signature: X-Hub-Signature-256 is missing or does not match the body"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Internal" }

  /v1/onboardings:
    post:
      tags: [onboarding]
      operationId: startOnboarding
      description: |
        Start onboarding an app that runs outside the platform, with docker
        compose on one VM (ADR 0042). The platform reads GitHub, DNS, the
        cloud, the VM and its database (`discovering`), has hopai write a
        contract branch and opens a PR (`patching`), deploys the PR branch
        as a temporary app (`checking`) and waits for an operator's approval
        (`awaiting_approval`). Only after the approval does it change the
        source VM and database (`connecting`), then registers the app with
        its database a replica of the source (`registering`, `syncing`)
        until `ready`, when `POST /v1/onboardings/{id}/cutover` moves it.
        The steps are in `GET /v1/onboardings/{id}/events`.

        The app's name is the service address's label, so the address must
        be `https://<label>.<app domain>`. Without `targetEnv` the target is
        the environment of the VM's cloud (`eks` for AWS, `gke` for GCP).

        The feature is off unless the server runs with
        PLATFORM_ONBOARDING=1; the routes are not there then (404). While
        it is being built every onboarding endpoint answers 501
        not_implemented.

        Error codes: invalid_request (400: `repo` is not owner/name, or
        `serviceUrl` is not `https://<label>.<app domain>`), env_not_found
        (404: `targetEnv`), app_exists (409: an app of that name is
        registered), onboarding_exists (409: the app has an onboarding that
        is not done), github_not_configured (503), secrets_not_configured
        (503), not_implemented (501). Role operator.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingRequest" }
      responses:
        "202":
          description: Started; discovery runs in the background.
          headers:
            Location: { schema: { type: string }, description: "/v1/onboardings/{id}" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Onboarding" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotImplemented" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Internal" }
    get:
      tags: [onboarding]
      operationId: listOnboardings
      description: |
        Every onboarding, newest first, done ones included.

        Roles: viewer, agent, operator.
      responses:
        "200":
          description: The onboardings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { $ref: "#/components/responses/NotImplemented" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/onboardings/{id}:
    parameters:
      - $ref: "#/components/parameters/OnboardingId"
    get:
      tags: [onboarding]
      operationId: getOnboarding
      description: |
        One onboarding: its state, the facts summary, the report, the PR,
        the test deployment, what was added to the source and what a person
        has to do. Error codes: onboarding_not_found (404).

        Roles: viewer, agent, operator.
      responses:
        "200":
          description: The onboarding.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Onboarding" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }
        default: { $ref: "#/components/responses/Internal" }
    delete:
      tags: [onboarding]
      operationId: deleteOnboarding
      description: |
        Stop and remove an onboarding. The hopai Job and the temporary app
        are always stopped and deleted first. Then, by state:

        - Up to `awaiting_approval` (or `failed` in one of them): the PR is
          closed and the onboarding deleted.
        - From `connecting` to `ready` (or `failed` in one of them): every
          `legacyChanges` entry is undone in reverse order, the gateway app
          and the registered app are deleted, then the onboarding. A merged
          PR stays merged.
        - From `cutting_over` on: refused.

        The answer comes at once with `deleting` true; the onboarding is
        gone when `GET /v1/onboardings/{id}` answers 404. A step that fails
        sets `failure` and leaves the onboarding, and the same request
        tries again. Error codes: onboarding_not_found (404),
        onboarding_state_conflict (409: `cutting_over` or later),
        not_implemented (501). Role operator.
      responses:
        "202":
          description: Being deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Onboarding" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotImplemented" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/onboardings/{id}/events:
    parameters:
      - $ref: "#/components/parameters/OnboardingId"
    get:
      tags: [onboarding]
      operationId: streamOnboardingEvents
      description: |
        Server-Sent Events, with the same contract as a deployment's events.

        - The first message is `snapshot` (data: `Onboarding`). Snapshots
          carry no SSE id.
        - Then every `OnboardingEvent`, with its `kind` as the SSE event
          name and its `seq` as the SSE id. Every change of the onboarding
          (state, report, human actions, legacy changes) also sends a new
          `snapshot`.
        - When the onboarding is `done`, or deleted: a final `snapshot` (for
          a deletion, the last one before it), then the stream closes.
          Otherwise it stays open, `failed` included, with `: keep-alive`
          comments.

        Reconnect with `Last-Event-ID` (or `?after=`) to replay the events
        missed. Error codes: onboarding_not_found (404).

        Roles: viewer, agent, operator.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
        - name: after
          in: query
          required: false
          description: Replay events with seq greater than this. Same as Last-Event-ID.
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        "200":
          description: An event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/onboardings/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/OnboardingId"
    post:
      tags: [onboarding]
      operationId: approveOnboarding
      description: |
        Approve the PR and what will be added to the source, in
        `awaiting_approval` only. `headSha` is the PR head the operator
        reviewed (`pr.headSha`). When the PR's head is another commit, or
        the PR is not up to date with the default branch, the answer is 409
        pr_head_mismatch and the platform makes the branch again and tests
        it again (`patching`). Once approved the onboarding goes to
        `connecting`, which disables the source's deploy workflows: the
        source is not deployed again until it is decommissioned.

        Error codes: invalid_request (400: no `headSha`),
        onboarding_not_found (404), onboarding_state_conflict (409: not
        `awaiting_approval`), pr_head_mismatch (409), github_unreachable
        (502), not_implemented (501). Role operator.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingApproveRequest" }
      responses:
        "202":
          description: Approved; connecting runs in the background.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Onboarding" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotImplemented" }
        "502": { $ref: "#/components/responses/BadGateway" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/onboardings/{id}/cutover:
    parameters:
      - $ref: "#/components/parameters/OnboardingId"
    post:
      tags: [onboarding]
      operationId: cutOverOnboarding
      description: |
        Move the app to the platform, in `ready` only: the platform submits
        and starts the onboarding's own migration plan (external source,
        cold target app) and keeps its run id in `runId`; the run is in
        `GET /v1/migrations/{runId}`, without a rollback. When it succeeds
        the onboarding goes to `decommissioning`.

        Error codes: onboarding_not_found (404), onboarding_state_conflict
        (409: not `ready`), cluster_busy (409), not_implemented (501).
        Role operator.
      responses:
        "202":
          description: The run started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Onboarding" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotImplemented" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/onboardings/{id}/decommission:
    parameters:
      - $ref: "#/components/parameters/OnboardingId"
    post:
      tags: [onboarding]
      operationId: decommissionOnboarding
      description: |
        Confirm stopping the source VM, in `decommissioning` only, after the
        legacy backend left the gateway and the tailnet device and route
        were removed. The platform stops (never terminates) the tagged
        instance and the onboarding is `done`. The disk and the source
        bucket stay for the operator to delete in the cloud.

        Error codes: onboarding_not_found (404), onboarding_state_conflict
        (409: not `decommissioning`, or the earlier steps of it are not
        finished), not_implemented (501). Role operator.
      responses:
        "202":
          description: Stopping the instance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Onboarding" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotImplemented" }
        default: { $ref: "#/components/responses/Internal" }
  /v1/onboardings/{id}/resume:
    parameters:
      - $ref: "#/components/parameters/OnboardingId"
    post:
      tags: [onboarding]
      operationId: resumeOnboarding
      description: |
        Check again and carry on: from `failed` it goes back to
        `failedState`; in a state waiting for a person (a `humanActions`
        entry not done, such as installing the GitHub App or deleting the
        DNS record) it checks again now instead of at the next poll. A
        failed cutover run is resumed through the run (`POST
        /v1/migrations/{runId}/resume`), not here.

        Error codes: onboarding_not_found (404), onboarding_state_conflict
        (409: neither failed nor waiting for a person), not_implemented
        (501). Role operator.
      responses:
        "202":
          description: Resumed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Onboarding" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotImplemented" }
        default: { $ref: "#/components/responses/Internal" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    PlanRef:
      name: ref
      in: path
      required: true
      schema: { type: string }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string }
    EnvName:
      name: name
      in: path
      required: true
      schema: { type: string }
    AppName:
      name: name
      in: path
      required: true
      schema: { type: string }
    InstanceName:
      name: instance
      in: path
      required: true
      schema: { type: string, example: moimroom--dev }
    DeploymentId:
      name: id
      in: path
      required: true
      schema: { type: string }
    OnboardingId:
      name: id
      in: path
      required: true
      schema: { type: string, example: onb_3f9a1c2b7d4e }
    UserCode:
      name: userCode
      in: path
      required: true
      description: The code the CLI shows. Case, spaces and '-' do not matter.
      schema: { type: string, example: BCDF-GHJK }

  responses:
    BadRequest:
      description: "invalid_request, invalid_plan"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: "unauthorized: missing or invalid token"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: "forbidden: the token's role may not do this; console_session_required: only a console session may do this; repo_not_imported: the repository gets no push token"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "plan_not_found, run_not_found, env_not_found, app_not_found, instance_not_found, deployment_not_found, device_login_not_found, secret_not_found, bucket_not_registered, prefix_not_listed, repo_not_found, onboarding_not_found"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: "plan_state_conflict, run_state_conflict, cluster_busy, idempotency_key_reused, app_exists, app_not_registered, branch_exists, instance_exists, instance_limit, default_instance, residency_denied, capacity_insufficient, version_mismatch, device_login_state_conflict, nothing_to_redeploy, storage_cleanup_pending, deployment_in_progress, ai_run_active, onboarding_exists, onboarding_state_conflict, pr_head_mismatch"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AppSpecInvalid:
      description: "invalid_app_spec: platform.yaml could not be read or breaks a rule; `validation` says where"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AppSpecInvalid" }
    TooLarge:
      description: "too_large"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadGateway:
      description: "engine_init_failed, gateway_unreachable, github_unreachable"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Internal:
      description: "internal: an unexpected error; details are only in the server log"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: "gateway_not_configured, github_not_configured, login_not_configured, secrets_not_configured, storage_not_configured, audit_unavailable, ai_runner_not_configured"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotImplemented:
      description: "not_implemented: the endpoint is in the contract and not built yet"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: "too_many_attempts"
      headers:
        Retry-After:
          description: Seconds to wait before trying again.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ErrorBody" }

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    Health:
      type: object
      required: [status]
      properties:
        status: { type: string }

    Role:
      type: string
      enum: [viewer, agent, operator]

    Principal:
      type: object
      required: [name, role]
      properties:
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }

    # ---------- auth ----------

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, maxLength: 256 }

    Session:
      description: "A console session or CLI token. Send `token` as `Authorization: Bearer <token>`."
      type: object
      required: [token, expiresAt, principal]
      properties:
        token: { type: string, description: "Opaque. Shown only in this answer; the server keeps only its hash." }
        expiresAt: { type: string, format: date-time }
        principal: { $ref: "#/components/schemas/Principal" }

    DeviceLoginStartRequest:
      type: object
      required: [client]
      properties:
        client:
          type: string
          minLength: 1
          maxLength: 200
          description: What is asking, shown to the administrator before they approve.
          example: charlie v0.5.0 on rin-sbx-12

    DeviceLoginStart:
      type: object
      required: [deviceCode, userCode, verificationUri, expiresIn, interval]
      properties:
        deviceCode: { type: string, description: "The client's secret for POST /v1/auth/device/token. Never show it." }
        userCode: { type: string, example: BCDF-GHJK, description: "Eight letters in two groups of four, for the person to enter in the console." }
        verificationUri: { type: string, example: "https://console.hopcharlie.dev/#device", description: "The console page where the code is entered." }
        expiresIn: { type: integer, example: 600, description: Seconds until the device login expires. }
        interval: { type: integer, example: 5, description: Seconds to wait between polls. }

    DeviceTokenRequest:
      type: object
      required: [deviceCode]
      properties:
        deviceCode: { type: string }

    DeviceLoginStatus:
      type: string
      enum: [pending, approved, denied]

    DeviceLogin:
      description: "A device login as the console shows it to an administrator. It never contains the device code. `role` is the role the CLI token gets, set once approved."
      type: object
      required: [userCode, client, status, createdAt, expiresAt]
      properties:
        userCode: { type: string, example: BCDF-GHJK }
        client: { type: string }
        status: { $ref: "#/components/schemas/DeviceLoginStatus" }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        reviewedBy: { type: string, description: "The administrator who approved or denied it, once reviewed." }
        role: { $ref: "#/components/schemas/Role" }

    DeviceLoginApproveRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }

    # ---------- plans ----------

    EnginePlan:
      description: The migration-engine plan (migration-engine/pkg/plan). `${VAR}` references are expanded on the server.
      type: object
      additionalProperties: false
      required: [id, source, target]
      properties:
        allowSourceRewire:
          type: boolean
          default: false
          description: Opt-in for approved three-environment registered database groups. Before holding writes, prepare may CAS-update only the current primary's future replica source to the directly following target. It never reparents the target or changes a primary role.
        id: { type: string }
        source: { $ref: "#/components/schemas/EnginePlanEndpoint" }
        target: { $ref: "#/components/schemas/EnginePlanEndpoint" }
        files:
          type: object
          additionalProperties: false
          required: [source, target]
          description: >-
            Object storage moved with rclone. source and target must each be
            exactly a bucket the server registers (an app's bucket in
            PLATFORM_APPS_FILE, or PLATFORM_PLAN_BUCKETS) and must differ;
            rclone remotes and their credentials come from the server's
            environment (RCLONE_CONFIG_<REMOTE>_*), never from the plan.
            rclone must be "rclone" or omitted, and only allowed flags pass.
          properties:
            source: { type: string, example: "gcs:shop-uploads-gke" }
            target: { type: string, example: "s3:shop-uploads-eks" }
            flags: { type: array, items: { type: string } }
            rclone: { type: string }
        gateway:
          type: object
          additionalProperties: false
          properties:
            mode: { type: string, enum: [http, none] }
            url:
              type: string
              description: >-
                The platform gateway's admin URL (PLATFORM_GATEWAY_URL) for a
                plan whose databases belong to no registered app (the
                gateway's default app), otherwise exactly
                `<PLATFORM_GATEWAY_URL>/apps/<app>` of the app that owns both
                databases. Drafts use the app's scope.
            token: { type: string }
            sourceBackend: { type: string }
            targetBackend: { type: string }
        verify:
          type: object
          additionalProperties: false
          properties:
            schemas: { type: array, items: { type: string } }
            tables: { type: array, items: { type: string } }
            fenceGate: { type: boolean }
            writtenRecords: { type: string }
        thresholds:
          type: object
          additionalProperties: false
          properties:
            maxLagBytes: { type: integer, format: int64 }
            catchupTimeout: { type: string, example: "10m" }
            switchoverTimeout: { type: string, example: "2m" }
            maxDowntime: { type: string, example: "3m" }
            maxFenceGate: { type: string, example: "20s", description: "Longest the fence gate may take; delta times a rehearsal of it before writes are held. Default 20s." }

    EnginePlanEndpoint:
      type: object
      additionalProperties: false
      required: [env, namespace, cluster, dsn]
      properties:
        env: { type: string, example: gke }
        kubeconfig: { type: string }
        context: { type: string }
        namespace: { type: string }
        cluster: { type: string, description: CNPG Cluster name }
        dsn: { type: string }
        manifest: { type: string, description: target only }

    PlanStatus:
      type: string
      enum: [pending_approval, approved, rejected, starting, started]

    PlanEndpoint:
      description: The non-secret view of a plan endpoint.
      type: object
      required: [env, namespace, cluster]
      properties:
        env: { type: string }
        context: { type: string }
        namespace: { type: string }
        cluster: { type: string }
        dbHost:
          type: string
          description: host:port the DSN connects to, without credentials. Shown so an approver can see where the database password would be sent.

    PlanSummary:
      type: object
      required: [planId, source, target, files, gatewayMode, fenceGate, maxDowntime]
      properties:
        planId: { type: string }
        source: { $ref: "#/components/schemas/PlanEndpoint" }
        target: { $ref: "#/components/schemas/PlanEndpoint" }
        files: { type: boolean, description: the plan also moves object storage }
        gatewayMode: { type: string }
        fenceGate: { type: boolean }
        maxDowntime: { type: string }

    PlanRecord:
      type: object
      required: [ref, status, revision, summary, submittedBy, submittedAt]
      properties:
        ref: { type: string, example: pln_3f9c1a0b2d4e }
        status: { $ref: "#/components/schemas/PlanStatus" }
        revision:
          type: integer
          format: int64
          description: 1 at submit, one more with every attachment upload. Approve with the revision you reviewed.
        rollbackOf: { type: string, description: "the run this plan rolls back (POST /v1/migrations/{runId}/rollback)" }
        summary: { $ref: "#/components/schemas/PlanSummary" }
        submittedBy: { type: string }
        submittedRole:
          description: The role the plan was submitted with. An agent's (AI) plan needs a passing rehearsal report before it can be approved. Absent for plans stored before the role was kept.
          allOf: [{ $ref: "#/components/schemas/Role" }]
        submittedAt: { type: string, format: date-time }
        reviewedBy: { type: string, description: who approved or rejected }
        reviewedAt: { type: string, format: date-time }
        reviewComment: { type: string }
        runId: { type: string }
        attachments:
          type: array
          description: Files uploaded for this plan (PUT /v1/plans/{ref}/attachments/{name}).
          items: { $ref: "#/components/schemas/PlanAttachment" }
        rehearsal: { $ref: "#/components/schemas/PlanRehearsalGate" }

    AIRunRequest:
      type: object
      additionalProperties: false
      required: [app, source, target]
      properties:
        app: { type: string, example: moimroom }
        source: { type: string, description: environment the app moves from, example: gke }
        target: { type: string, description: environment the app moves to, example: eks }

    AIRun:
      type: object
      required: [name, app, source, target, status, requestedBy, createdAt]
      properties:
        name: { type: string, description: the Job's name, example: hopai-moimroom-x7k2p }
        app: { type: string }
        source: { type: string }
        target: { type: string }
        status: { type: string, enum: [running, succeeded, failed] }
        requestedBy: { type: string }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }

    AIActivityEvent:
      type: object
      required: [time, kind]
      properties:
        time: { type: string, format: date-time }
        kind: { type: string, enum: [model, tool_call, tool_result, blocked, rehearsal] }
        tool: { type: string, description: "tool_call, tool_result, blocked: the tool's name" }
        outcome: { type: string, description: "tool_result: ok or error; rehearsal: the engine's result" }
        model: { type: string }
        stopReason: { type: string, description: "model: tool_use or end_turn" }
        toolCalls: { type: array, items: { type: string }, description: "model: the tools it asked for" }
        tokensIn: { type: integer }
        tokensOut: { type: integer }
        passed: { type: boolean, description: "rehearsal: whether it passed" }
        seconds: { type: integer, description: "rehearsal: how long it took" }

    AIActivitySummary:
      type: object
      required: [modelCalls, tokensIn, tokensOut, tools, blocked, rehearsals]
      properties:
        modelCalls: { type: integer }
        model: { type: string }
        tokensIn: { type: integer }
        tokensOut: { type: integer }
        tools: { type: object, additionalProperties: { type: integer } }
        blocked: { type: integer }
        rehearsals: { type: integer }
        lastEvent: { type: string, format: date-time }

    AIActivity:
      type: object
      required: [since, events, summary]
      properties:
        since: { type: string, format: date-time }
        events: { type: array, items: { $ref: "#/components/schemas/AIActivityEvent" } }
        summary: { $ref: "#/components/schemas/AIActivitySummary" }

    AIRunList:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items: { $ref: "#/components/schemas/AIRun" }

    PlanRehearsalGate:
      type: object
      description: >-
        Set on plans waiting for approval. When required, approving needs the
        rehearsal-report.json attachment to have passed (schemaVersion
        hopcharlie.rehearsal/v1) for exactly the plan body and target.yaml
        attached now, uploaded by the principal that submitted the plan;
        otherwise approve answers 409 rehearsal_required. The report is the
        trusted runner's word: the gate binds it to the content, it does not
        prove the rehearsal ran.
      required: [required, passed]
      properties:
        required: { type: boolean, description: the plan was submitted by an agent (AI) }
        passed: { type: boolean, description: a passing rehearsal report matches the plan as it is now }
        reason: { type: string, description: "why approval is blocked, when it is" }

    PlanList:
      type: object
      required: [plans]
      properties:
        plans:
          type: array
          items: { $ref: "#/components/schemas/PlanRecord" }

    ReviewRequest:
      type: object
      properties:
        comment: { type: string, maxLength: 2000 }
        revision:
          type: integer
          format: int64
          minimum: 1
          description: Approve only. The plan revision the approver reviewed; required when the plan has attachments.

    # ---------- migrations ----------

    StartMigrationRequest:
      type: object
      additionalProperties: false
      required: [planRef]
      properties:
        planRef: { type: string }
        autoSwitch:
          type: boolean
          default: false
          description: Cut over as soon as data is in sync, without waiting for /switch.
        canary: { $ref: "#/components/schemas/CanaryOptions" }
        observe: { $ref: "#/components/schemas/ObserveOptions" }

    ObserveOptions:
      description: |
        After a successful cutover, keep watching the target at the gateway
        before the run ends. Each step evaluates the gate over that step's
        requests to the target. A step with fewer than `gate.minRequests`
        requests, or without gateway data, is inconclusive: it is recorded but
        is not a violation, because a rollback is a full migration back and is
        started only on a measured breach. The first violated step ends the
        observation. The run still ends `succeeded` (the data moved) with the
        violation in `observe` and `statusReason`. With `autoRollback` the
        server then starts this run's rollback (as POST
        /v1/migrations/{runId}/rollback does) as actor `slo-guard`; without it
        an operator decides. Needs gateway mode http.
      type: object
      additionalProperties: false
      properties:
        duration: { type: string, default: "2m", description: "total observation time, from 10s to 30m" }
        stepDuration: { type: string, default: "20s", description: each gate evaluation covers this window }
        gate: { $ref: "#/components/schemas/GateThresholds" }
        autoRollback: { type: boolean, default: false }

    ObserveResult:
      type: object
      required: [options, steps]
      properties:
        options: { $ref: "#/components/schemas/ObserveOptions" }
        steps:
          type: array
          items: { $ref: "#/components/schemas/ObserveStep" }
        passed:
          type: boolean
          description: |
            true: the whole duration was observed, no step violated the gate and
            at least one step was conclusive. false: a step violated the gate.
            Absent: still observing, stopped early, or nothing conclusive was measured.
        violation: { type: string, description: the violated gate's reason }
        stoppedReason: { type: string, description: why the observation ended before its duration }
        rollbackRunId: { type: string, description: the automatic rollback's run (its rollbackOf is this run) }
        rollbackError: { type: string, description: why the automatic rollback could not start }

    ObserveStep:
      type: object
      required: [startedAt, verdict]
      properties:
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        verdict: { type: string, enum: [ok, violated, inconclusive] }
        gate: { $ref: "#/components/schemas/GateResult" }

    CanaryOptions:
      description: |
        Before cutover, send this share of read requests (GET, HEAD, OPTIONS) to
        the target while writes keep going to the source. After each step the
        gate checks the target's requests over the step. A failed gate puts all
        reads back on the source and ends the run as `rolled_back`. A step with
        fewer than `gate.minRequests` requests and no other breach is
        `inconclusive` and the canary moves on, except at the last step, which
        must pass with enough requests. When the platform sends synthetic
        probe reads, a step whose target got fewer than `gate.minRequests` is
        extended once by another `stepDuration` with more probe reads and then
        judged over the whole step (at most the last 300s). It is not extended
        when the errors are already over the limit or when one more batch could
        not bring enough requests (as at 1%). Gradual steps such as
        1, 10, 25, 50, 75, 90, 100 are recommended. Needs gateway mode http.
      type: object
      additionalProperties: false
      required: [weights]
      properties:
        weights:
          type: array
          minItems: 1
          items: { type: integer, minimum: 1, maximum: 100 }
          example: [1, 10, 25, 50, 75, 90, 100]
        stepDuration: { type: string, default: "20s" }
        gate: { $ref: "#/components/schemas/GateThresholds" }

    GateThresholds:
      type: object
      additionalProperties: false
      properties:
        maxErrorRate: { type: number, default: 0.01, description: 5xx and proxy errors over requests }
        maxP95Millis: { type: integer, default: 800 }
        minRequests: { type: integer, default: 20, description: "fewer requests than this cannot pass the gate: a canary step other than the last is inconclusive, the last canary step fails, an observe step is inconclusive" }

    StartMigrationResponse:
      type: object
      required: [runId, planRef, links]
      properties:
        runId: { type: string }
        planRef: { type: string }
        links:
          type: object
          required: [self, events]
          properties:
            self: { type: string }
            events: { type: string }

    AbortRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 2000 }

    RunStatus:
      type: string
      description: |
        running: steps are executing.
        awaiting_switch: data is in sync; waiting for an operator to call /switch.
        succeeded: traffic and data are on the target and verified.
        rolled_back: the source serves traffic again; nothing was lost.
        halted: the target was asked to promote and something failed; an operator decides (resume continues it once the engine confirms the promotion).
        failed: failed before anything irreversible; can be resumed.
        aborted: stopped by an operator before anything irreversible; can be resumed.
        interrupted: the server restarted while the run was active; can be resumed.
      enum: [running, awaiting_switch, succeeded, rolled_back, halted, failed, aborted, interrupted]

    RunPhase:
      type: string
      description: |
        sync: precheck, prepare, presync, delta.
        canary: read traffic share on the target.
        awaiting_switch: waiting for /switch.
        cutover: fence, switchover, start-target, cutover (writes are held here).
        verify: verify, finalize.
        observe: optional; the cutover succeeded and the target's traffic is
          watched against the gate before the run ends (ObserveOptions).
        done: the run ended.
      enum: [sync, canary, awaiting_switch, cutover, verify, observe, done]

    Run:
      type: object
      required: [runId, planRef, planId, source, target, status, phase, autoSwitch, startedBy, startedAt, updatedAt, result, engine]
      properties:
        runId: { type: string }
        planRef: { type: string }
        planId: { type: string }
        source: { $ref: "#/components/schemas/PlanEndpoint" }
        target: { $ref: "#/components/schemas/PlanEndpoint" }
        status: { $ref: "#/components/schemas/RunStatus" }
        phase: { $ref: "#/components/schemas/RunPhase" }
        autoSwitch: { type: boolean }
        canary: { $ref: "#/components/schemas/CanaryResult" }
        observe: { $ref: "#/components/schemas/ObserveResult" }
        startedBy: { type: string }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        switchApprovedBy: { type: string }
        switchApprovedAt: { type: string, format: date-time }
        abortedBy: { type: string }
        abortReason: { type: string }
        statusReason: { type: string, description: why the run ended the way it did }
        result: { $ref: "#/components/schemas/RunResult" }
        engine: { $ref: "#/components/schemas/EngineState" }
        rollbackOf: { type: string, description: "the run this run rolls back (POST /v1/migrations/{runId}/rollback)" }

    SourceRetentionResponse:
      type: object
      properties:
        job:
          type: object
          required: [runId, sourceUID, pods, keepForNanos, status]
          properties:
            runId: { type: string }
            sourceUID: { type: string }
            targetUID: { type: string }
            pods:
              type: array
              items:
                type: object
                required: [name, uid]
                properties:
                  name: { type: string }
                  uid: { type: string }
            keepForNanos: { type: integer, format: int64, description: "Server policy at enrollment, in nanoseconds." }
            dueAt: { type: string, format: date-time }
            status: { type: string, enum: [captured, scheduled, blocked, deleting, deleted, cancelled] }
            reason: { type: string }
    RunResult:
      description: The numbers the console shows. Absent values were not measured (yet).
      type: object
      properties:
        writeVerification: { $ref: "#/components/schemas/WriteVerification" }
        downtimeMillis: { type: integer, format: int64, description: writes held at the gateway }
        durationMillis: { type: integer, format: int64, description: start to end }
        requests: { type: integer, format: int64, description: requests the gateway served during the run }
        failedRequests: { type: integer, format: int64, description: 5xx and proxy errors during the run }
        missingRows: { type: integer, format: int64, description: source rows missing on the target }
        missingWrites: { type: integer, format: int64, description: Missing rows in a nonempty reported-write snapshot that was actually checked; absent when unmeasured. }
        missingFiles: { type: integer, format: int64, description: objects missing on the target }
        verified: { type: boolean, description: the verify report found no problems }

    WriteVerification:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [not_configured, no_records, not_reached, measured, failed] }
        stream: { type: string }
        collectedRecords: { type: integer, format: int64, description: "Input records frozen for this run, never the current live stream count." }
        latestAt: { type: string, format: date-time }
        cutoffSeq: { type: integer, format: int64, description: Maximum observed sequence included in the verification input. Late reports are not included. }
        checked: { type: integer, format: int64 }
        missing: { type: integer, format: int64 }
        scope: { type: string, enum: [application_commits, client_acknowledged, unspecified] }
        coverage: { type: string, enum: [reservation_inserts, reported_records] }
        reason: { type: string, description: Stable reason code; no raw provider errors. }

    CanaryResult:
      type: object
      required: [options, steps]
      properties:
        options: { $ref: "#/components/schemas/CanaryOptions" }
        steps:
          type: array
          items: { $ref: "#/components/schemas/CanaryStep" }
        passed: { type: boolean }

    CanaryStep:
      type: object
      required: [weight, startedAt]
      properties:
        weight: { type: integer }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        verdict:
          description: "ok: passed. inconclusive: too few requests at a step that is not the last; the canary went on. failed: the run rolled back."
          type: string
          enum: [ok, failed, inconclusive]
        gate: { $ref: "#/components/schemas/GateResult" }

    GateResult:
      type: object
      required: [passed, reason, requests, errorRate, p95Millis]
      properties:
        passed: { type: boolean }
        reason: { type: string }
        requests: { type: integer, format: int64 }
        errorRate: { type: number }
        p95Millis: { type: number }

    EngineOutcome:
      type: string
      enum: [running, succeeded, rolled_back, halted, failed]

    StepStatus:
      type: string
      enum: [pending, running, succeeded, failed]

    StepRecord:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/StepStatus" }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        error: { type: string }
        evidence:
          type: object
          additionalProperties: true

    EngineState:
      description: The migration engine's persisted run state (migration-engine/pkg/engine.State).
      type: object
      required: [runId, planId, createdAt, updatedAt, outcome, steps, writesHeld, sourceDemoted, promoteRequested, trafficOnTarget]
      properties:
        runId: { type: string }
        planId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        outcome: { $ref: "#/components/schemas/EngineOutcome" }
        steps:
          description: "Keyed by step: precheck, prepare, presync, delta, fence, switchover, start-target, cutover, verify, finalize. start-target starts a cold plan's target app; other plans skip it. Runs from before it existed have no start-target record until resumed."
          type: object
          additionalProperties: { $ref: "#/components/schemas/StepRecord" }
        writesHeld: { type: boolean }
        writesHeldAt: { type: string, format: date-time }
        fenceLsn: { type: string }
        sourceDemoted: { type: boolean }
        promoteRequested: { type: boolean, description: the point after which nothing rolls back automatically }
        trafficOnTarget: { type: boolean }
        downtimeMillis: { type: integer, format: int64 }
        failureStep: { type: string }
        failureError: { type: string }
        rollbackError: { type: string }

    RunList:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items: { $ref: "#/components/schemas/Run" }

    RunEvent:
      description: |
        Engine kinds: step_started, step_succeeded, step_failed, step_skipped,
        log, metric, rollback, halt, done.
        Platform kinds: status_changed, canary_step, gate_result, observe_step,
        observe_rollback.

        `data` by kind (other keys may appear):
        - step_succeeded: `durationMillis` (integer), `evidence` (object).
        - metric: `lagBytes` (integer) for replication lag, or `downtimeMillis` (integer) for write downtime.
        - done: `downtimeMillis` (integer).
        - status_changed: `status` (RunStatus), `phase` (RunPhase), `reason` (string, may be empty).
        - canary_step: `weight` (integer; 0 means all reads are back on the source), `readWeights` (object of integers).
        - gate_result: `weight` (integer), `gate` (GateResult).
        - observe_step: `verdict` (ok, violated or inconclusive), `gate` (GateResult).
        - observe_rollback: `rollbackRunId` (string) or `error` (string). Recorded after the run ended.
      type: object
      required: [seq, time, runId, kind]
      properties:
        seq: { type: integer, format: int64 }
        time: { type: string, format: date-time }
        runId: { type: string }
        step: { type: string }
        kind: { type: string }
        message: { type: string }
        data:
          type: object
          additionalProperties: true

    # ---------- environments ----------

    Provider:
      type: string
      enum: [aws, gcp, onprem]

    Environment:
      type: object
      required: [name, provider, displayName, kubeContext, gatewayBackend, live, status]
      properties:
        name: { type: string, example: gke }
        provider: { $ref: "#/components/schemas/Provider" }
        displayName: { type: string, example: GCP GKE }
        region: { type: string }
        kubeContext: { type: string }
        gatewayBackend: { type: string, description: the gateway backend that serves this environment }
        live: { type: boolean, description: the gateway currently sends writes here }
        status: { $ref: "#/components/schemas/EnvironmentStatus" }

    EnvironmentStatus:
      description: |
        Read live from the cluster and cached for a few seconds. Nothing here is
        filled in when it could not be read.
      type: object
      required: [reachable, checkedAt]
      properties:
        reachable: { type: boolean, description: the API server answered /version }
        checkedAt: { type: string, format: date-time }
        error:
          type: string
          description: Why the status is incomplete. Can be set while reachable is true (for example nodes forbidden by RBAC); that part is then omitted.
        kubernetesVersion: { type: string }
        nodes: { $ref: "#/components/schemas/NodeSummary" }
        databases:
          description: CNPG clusters. Empty when there are none or CNPG is not installed; omitted when they could not be read.
          type: array
          items: { $ref: "#/components/schemas/DatabaseCluster" }

    NodeSummary:
      type: object
      required: [total, ready, architectures]
      properties:
        total: { type: integer }
        ready: { type: integer }
        architectures:
          type: array
          items: { type: string }

    DatabaseCluster:
      description: A CloudNativePG Cluster.
      type: object
      required: [namespace, name, instances, readyInstances, replica]
      properties:
        namespace: { type: string }
        name: { type: string }
        phase: { type: string }
        instances: { type: integer }
        readyInstances: { type: integer }
        currentPrimary: { type: string }
        replica: { type: boolean, description: "spec.replica.enabled, or the topology names another cluster as primary" }
        backup: { $ref: "#/components/schemas/DatabaseBackup" }

    DatabaseBackup:
      description: >
        Backups of a CNPG Cluster whose WAL archiver is an enabled Barman Cloud
        plugin (ADR 0025); absent on a Cluster without one. The times come from
        the plugin's ObjectStore; when the platform cannot read it they are
        absent and EnvironmentStatus.error says why.
      type: object
      required: [objectStore, walArchiving]
      properties:
        objectStore: { type: string, description: the plugin's ObjectStore in the Cluster's namespace }
        walArchiving: { type: boolean, description: "false when the Cluster's ContinuousArchiving condition is False: WAL is not reaching the object store. A Cluster that has not reported the condition yet counts as archiving" }
        lastSuccessfulBackup: { type: string, format: date-time }
        lastFailedBackup: { type: string, format: date-time }
        firstRecoverabilityPoint: { type: string, format: date-time, description: the earliest time a restore can reach }

    EnvironmentList:
      type: object
      required: [environments]
      properties:
        environments:
          type: array
          items: { $ref: "#/components/schemas/Environment" }

    # ---------- traffic (shared with the gateway admin API) ----------

    TrafficState:
      type: object
      required: [writeBackend, readWeights, writesHeld, heldWrites, maxHold, inFlight, backends, stats, totals, updatedAt]
      properties:
        writeBackend: { type: string, description: every non-read request goes here }
        readWeights:
          description: Share of read requests per backend, summing to 100.
          type: object
          additionalProperties: { type: integer }
        writesHeld: { type: boolean }
        heldSince: { type: string, format: date-time }
        heldWrites: { type: integer, description: write requests waiting right now }
        maxHold: { type: string, description: "a write held longer than this gets 503 hold_timeout and is never forwarded; the hold itself lasts until release" }
        inFlight: { $ref: "#/components/schemas/InFlight" }
        backends:
          type: array
          items: { $ref: "#/components/schemas/BackendState" }
        stats:
          description: Rolling window per backend.
          type: object
          additionalProperties: { $ref: "#/components/schemas/BackendStats" }
        totals:
          description: Counters per backend since the gateway started.
          type: object
          additionalProperties: { $ref: "#/components/schemas/BackendTotals" }
        updatedAt: { type: string, format: date-time }

    InFlight:
      type: object
      required: [reads, writes]
      properties:
        reads: { type: integer }
        writes: { type: integer }

    BackendState:
      type: object
      required: [name, url, healthy]
      properties:
        name: { type: string }
        url: { type: string }
        healthy: { type: boolean }
        lastCheck: { type: string, format: date-time }
        lastError: { type: string }

    BackendStats:
      type: object
      required: [windowSeconds, requests, errors, errorRate, rps, p50Millis, p95Millis, p99Millis]
      properties:
        windowSeconds: { type: integer }
        requests: { type: integer, format: int64 }
        errors: { type: integer, format: int64 }
        errorRate: { type: number }
        rps: { type: number }
        p50Millis: { type: number }
        p95Millis: { type: number }
        p99Millis: { type: number }

    BackendTotals:
      type: object
      description: >-
        What clients received from this backend since the gateway started.
        A read that failed here (5xx or no answer) and that the gateway sent
        once more to another backend is counted in retried, not in requests or
        errors; the retry is counted on the backend that answered it. Windowed
        stats (BackendStats) count every answer, retried ones included, so
        canary gates still see a failing backend.
      required: [requests, errors]
      properties:
        requests: { type: integer, format: int64 }
        errors: { type: integer, format: int64, description: answers with status 500 or above that reached the client }
        retried: { type: integer, format: int64, description: failed reads sent once more to another backend }

    RouteRequest:
      type: object
      required: [backend]
      properties:
        backend: { type: string }

    WeightsRequest:
      type: object
      required: [readWeights]
      properties:
        readWeights:
          type: object
          additionalProperties: { type: integer }

    # ---------- matrix ----------

    Matrix:
      type: object
      required: [environments, routes]
      properties:
        environments:
          type: array
          items: { type: string }
        routes:
          type: array
          items: { $ref: "#/components/schemas/MatrixRoute" }

    MatrixRoute:
      type: object
      required: [source, target]
      properties:
        source: { type: string }
        target: { type: string }
        runId: { type: string, description: absent when this pair never finished a run }
        status: { $ref: "#/components/schemas/RunStatus" }
        finishedAt: { type: string, format: date-time }
        result: { $ref: "#/components/schemas/RunResult" }

    # ---------- audit ----------

    AuditEntry:
      type: object
      required: [id, time, actor, role, action, target, status]
      properties:
        id: { type: integer, format: int64 }
        time: { type: string, format: date-time }
        actor: { type: string }
        role: { type: string }
        action: { type: string, example: "POST /v1/plans/{ref}/approve" }
        target: { type: string, example: "/v1/plans/pln_3f9c1a0b2d4e/approve" }
        status: { type: integer, description: HTTP status of the response }
        requestId: { type: string }
        detail:
          type: object
          additionalProperties: true

    AuditList:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        nextBefore: { type: integer, format: int64, description: pass as `before` for the next page }

    # ---------- service info ----------

    ServiceInfo:
      type: object
      required: [name, links]
      properties:
        name: { type: string, example: hopcharlie-platform }
        links:
          type: object
          required: [openapi, health]
          properties:
            openapi: { type: string, example: /openapi.yaml }
            health: { type: string, example: /healthz }

    # ---------- security and governance ----------

    SecurityProvider:
      type: string
      enum: [aws, gcp, onprem, cloudflare, platform]

    SecuritySeverity:
      type: string
      enum: [critical, high, medium, low, info]

    SecurityCategory:
      type: string
      enum: [identity, network, workload, data, logging, threat]

    SecuritySourceStatus:
      description: |
        - ok: read completely.
        - unavailable: the source did not answer (e.g. the cluster is unreachable).
        - not_configured: this server has no credentials or settings for the source; the message says what is missing.
        - error: credentials exist but could not be fetched (e.g. the instance metadata service timed out), or the source answered but some or all reads failed (e.g. access denied); findings read before the failure are kept.
      type: string
      enum: [ok, unavailable, not_configured, error]

    SecurityFinding:
      description: One security or governance signal, normalised across vendors.
      type: object
      required: [id, environment, provider, source, check, category, severity, title, resource, detail, recommendation, observedAt]
      properties:
        id: { type: string, description: "stable across collections: a hash of environment, source, check, resource and, where it has one, the vendor's own finding id (GuardDuty finding id, Security Hub finding ARN) or the rule's protocol, ports and CIDRs" }
        environment: { type: string, description: "an environment name, or aws-account, or platform", example: gke }
        provider: { $ref: "#/components/schemas/SecurityProvider" }
        source: { type: string, example: aws-guardduty, description: "kubernetes, aws-iam, aws-ec2, aws-cloudtrail, aws-guardduty, aws-securityhub, aws-s3, platform-audit, platform-config, storage-keys" }
        check: { type: string, example: k8s.privileged, description: the rule that produced the finding }
        category: { $ref: "#/components/schemas/SecurityCategory" }
        severity: { $ref: "#/components/schemas/SecuritySeverity" }
        title: { type: string }
        resource: { type: string, description: "what the finding is about, e.g. shop/Deployment/web/app/app or an ARN" }
        detail: { type: string }
        recommendation: { type: string }
        observedAt: { type: string, format: date-time, description: "when the source reported it, or when it was read" }
        kind: { $ref: "#/components/schemas/SecurityFindingKind" }
        controlId:
          type: string
          example: HC-IDN-03
          description: |
            The control of the platform's catalog (`GET /v1/security/controls`)
            whose check produced the finding. Absent for vendor detections and
            vendor posture findings that are passed through (GuardDuty,
            Security Hub) and for audit denials, which no catalog control
            evaluates.
        severityBasis: { $ref: "#/components/schemas/SecuritySeverityBasis" }
        exception: { $ref: "#/components/schemas/SecurityException" }

    SecurityFindingKind:
      description: |
        Set on every finding by servers that implement ADR 0034.
        - configuration: a setting checked against a control.
        - threat: a detection of activity (GuardDuty, Security Hub threat types).
        - governance: the platform's own rules about its requests and records (audit denials, unrecorded bucket keys, server settings).
        - vulnerability: a package vulnerability in an image; these are listed by `GET /v1/security/vulnerabilities`, not in `findings`.
      type: string
      enum: [configuration, threat, governance, vulnerability]

    SecuritySeverityBasisType:
      description: |
        Who decided the normalised `severity`.
        - vendor: the vendor's own label or score, either of the finding (GuardDuty, Security Hub) or of the vendor control the check matches exactly (e.g. AWS Security Hub IAM.5).
        - cvss: the CVSS base score of an advisory (vulnerabilities only).
        - platform_policy: a rule of the platform's versioned security policy (`policy`). It is not an official rating, even where it uses the same level as a related vendor control the check only partly matches.
      type: string
      enum: [vendor, cvss, platform_policy]

    SecuritySeverityBasis:
      description: |
        Where a severity came from (ADR 0034). The source's own value is kept
        as given and never overwritten; `severity` is the platform's
        normalised label for sorting and filtering.
      type: object
      required: [type, issuer, policy]
      properties:
        type: { $ref: "#/components/schemas/SecuritySeverityBasisType" }
        issuer: { type: string, example: AWS Security Hub CSPM, description: "who issued the source value, or HopCharlie for platform_policy" }
        sourceSeverity: { type: string, example: HIGH, description: "the source's label or value exactly as given" }
        sourceScore: { type: number, format: double, example: 8, description: "the source's numeric score (GuardDuty 1.0-10.0, a CVSS base score)" }
        sourceFindingId: { type: string, description: "the vendor's own finding id or ARN" }
        sourceUrl: { type: string, description: "the official page of the vendor control or advisory the value comes from" }
        policy: { type: string, example: "hopcharlie-security-policy/2026-11-06.1", description: the version of the platform's control catalog and mapping rules that produced `severity` }
        reason: { type: string, description: "why this basis applies, e.g. which vendor control matches exactly or why a platform rule was used" }

    SecurityControlDomain:
      description: |
        The five areas of the common controls. A domain is a grouping, not a
        check: it is never a unit of a pass rate.
        - identity: least privilege and strong authentication.
        - data: encryption and data exposure.
        - logging: audit logs and threat monitoring.
        - policy: secure configuration of workloads and network.
        - vulnerability: vulnerability management of running images.
      type: string
      enum: [identity, data, logging, policy, vulnerability]

    SecurityControlResult:
      description: |
        - pass: the check read the asset and its condition holds.
        - fail: the check read the asset and its condition does not hold; `findingIds` name the findings.
        - unknown: the asset could not be read (no answer, denied, not connected). It is never counted as pass.
        - not_applicable: the condition does not apply to the asset (e.g. MFA for a user with no console password). Not part of the denominator.
      type: string
      enum: [pass, fail, unknown, not_applicable]

    SecurityControlRelation:
      description: |
        - exact: the check reads the same condition, scope and exceptions as the referenced control.
        - partial: the check covers part of it (fewer conditions, another scope, other exceptions); passing it does not mean passing the referenced control.
      type: string
      enum: [exact, partial]

    SecurityControlReference:
      type: object
      required: [framework, version, id, url, relation]
      properties:
        framework: { type: string, example: AWS Security Hub CSPM, description: "NIST SP 800-53, AWS Security Hub CSPM, Kubernetes Pod Security Standards or CIS Kubernetes Benchmark" }
        version: { type: string, example: "control reference as of 2026-11-06" }
        id: { type: string, example: IAM.5 }
        title: { type: string }
        url: { type: string, example: "https://docs.aws.amazon.com/securityhub/latest/userguide/iam-controls.html#iam-5" }
        relation: { $ref: "#/components/schemas/SecurityControlRelation" }
        severity: { type: string, example: Medium, description: "the referenced control's own severity, when its publisher gives one" }
        note: { type: string, description: "what differs, for a partial match" }

    SecurityControl:
      description: One control of the platform's catalog, checked by one check.
      type: object
      required: [id, title, domain, check, source, asset, condition, mapping, references, failSeverity, severityBasis, limitations]
      properties:
        id: { type: string, example: HC-IDN-03 }
        title: { type: string }
        domain: { $ref: "#/components/schemas/SecurityControlDomain" }
        check: { type: string, example: aws.user-mfa, description: "the `check` of the findings it produces" }
        source: { type: string, example: aws-iam, description: the source that evaluates it }
        asset: { type: string, example: IAM user with a console password, description: what one evaluation is about }
        condition: { type: string, description: when an asset passes }
        mapping:
          description: The closest relation among `references`; unmapped when there is none and the control is the platform's own rule.
          type: string
          enum: [exact, partial, unmapped]
        references:
          type: array
          items: { $ref: "#/components/schemas/SecurityControlReference" }
        failSeverity: { type: string, example: medium, description: "the severity of a failing asset's finding, or `varies` when it depends on the finding (see severityBasis.reason)" }
        severityBasis: { $ref: "#/components/schemas/SecuritySeverityBasis" }
        limitations:
          description: What the check does not establish.
          type: array
          items: { type: string }

    SecurityControlEvaluation:
      description: One control evaluated on one asset of one environment.
      type: object
      required: [id, controlId, environment, source, asset, result, reason, evaluatedAt, findingIds]
      properties:
        id: { type: string, description: "stable across collections: a hash of environment, control and asset" }
        controlId: { type: string }
        environment: { type: string }
        source: { type: string }
        asset: { type: string, example: "arn:aws:iam::123456789012:user/alice", description: "the asset, or `*` when the whole source could not be read" }
        result: { $ref: "#/components/schemas/SecurityControlResult" }
        reason: { type: string, description: "the evidence read, or why the result is unknown or not applicable" }
        evaluatedAt: { type: string, format: date-time }
        findingIds:
          description: The findings of a failing evaluation.
          type: array
          items: { type: string }

    SecurityControlCounts:
      description: |
        Evaluations by result. `applicable` is pass + fail + unknown and is the
        denominator; not_applicable is left out of it. `evaluated` is pass +
        fail.
      type: object
      required: [applicable, evaluated, pass, fail, unknown, notApplicable]
      properties:
        applicable: { type: integer }
        evaluated: { type: integer }
        pass: { type: integer }
        fail: { type: integer }
        unknown: { type: integer }
        notApplicable: { type: integer }

    SecurityControlCoverage:
      description: The evaluations of one environment and domain.
      type: object
      required: [environment, domain, state, counts]
      properties:
        environment: { type: string }
        domain: { $ref: "#/components/schemas/SecurityControlDomain" }
        state:
          description: |
            - evaluated: at least one catalog control of the domain applies to the environment and was evaluated.
            - not_connected: controls apply but their source is not connected or could not be read; every evaluation is unknown.
            - unsupported: no catalog control of the domain applies to this environment yet; `reason` says what is not checked. It is not a pass.
          type: string
          enum: [evaluated, not_connected, unsupported]
        reason: { type: string }
        counts: { $ref: "#/components/schemas/SecurityControlCounts" }

    SecurityControlReport:
      type: object
      required: [generatedAt, policyVersion, controls, evaluations, coverage]
      properties:
        generatedAt: { type: string, format: date-time, description: "when the sources were read (as `SecurityReport.generatedAt`)" }
        policyVersion: { type: string, example: "hopcharlie-security-policy/2026-11-06.1" }
        controls:
          type: array
          items: { $ref: "#/components/schemas/SecurityControl" }
        evaluations:
          description: By environment (in the order of the sources), then control, then asset.
          type: array
          items: { $ref: "#/components/schemas/SecurityControlEvaluation" }
        coverage:
          description: One row per environment and domain, in the order of the sources and of the domain enum.
          type: array
          items: { $ref: "#/components/schemas/SecurityControlCoverage" }

    SecurityVulnerabilitySeverity:
      description: |
        The normalised severity of a package vulnerability. `unknown` means no
        source gave a severity or score; it is not low and not none.
        `negligible` is a distribution's own label below low.
      type: string
      enum: [critical, high, medium, low, negligible, unknown]

    SecurityCVSS:
      description: One CVSS score of an advisory as its source gave it. Versions are not converted into each other.
      type: object
      required: [source, version, vector, baseScore]
      properties:
        source: { type: string, example: nvd@nist.gov, description: "who published the score (NVD, a CNA, a distribution)" }
        version: { type: string, example: "3.1" }
        vector: { type: string, example: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H" }
        baseScore: { type: number, format: double, example: 9.8 }

    SecurityPackage:
      type: object
      required: [name, version, type]
      properties:
        name: { type: string, example: openssl }
        version: { type: string, example: 3.0.13-1~deb12u1, description: the installed version }
        type: { type: string, example: deb, description: "the package ecosystem: deb, apk, rpm, go-module, npm, python, java-archive, ..." }
        purl: { type: string, example: "pkg:deb/debian/openssl@3.0.13-1~deb12u1?distro=debian-12" }
        distro: { type: string, example: debian-12 }

    SecurityImageScan:
      description: One scan of one image digest by the platform's scanner (ADR 0034).
      type: object
      required: [id, digest, status, scanner]
      properties:
        id: { type: string }
        image: { type: string, example: "registry.example/app@sha256:4c2e...", description: the reference that was scanned }
        digest: { type: string, example: "sha256:4c2e...", description: "the manifest digest that was scanned (for a multi-arch index, the platform manifest)" }
        platform: { type: string, example: linux/amd64 }
        status:
          description: |
            - succeeded: the scan finished; zero vulnerabilities means none were matched with this database, not that the image is safe.
            - failed: the scan did not finish; `message` says why. Its image has no result.
            - unsupported: the scanner cannot read this image (e.g. no package database).
          type: string
          enum: [succeeded, failed, unsupported]
        scanner:
          type: object
          required: [name, version]
          properties:
            name: { type: string, example: grype }
            version: { type: string }
        database:
          type: object
          properties:
            builtAt: { type: string, format: date-time, description: when the vulnerability database was built }
            schemaVersion: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        packages: { type: integer, description: packages in the image's SBOM }
        resultSha256: { type: string, description: hash of the scanner's original result kept by the platform }
        message: { type: string }

    SecurityScanSubmission:
      description: One scan result of the image scan workflow (SEC-04).
      type: object
      required: [image, digest, status]
      properties:
        image: { type: string, example: "registry.example/app@sha256:4c2e...", description: "the reference that was scanned: a repository and `@digest`" }
        digest: { type: string, example: "sha256:4c2e...", description: "the running digest the scan is for, as the runtime reported it" }
        status:
          type: string
          enum: [succeeded, failed, unsupported]
        message: { type: string, description: why a scan failed or is unsupported }
        scannerVersion: { type: string, example: 0.121.0, description: "the Grype version; a succeeded scan takes it from the report" }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        report:
          type: object
          additionalProperties: true
          description: "Grype's JSON report (`grype -o json`), required when status is succeeded"

    SecurityException:
      description: |
        An operator's time-limited exception for one finding or vulnerability
        (SEC-08, ADR 0034). It never changes severity. Active while not revoked
        and before expiresAt; a severity change does not end it.
      type: object
      required: [id, targetType, targetId, reason, expiresAt, createdBy, createdAt]
      properties:
        id: { type: string, example: sx_3f2a9c1b }
        targetType: { $ref: "#/components/schemas/SecurityExceptionTarget" }
        targetId: { type: string, description: "a SecurityFinding id or a SecurityVulnerability id" }
        reason: { type: string }
        expiresAt: { type: string, format: date-time }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
        revokedBy: { type: string }

    SecurityExceptionTarget:
      type: string
      enum: [finding, vulnerability]

    SecurityExceptionRequest:
      type: object
      required: [targetType, targetId, reason, expiresAt]
      properties:
        targetType: { $ref: "#/components/schemas/SecurityExceptionTarget" }
        targetId: { type: string }
        reason: { type: string, minLength: 1, maxLength: 500 }
        expiresAt: { type: string, format: date-time, description: "after now and at most 30 days later; at most 7 days for a KEV-listed vulnerability" }

    SecurityExceptionList:
      type: object
      required: [exceptions]
      properties:
        exceptions: { type: array, items: { $ref: "#/components/schemas/SecurityException" } }

    SecurityVulnerability:
      description: One advisory matched to one package of one scanned image digest.
      type: object
      required: [id, scanId, digest, advisory, aliases, package, fixedVersions, fixState, severity, severityBasis, cvss, urls]
      properties:
        id: { type: string, description: "stable: a hash of digest, advisory and the package's purl or name, version and type" }
        scanId: { type: string }
        digest: { type: string }
        advisory: { type: string, example: CVE-2024-6387, description: "the advisory id: a CVE, or a GHSA or distribution id where there is no CVE" }
        aliases: { type: array, items: { type: string } }
        package: { $ref: "#/components/schemas/SecurityPackage" }
        fixedVersions: { type: array, items: { type: string }, description: "empty when the source names no fixed version; that does not mean there is no fix" }
        fixState:
          type: string
          enum: [fixed, not_fixed, wont_fix, unknown]
        severity: { $ref: "#/components/schemas/SecurityVulnerabilitySeverity" }
        severityBasis: { $ref: "#/components/schemas/SecuritySeverityBasis" }
        cvss: { type: array, items: { $ref: "#/components/schemas/SecurityCVSS" } }
        urls: { type: array, items: { type: string } }
        exploitation: { $ref: "#/components/schemas/SecurityExploitation" }
        exception: { $ref: "#/components/schemas/SecurityException" }

    SecurityExploitation:
      description: |
        Exploitation evidence for the vulnerability's CVE (SEC-07, ADR 0034),
        read when the report is built. It is a separate basis for priority and
        never changes `severity`; scores are not combined. VEX is not applied.
      type: object
      required: [kev, epss]
      properties:
        cve: { type: string, example: CVE-2024-6387, description: "the CVE looked up: the advisory, or its first CVE alias; absent when there is none" }
        kev: { $ref: "#/components/schemas/SecurityKEV" }
        epss: { $ref: "#/components/schemas/SecurityEPSS" }

    SecurityKEV:
      description: The CISA Known Exploited Vulnerabilities catalog.
      type: object
      required: [state]
      properties:
        state:
          description: |
            - listed: the CVE is in the catalog.
            - not_listed: a catalog read in the last 3 days does not have the CVE.
            - unknown: no catalog read in the last 3 days; this is not "not listed".
            - no_cve: the vulnerability has no CVE id, so the catalog does not apply.
          type: string
          enum: [listed, not_listed, unknown, no_cve]
        catalogVersion: { type: string, example: "2026.11.04" }
        dateAdded: { type: string, example: "2026-11-04", description: "YYYY-MM-DD; listed only" }
        dueDate: { type: string, example: "2026-11-18", description: "the catalog's remediation due date for US federal agencies (YYYY-MM-DD); listed only" }
        ransomware: { type: boolean, description: "the catalog's knownRansomwareCampaignUse is Known; listed only" }

    SecurityEPSS:
      description: The FIRST Exploit Prediction Scoring System score of the CVE.
      type: object
      required: [state]
      properties:
        state:
          description: |
            - scored: FIRST has a score for the CVE.
            - not_scored: FIRST answered and has no score for the CVE.
            - unknown: no answer in the last 3 days; this is not "not scored".
            - no_cve: the vulnerability has no CVE id.
          type: string
          enum: [scored, not_scored, unknown, no_cve]
        probability: { type: number, format: double, example: 0.042, description: "0..1: estimated probability of exploitation activity in the next 30 days" }
        percentile: { type: number, format: double, example: 0.92, description: "0..1: the share of scored CVEs with a lower or equal score" }
        date: { type: string, example: "2026-11-06", description: "the score date (YYYY-MM-DD)" }

    SecurityExploitSource:
      description: The state of one exploitation evidence source for this report (SEC-07).
      type: object
      required: [name, state, message]
      properties:
        name: { type: string, example: cisa-kev, description: "cisa-kev or first-epss" }
        state:
          description: |
            - ok: read and current.
            - stale: the last refresh failed; values read earlier (at most 3 days old) are used.
            - unavailable: nothing current was read; values are unknown.
            - idle: nothing to look up (no CVE in the report).
          type: string
          enum: [ok, stale, unavailable, idle]
        version: { type: string, description: "KEV catalogVersion, or the EPSS score date" }
        collectedAt: { type: string, format: date-time, description: the last successful read }
        message: { type: string }

    SecurityRunningImage:
      description: |
        One container of a running workload and the image it runs, read from
        the cluster (ADR 0034). The tag in `image` is for display; the digest
        identifies the image.
      type: object
      required: [environment, namespace, workload, container, image, scanState]
      properties:
        environment: { type: string }
        namespace: { type: string }
        workload: { type: string, example: Deployment/web }
        container: { type: string }
        app: { type: string, description: "the app, from the label app.kubernetes.io/part-of that the platform's app chart sets; absent when the pod lacks the chart's labels" }
        instance: { type: string, description: "the app instance (ADR 0015), from the label app.kubernetes.io/instance when it equals the namespace; absent otherwise" }
        image: { type: string, description: the image the pod spec names }
        digest: { type: string, description: "the digest the kubelet reports in the container status; absent when the runtime gave none" }
        scanId: { type: string, description: the latest scan of `digest` }
        scanState:
          description: |
            - scanned: a succeeded scan of the digest exists.
            - scan_failed: the latest scan of the digest failed or was unsupported.
            - not_scanned: no scan of the digest exists.
            - unknown_digest: the runtime reported no digest, so no scan can be matched.
          type: string
          enum: [scanned, scan_failed, not_scanned, unknown_digest]
        deployed: { $ref: "#/components/schemas/SecurityDeployedImage" }

    SecurityDeployedImage:
      description: |
        The running digest compared with the platform's deployment record of
        the instance (SEC-05): the latest deployment that reached the
        environment (healthy or degraded) and its image for the service named
        like the container. Digests are compared as recorded; an image index
        and a platform manifest of the same image have different digests, so a
        mismatch says what differs, not that the image is foreign.
      type: object
      required: [state]
      properties:
        state:
          description: |
            - match: the running digest is the deployed one.
            - mismatch: the running digest differs from the deployed one.
            - no_record: no deployment of the instance reached this environment, or it has no service of this name.
            - unknown: no instance label, no running or recorded digest, or the records could not be read.
          type: string
          enum: [match, mismatch, no_record, unknown]
        deploymentId: { type: string }
        image: { type: string, description: the image the deployment recorded for the service }
        digest: { type: string, description: the digest in that image }
        reason: { type: string }

    SecurityScannerState:
      type: object
      required: [status]
      properties:
        status:
          description: |
            - connected: the platform reads scan results.
            - not_configured: no scanner results are connected; `scans` and `vulnerabilities` are empty and this means "not scanned", not "no vulnerabilities".
            - error: results could not be read; `message` says why.
          type: string
          enum: [connected, not_configured, error]
        message: { type: string }

    SecurityVulnerabilitySummary:
      description: |
        Separate counts, each with its own unit: distinct advisories, distinct
        scanned digests, running containers of a scanned digest with at least
        one vulnerability, and advisory-package-digest occurrences.
      type: object
      required: [advisories, images, affectedContainers, occurrences, notScannedContainers]
      properties:
        advisories: { type: integer }
        images: { type: integer }
        affectedContainers: { type: integer }
        occurrences: { type: integer }
        notScannedContainers: { type: integer, description: "running containers whose digest has no succeeded scan (not_scanned, scan_failed or unknown_digest)" }
        driftedContainers: { type: integer, description: "running containers whose digest differs from the deployed one (deployed.state mismatch); absent when deployment records are not compared" }

    SecurityVulnerabilityReport:
      type: object
      required: [generatedAt, scanner, scans, vulnerabilities, runningImages, summary]
      properties:
        generatedAt: { type: string, format: date-time }
        scanner: { $ref: "#/components/schemas/SecurityScannerState" }
        scans:
          type: array
          items: { $ref: "#/components/schemas/SecurityImageScan" }
        vulnerabilities:
          type: array
          items: { $ref: "#/components/schemas/SecurityVulnerability" }
        runningImages:
          description: Containers of running pods outside system namespaces, by environment, namespace, workload and container. An environment whose cluster could not be read has none; see `sources` of `GET /v1/security`.
          type: array
          items: { $ref: "#/components/schemas/SecurityRunningImage" }
        summary: { $ref: "#/components/schemas/SecurityVulnerabilitySummary" }
        exploitSources:
          description: KEV and EPSS read state for this report (SEC-07); absent when the server does not look them up.
          type: array
          items: { $ref: "#/components/schemas/SecurityExploitSource" }

    SecuritySource:
      type: object
      required: [name, provider, environment, status, checkedAt, findings]
      properties:
        name: { type: string, example: aws-guardduty }
        provider: { $ref: "#/components/schemas/SecurityProvider" }
        environment: { type: string }
        status: { $ref: "#/components/schemas/SecuritySourceStatus" }
        message: { type: string, description: "why the status is not ok, or what was read" }
        checkedAt: { type: string, format: date-time }
        findings: { type: integer, description: findings from this source in this response }

    SeverityCounts:
      type: object
      required: [total, critical, high, medium, low, info]
      properties:
        total: { type: integer }
        critical: { type: integer }
        high: { type: integer }
        medium: { type: integer }
        low: { type: integer }
        info: { type: integer }

    SecuritySummary:
      type: object
      required: [bySeverity, byEnvironment]
      properties:
        bySeverity: { $ref: "#/components/schemas/SeverityCounts" }
        byEnvironment:
          description: Counts per environment; every environment with a source appears, even with no findings.
          type: object
          additionalProperties: { $ref: "#/components/schemas/SeverityCounts" }

    SecurityOCSFExport:
      type: object
      required: [ocsfVersion, generatedAt, findings, vulnerabilities, controls]
      properties:
        ocsfVersion:
          type: string
          description: OCSF version the events follow
          example: "1.9.0"
        generatedAt:
          type: string
          format: date-time
          description: when the sources were read (as `SecurityReport.generatedAt`)
        findings:
          type: array
          description: |
            OCSF Detection Finding (2004) and Compliance Finding (2003) events,
            as the OCSF schema defines them (snake_case keys, `time` in epoch
            milliseconds). Their shape is the OCSF standard's, not this API's,
            so it is not repeated here.
          items:
            type: object
            additionalProperties: true
        vulnerabilities:
          type: array
          description: |
            OCSF Vulnerability Finding (2002) events, one per vulnerability,
            as the OCSF schema defines them (snake_case keys, `time` in epoch
            milliseconds). Their shape is the OCSF standard's, not this API's,
            so it is not repeated here.
          items:
            type: object
            additionalProperties: true
        controls:
          type: array
          description: |
            OCSF Compliance Finding (2003) events, one per control evaluation
            (not_applicable left out), as the OCSF schema defines them
            (snake_case keys, `time` in epoch milliseconds). Their shape is
            the OCSF standard's, not this API's, so it is not repeated here.
          items:
            type: object
            additionalProperties: true
    SecurityReport:
      type: object
      required: [generatedAt, summary, sources, findings, storageKeys]
      properties:
        generatedAt: { type: string, format: date-time, description: when the sources were read }
        summary: { $ref: "#/components/schemas/SecuritySummary" }
        sources:
          type: array
          items: { $ref: "#/components/schemas/SecuritySource" }
        findings:
          description: Most severe first.
          type: array
          items: { $ref: "#/components/schemas/SecurityFinding" }
        storageKeys:
          description: |
            The bucket keys of app instances (ADR 0016), by environment (in
            the order of `sources`) and then instance; for each instance, the
            key in use first, then the old one, then keys the platform has no
            record of. Empty when no instance has a bucket or the server has
            no storage drivers. An environment's keys are also left out when
            its `storage-keys` source could not read the platform's records
            or did not answer in time, so an empty list means "no keys" only
            when every `storage-keys` source is `ok`.
          type: array
          items: { $ref: "#/components/schemas/StorageKey" }

    StorageKeyUse:
      description: |
        - current: the key the instance's pods are given.
        - old: the key a new key replaced; pods that did not restart may still use it. It is deleted after a healthy deployment restarted them (ADR 0016).
        - unrecorded: a key of the instance's user the platform has no record of, e.g. made by hand. The driver deletes it before it makes the next new key.
      type: string
      enum: [current, old, unrecorded]

    StorageKeyState:
      description: |
        - ok: the provider has the key, and it is active.
        - inactive: the provider has the key, but it is deactivated. The platform still counts it as present, so a deactivated key in use breaks the app until someone activates or deletes it.
        - missing: the platform's record names a key the provider does not have (deleted outside the platform). The next deployment makes a new key.
        - unread: the key could not be read back from the provider; `message` says why.
      type: string
      enum: [ok, inactive, missing, unread]

    StorageKey:
      description: One key of an app instance's bucket in one environment (ADR 0027).
      type: object
      required: [app, instance, environment, driver, bucket, keyId, use, state]
      properties:
        app: { type: string, example: moimroom }
        instance: { type: string, example: moimroom }
        environment: { type: string, example: eks }
        driver: { type: string, example: aws, description: "the storage driver that made the key: aws, gcs or minio" }
        bucket: { type: string, example: hopcharlie-eks-moimroom, description: the only bucket the key may use }
        keyId: { type: string, example: "...WXYZ", description: the last four characters of the key id only }
        use: { $ref: "#/components/schemas/StorageKeyUse" }
        state: { $ref: "#/components/schemas/StorageKeyState" }
        createdAt:
          type: string
          format: date-time
          description: |
            When the provider made the key: the IAM access key's CreateDate
            (aws) or the HMAC key's timeCreated (gcs). Absent when the
            provider does not record it (minio) or the key was not read.
        scope: { $ref: "#/components/schemas/StorageKeyScope" }
        message: { type: string, description: "why the state is not ok, or what to do about the key" }

    StorageKeyScope:
      description: |
        What the key may do on `bucket`: the grant the driver writes on every
        deployment (aws: the user's inline policy `hopcharlie-bucket`; minio:
        the user's canned policy; gcs: the service account's roles on the
        bucket). It is the platform's grant, not read back from the provider.
        Absent when the key's driver could not be used (the environment has no
        usable storage driver, or its driver now is not the one that made the
        key).
      type: object
      required: [actions]
      properties:
        actions:
          description: S3 actions (aws, minio) or GCS roles (gcs).
          type: array
          items: { type: string }
          example: [s3:ListBucket, s3:GetObject, s3:PutObject]
        boundary: { type: string, description: "aws: the permissions boundary every app user is made with, which caps any policy the user has" }

    # ---------- agent activity ----------

    AgentSessionKind:
      type: string
      enum: [plan, rehearsal, diagnose, explain, other]

    AgentSessionStatus:
      type: string
      enum: [running, succeeded, failed, cancelled]

    AgentEventType:
      type: string
      enum: [tool_call, tool_result, message, blocked, decision, error]

    CreateAgentSessionRequest:
      type: object
      required: [kind, title]
      properties:
        kind: { $ref: "#/components/schemas/AgentSessionKind" }
        title: { type: string, maxLength: 200 }
        planRef: { type: string }
        runId: { type: string }
        model: { type: string, example: claude-opus-4-5 }

    AgentSessionTotals:
      type: object
      required: [events, toolCalls, inputTokens, outputTokens, durationMillis]
      properties:
        events: { type: integer, format: int64 }
        toolCalls: { type: integer, format: int64 }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        durationMillis: { type: integer, format: int64, description: "sum of the events' durationMillis; wall-clock time is endedAt - createdAt" }

    AgentSession:
      type: object
      required: [id, kind, title, actor, status, createdAt, totals]
      properties:
        id: { type: string, example: ags_3f9c1a0b2d4e }
        kind: { $ref: "#/components/schemas/AgentSessionKind" }
        title: { type: string }
        actor: { type: string, description: the token name that started the session }
        planRef: { type: string }
        runId: { type: string }
        model: { type: string }
        status: { $ref: "#/components/schemas/AgentSessionStatus" }
        summary: { type: string }
        createdAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        totals: { $ref: "#/components/schemas/AgentSessionTotals" }

    AgentSessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items: { $ref: "#/components/schemas/AgentSession" }

    TokenUsage:
      type: object
      required: [inputTokens, outputTokens]
      properties:
        inputTokens: { type: integer, format: int64, minimum: 0 }
        outputTokens: { type: integer, format: int64, minimum: 0 }

    AgentEventRequest:
      type: object
      required: [type]
      properties:
        type: { $ref: "#/components/schemas/AgentEventType" }
        tool: { type: string, maxLength: 200, description: "the tool name for tool_call, tool_result and blocked" }
        input: { description: "any JSON value, up to 64 KiB" }
        output: { description: "any JSON value, up to 64 KiB" }
        status: { type: string, maxLength: 64, example: ok }
        durationMillis: { type: integer, format: int64, minimum: 0 }
        usage: { $ref: "#/components/schemas/TokenUsage" }

    AgentEvent:
      type: object
      required: [seq, sessionId, time, type]
      properties:
        seq: { type: integer, format: int64 }
        sessionId: { type: string }
        time: { type: string, format: date-time }
        type: { $ref: "#/components/schemas/AgentEventType" }
        tool: { type: string }
        input: { description: 'any JSON value; credential-like values are "[redacted]"' }
        output: { description: 'any JSON value; credential-like values are "[redacted]"' }
        status: { type: string }
        durationMillis: { type: integer, format: int64 }
        usage: { $ref: "#/components/schemas/TokenUsage" }

    AgentEventList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/AgentEvent" }
        nextAfter:
          type: integer
          format: int64
          description: Set when more events follow this page; pass it as `after` to read them.

    FinishAgentSessionRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/AgentSessionStatus" }
        summary: { type: string, maxLength: 4000 }

    # ---------- plan tools: written records, attachments, apps, drafts, rollback ----------

    WrittenRecord:
      description: One producer-reported table/PK receipt; scope identifies application commits or client acknowledgements.
      type: object
      additionalProperties: false
      required: [table, pk]
      properties:
        eventId: { type: string, maxLength: 100, description: Optional stable producer event identifier; retries of identical events are deduplicated within the stream. }
        table: { type: string, example: orders.orders, description: "schema.table or table" }
        pk: { type: string, maxLength: 200, example: "42", description: 'the primary key as text; composite keys as "(a,b)"' }
        at: { type: string, format: date-time, description: "Producer event recording time; app outbox INSERT time is before commit completion. Defaults to server receipt time." }

    WrittenRecordsRequest:
      type: object
      additionalProperties: false
      required: [records]
      properties:
        generation: { type: string, maxLength: 64, description: Source database generation; required for application commit receipts. }
        scope: { type: string, enum: [application_commits, client_acknowledged, unspecified] }
        coverage: { type: string, enum: [reservation_inserts, reported_records] }
        records:
          type: array
          minItems: 1
          maxItems: 5000
          items: { $ref: "#/components/schemas/WrittenRecord" }

    WrittenRecordsAccepted:
      type: object
      required: [accepted]
      properties:
        accepted: { type: integer, description: Input records accepted atomically; identical eventId retries count as accepted without increasing stored count. }

    WrittenRecordStats:
      type: object
      required: [stream, count]
      properties:
        generation: { type: string }
        lastSeq: { type: integer, format: int64 }
        scope: { type: string, enum: [application_commits, client_acknowledged, unspecified] }
        coverage: { type: string, enum: [reservation_inserts, reported_records] }
        stream: { type: string }
        count: { type: integer, format: int64 }
        latestAt: { type: string, format: date-time, description: the newest record's time; absent when the stream is empty }

    PlanAttachment:
      type: object
      required: [name, size, sha256]
      properties:
        name: { type: string, example: target.yaml }
        size: { type: integer, format: int64, description: bytes }
        sha256: { type: string, description: hex SHA-256 of the content }

    AppList:
      type: object
      required: [apps]
      properties:
        apps:
          type: array
          items: { $ref: "#/components/schemas/App" }

    App:
      description: |
        An application from PLATFORM_APPS_FILE, registered from GitHub, or
        both under one name. `namespace`, `database` and `environments` are
        what migrations use; `deploy` is set for registered apps. A
        registered app that is not in the file has `namespace` = name,
        `database` = `{name: app, user: app, schemas: []}` and no
        `environments`.
      type: object
      required: [name, namespace, database, environments]
      properties:
        name: { type: string, example: shop }
        namespace: { type: string, example: shop }
        database: { $ref: "#/components/schemas/AppDatabase" }
        environments:
          description: The environments the app runs in according to PLATFORM_APPS_FILE, in PLATFORM_ENVS_FILE order. Empty for an app that is only registered from GitHub (see deploy.environments).
          type: array
          items: { $ref: "#/components/schemas/AppEnvironment" }
        deploy: { $ref: "#/components/schemas/AppDeploy" }

    AppDatabase:
      type: object
      required: [name, user, schemas]
      properties:
        name: { type: string, example: app }
        user: { type: string, example: app }
        schemas:
          description: Schemas verification compares. Empty means the engine default (public).
          type: array
          items: { type: string }

    AppEnvironment:
      type: object
      required: [env, cnpgCluster, dbHost]
      properties:
        env: { type: string, example: gke }
        cnpgCluster: { type: string, example: shop-db-gke }
        dbHost: { type: string, description: "host:port of the cluster's -rw service", example: "shop-db-gke-rw.shop.gke.ts.net:5432" }
        bucket: { type: string, description: the rclone remote and bucket of the app's files, example: "gcs:shop-uploads-gke" }

    BucketInspectRequest:
      type: object
      additionalProperties: false
      required: [bucket]
      properties:
        bucket:
          type: string
          description: A bucket the residency policy registers, as plans name it (`remote:bucket[/path]`).
          example: "minio:moimroom-photos-onprem"
        prefix:
          type: string
          description: One listed first-level prefix (ending in `/`) to describe the objects of.
          example: "hosts/"
    BucketObservation:
      type: object
      description: What the server measured through the rclone remote a copy would use.
      required: [hosting, location, locationType, endpointIPs, prefixes, replicas, tiered]
      properties:
        hosting:
          type: string
          enum: [provider, self]
          description: "`provider`: AWS S3 or GCS at the provider's endpoint, whose location the provider reports. `self`: a store the operator runs (MinIO), whose region is only its own setting."
        location: { type: string, description: "Lowercase location code; empty when a self-hosted store reports none." }
        locationType: { type: string, description: "region, dual-region or multi-region; empty when unknown." }
        endpointIPs: { type: array, items: { type: string }, description: "Addresses the endpoint host resolved to." }
        prefixes: { type: array, items: { type: string }, description: "First-level prefixes; \"\" stands for objects directly under the bucket path." }
        replicas: { type: array, items: { type: string }, description: "Buckets the bucket replicates into (not read by inspect)." }
        tiered: { type: boolean, description: "A self-hosted store's lifecycle moves objects to another tier." }
    BucketPrefixStatus:
      type: object
      required: [prefix, status]
      properties:
        prefix: { type: string }
        status:
          type: string
          enum: [classified, unclassified, missing]
          description: "`unclassified`: listed but not in the policy (a run would be denied); `missing`: in the policy but not listed."
        label: { type: string, enum: [kr-only, apac, global], description: "The policy's label, when it has one." }
    BucketSample:
      type: object
      description: Counts describing the first objects under one prefix. No key, value or content.
      required: [prefix, objects, truncated, contentTypes, extensions, metadataKeys, keyPatterns, minSize, maxSize, maxDepth]
      properties:
        prefix: { type: string }
        objects: { type: integer, description: "Objects read (at most 50)." }
        truncated: { type: boolean, description: "More objects exist than were read." }
        contentTypes: { type: object, additionalProperties: { type: integer } }
        extensions: { type: object, additionalProperties: { type: integer } }
        metadataKeys: { type: object, additionalProperties: { type: integer }, description: "User metadata names (never values)." }
        keyPatterns: { type: object, additionalProperties: { type: integer }, description: "Keys matching each personal-data pattern." }
        minSize: { type: integer, format: int64 }
        maxSize: { type: integer, format: int64 }
        maxDepth: { type: integer, description: "Deepest key below the prefix, in path segments." }
    BucketInspection:
      type: object
      required: [bucket, policyDigest, environment, label, observation, prefixes]
      properties:
        bucket: { type: string }
        policyDigest: { type: string }
        environment: { type: string, description: "Where the policy says the bucket is." }
        label: { type: string, enum: [kr-only, apac, global], description: "The bucket label (objects directly under its path)." }
        observation: { $ref: "#/components/schemas/BucketObservation" }
        prefixes: { type: array, items: { $ref: "#/components/schemas/BucketPrefixStatus" } }
        sample: { $ref: "#/components/schemas/BucketSample" }
    PlanDraftRequest:
      type: object
      additionalProperties: false
      required: [app, source, target]
      properties:
        app: { type: string, example: shop }
        source: { type: string, example: gke }
        target: { type: string, example: eks }
        files: { type: boolean, description: "false leaves object storage out even when both environments have a bucket" }
        writtenRecordsStream: { type: string, description: 'sets verify.writtenRecords to "stream:<name>"' }
        sourceStats: { type: boolean, default: false, description: "also measure the source database; the response becomes a PlanDraftResult" }

    PlanDraftResult:
      type: object
      required: [plan]
      properties:
        plan: { $ref: "#/components/schemas/EnginePlan" }
        sourceStats: { $ref: "#/components/schemas/SourceStats" }
        sourceStatsReason:
          type: string
          enum: [not_measured]
          description: Why sourceStats is absent. not_measured covers an unset password variable, an unreachable database and a failed query. For an app registered with a database pair, an unreachable database usually means the management cluster's route to it is still being made (a few minutes after registration); draft again later.

    SourceStats:
      description: |
        The source database as the capacity gate measures it. A hot standby
        target needs max_connections and max_worker_processes of at least the
        source's to start, and the gate wants max_connections of at least
        sessions x 1.2.
      type: object
      required: [sessions, maxConnections, maxWorkerProcesses, windowSeconds, measuredAt]
      properties:
        sessions: { type: integer, description: "client sessions now (pg_stat_activity client backends)", example: 80 }
        maxConnections: { type: integer, example: 200 }
        maxWorkerProcesses: { type: integer, example: 8 }
        bytes: { type: integer, format: int64, description: "total size of the databases that accept connections; absent when not measured", example: 2147483648 }
        walBytesPerSecond: { type: number, format: double, description: "WAL written per second over the window; absent when not measured", example: 1048576 }
        windowSeconds: { type: number, format: double, description: "length of the WAL window", example: 5 }
        measuredAt: { type: string, format: date-time }

    RollbackRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 2000 }
        autoSwitch:
          type: boolean
          default: true
          description: Cut over as soon as data is in sync. false waits in awaiting_switch for /switch.

    # ---------- apps from GitHub and their deployments ----------

    AppCreateRequest:
      type: object
      additionalProperties: false
      required: [repo, environments]
      properties:
        repo:
          type: string
          pattern: '^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$'
          example: 2026-Softbank-Hackathon-Charlie/moimroom
          description: owner/name of a repository the GitHub App installation can see.
        branch: { type: string, default: main, description: the branch platform.yaml is read from and pushes deploy from }
        environments:
          description: Where to deploy, by name from PLATFORM_ENVS_FILE.
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
          example: [eks]
        autoDeploy: { type: boolean, default: true, description: deploy every push to branch }

    AppCreated:
      description: The registered app and its first deployment (trigger register), queued.
      type: object
      required: [app, deployment]
      properties:
        app: { $ref: "#/components/schemas/App" }
        deployment: { $ref: "#/components/schemas/Deployment" }

    AppDeploy:
      description: |
        How the platform deploys a registered app from GitHub. The app
        deploys its own `branch` as the default instance, named after the
        app, and every branch added with `POST /v1/apps/{name}/instances` as
        another instance; `instances` lists them all. The other fields
        except `repo`, `environments`, `createdAt` and `createdBy` describe
        the default instance. `spec` is the newest platform.yaml on `branch`
        that passed the check, read at `specCommit`: at registration, and
        again by every deployment. `lastDeployment` is the default
        instance's newest deployment, finished or not.
      type: object
      required: [repo, branch, environments, autoDeploy, spec, specCommit, createdAt, createdBy, status, instances]
      properties:
        repo: { type: string, example: 2026-Softbank-Hackathon-Charlie/moimroom }
        branch: { type: string, example: main }
        environments:
          description: The environments the app is deployed to. Those it was registered with come first, in PLATFORM_ENVS_FILE order, then the ones added with POST /v1/apps/{name}/environments, in the order they were added; the first is never removed.
          type: array
          items: { type: string }
          example: [gke, eks]
        autoDeploy: { type: boolean, description: every push to branch deploys }
        spec: { $ref: "#/components/schemas/AppSpec" }
        specCommit: { type: string, example: 9fceb02d0ae598e95dc970b74767f19372d61af8 }
        url:
          type: string
          example: https://moimroom.hopcharlie.dev
          description: Where the public service answers, through the traffic gateway. Absent when no service is public.
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, description: the token name that registered the app }
        lastDeployment: { $ref: "#/components/schemas/Deployment" }
        status:
          description: One entry per environment in `environments`, in that order.
          type: array
          items: { $ref: "#/components/schemas/AppEnvironmentStatus" }
        instances:
          description: Every instance of the app, the default one first, then the others by branch name.
          type: array
          items: { $ref: "#/components/schemas/AppInstance" }
        dbTopology: { $ref: "#/components/schemas/AppDBTopology" }

    AppDBTopology:
      description: |
        The database pair of the app's default instance (ADR 0030, ADR 0043),
        present only while the server sets PLATFORM_APP_DB_TOPOLOGY for an app
        with a postgres resource registered in exactly two environments, or in
        one environment while exactly one other environment has a database
        host template. Its postgres database is born primary in `primary` and
        a streaming replica of it in `replica`, so a migration can move it
        between the two. These are the roles the databases were created with;
        a migration swaps them in the clusters and does not change these
        fields. `replicaPresent` is false while `replica` is not one of the
        app's environments (`POST /v1/apps/{name}/environments` adds it).
        Branch instances keep their own database in each environment.
      type: object
      required: [primary, replica, replicaPresent]
      properties:
        primary: { type: string, example: gke, description: the environment where the database is born primary (the app's first environment) }
        replica: { type: string, example: eks, description: the environment where the database is born a replica of primary }
        replicaPresent: { type: boolean, description: "`replica` is one of the app's environments" }
        readiness: { $ref: "#/components/schemas/AppDBReadiness" }

    AppDBReadiness:
      description: |
        Whether `POST /v1/migrations` can move the app between the two
        environments of its pair now (ADR 0043). Only `GET /v1/apps/{name}`
        has it; it reads the traffic gateway and both environments' CNPG
        Clusters in parallel, each within 3 seconds, and reuses what it read
        for the app for 10 seconds (the deployments and migration runs are
        read every time, and a run that ended since is a reason to read
        again). `ready` is true only when both environments are the
        app's, no migration of the app is in progress, the default instance's
        newest deployment that got to each of them is healthy there, the
        traffic gateway has a backend for both (when the app has a public
        service), both Clusters are healthy, their `spec.replica` fit the
        migration engine's topology check (one is primary, the other follows
        it) and the gateway writes to the environment whose Cluster is the
        primary. WAL lag is not looked at; the migration's prepare and
        presync check it again.

        `reason` is the first check that failed, or `ready`:
        replica_missing (an environment of the pair is not the app's),
        migration_in_progress (a migration run of the app is active, by the
        rule `POST /v1/migrations` uses: not ended and running or awaiting its
        switch; or the gateway holds its writes), deploy_pending (a deployment to an environment is not
        finished, or none got there healthy and none is going: the message
        says to send `POST /v1/apps/{name}/environments` again),
        app_degraded (that deployment left the environment Degraded: the app
        probably writes to the database when it starts, which a replica
        refuses; migrate it with the engine's cold mode), deploy_failed (that
        deployment failed there otherwise), gateway_unreachable,
        gateway_backend_missing, cluster_unreadable, cluster_not_healthy,
        topology_mismatch, write_backend_mismatch (the gateway's write
        backend is not the environment whose Cluster is primary). A
        deployment that stopped before it got to an environment, such as a
        failed build, is passed over. `message` says the same in a sentence.
      type: object
      required: [ready, reason, message, environments]
      properties:
        ready: { type: boolean }
        reason: { type: string, example: ready }
        message: { type: string, example: both databases are healthy and the replica follows the primary }
        environments:
          description: The pair's two environments, primary first.
          type: array
          items: { $ref: "#/components/schemas/AppDBReadinessEnvironment" }

    AppDBReadinessEnvironment:
      type: object
      required: [env, inApp, deployed, gatewayBackend, role, healthy]
      properties:
        env: { type: string, example: gke }
        inApp: { type: boolean, description: the environment is one of the app's }
        deployed: { type: boolean, description: "the default instance's newest deployment that got to the environment is healthy there" }
        gatewayBackend: { type: boolean, description: "the traffic gateway has a backend for it (true when the app has no public service)" }
        role:
          type: string
          enum: [primary, replica, unknown]
          description: "from the Cluster's spec.replica: primary when replica.primary is the Cluster itself or absent; unknown when it could not be read"
        healthy: { type: boolean, description: the Cluster is in healthy state with every instance ready }
        phase: { type: string, example: Cluster in healthy state, description: "the Cluster's status.phase, when it was read" }

    AppEnvironmentAddRequest:
      type: object
      additionalProperties: false
      required: [environment]
      properties:
        environment:
          type: string
          minLength: 1
          example: gke
          description: An environment of this server (GET /v1/envs) that the app is not in yet.

    AppEnvironmentAdded:
      description: The app with the new environment, and the deployment that takes it there (trigger environment), queued.
      type: object
      required: [app, deployment]
      properties:
        app: { $ref: "#/components/schemas/App" }
        deployment: { $ref: "#/components/schemas/Deployment" }

    AppEnvironmentRemoved:
      description: The app without the environment, and the deployment to its remaining environments (trigger environment) when one was queued.
      type: object
      required: [app]
      properties:
        app: { $ref: "#/components/schemas/App" }
        deployment: { $ref: "#/components/schemas/Deployment" }

    AppInstance:
      description: |
        One deployed branch of a registered app (ADR 0015). The default
        instance deploys the app's `branch` and is named after the app; the
        other instances deploy a branch the operator added and are named
        `<app>--<slug>`. The name is the namespace, the gitops directory
        `apps/<instance>/`, the Argo CD Applications `<instance>-<env>` and
        the host `<instance>.<app domain>`. `spec` is the newest
        platform.yaml on the branch that passed the check, read at
        `specCommit`.
      type: object
      required: [name, branch, default, autoDeploy, spec, specCommit, createdAt, createdBy, status]
      properties:
        name: { type: string, example: moimroom--dev }
        branch: { type: string, example: dev }
        default: { type: boolean, description: "the app's own branch; the instance is deleted only with the app" }
        autoDeploy: { type: boolean, description: every push to branch deploys the instance }
        spec: { $ref: "#/components/schemas/AppSpec" }
        specCommit: { type: string, example: 9fceb02d0ae598e95dc970b74767f19372d61af8 }
        url:
          type: string
          example: https://moimroom--dev.hopcharlie.dev
          description: "`https://<instance>.<domain>`, where the public service answers through the traffic gateway. Absent when no service is public."
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, description: the token name that registered the app (default instance) or added the branch }
        lastDeployment: { $ref: "#/components/schemas/Deployment" }
        status:
          description: One entry per environment of the app, in the app's order.
          type: array
          items: { $ref: "#/components/schemas/AppEnvironmentStatus" }

    AppInstanceCreateRequest:
      type: object
      additionalProperties: false
      required: [branch]
      properties:
        branch:
          type: string
          minLength: 1
          maxLength: 200
          example: dev
          description: A branch of the app's repository; not the app's own branch.
        autoDeploy: { type: boolean, default: true, description: deploy every push to branch }

    AppInstanceCreated:
      description: The added instance and its first deployment (trigger register), queued.
      type: object
      required: [instance, deployment]
      properties:
        instance: { $ref: "#/components/schemas/AppInstance" }
        deployment: { $ref: "#/components/schemas/Deployment" }

    AppEnvironmentStatus:
      description: |
        An instance's live state in one environment, from the Argo CD
        Application `<instance>-<env>`. `pending` until a deployment reaches
        the environment.
      type: object
      required: [env, status]
      properties:
        env: { type: string, example: eks }
        status: { $ref: "#/components/schemas/DeploymentEnvironmentStatus" }
        syncStatus: { type: string, example: Synced, description: "Argo CD sync status: Synced, OutOfSync or Unknown" }
        healthStatus: { type: string, example: Healthy, description: "Argo CD health status: Healthy, Progressing, Degraded, Suspended, Missing or Unknown" }
        commit: { type: string, description: the app commit running there }
        url: { type: string, description: "where the public service answers in this environment, when known" }
        updatedAt: { type: string, format: date-time }

    AppSpec:
      description: |
        `platform.yaml` at the root of an app's repository, with defaults
        applied. pkg/appspec parses it strictly (unknown keys are an error)
        and checks these rules:

        - `name` matches `^[a-z0-9][a-z0-9-]{1,30}[a-z0-9]$` (3 to 32
          characters) and has no `--`, which separates the app from the
          branch in instance names (`<name>--<branch slug>`). It names the
          default instance (the namespace, the Argo CD Applications
          `<name>-<env>` and the public URL `https://<name>.hopcharlie.dev`)
          and the images `<registry>/hopcharlie/apps/<name>/<service>`,
          which every instance shares.
        - 1 to 5 services and at most one resource per type. Service names,
          and resource names, match `^[a-z]([a-z0-9-]{0,22}[a-z0-9])?$` and
          are unique.
        - `port`, when set, is 1 to 65535. A service without one (or with
          0) is a worker: no Service, no probes, ready once it runs, and it may be
          neither `public` nor have a `healthCheck`. An app may have only
          workers; it then has no URL.
        - `replicas` is 1 to 5, at most one service is `public`, and
          `healthCheck`, when set, starts with `/`.
        - `memory`, when set, is a whole number of bytes from 256Mi to
          1536Mi and `cpu` a whole number of millicores from 50m to 500m
          (ADR 0024). Over all services, (replicas + 1) x memory adds up to
          at most 3Gi and (replicas + 1) x cpu to at most 1500m, an unset
          memory counting as 256Mi and an unset cpu as 50m, so that a
          rolling update, with one pod more per service, fits the
          namespace's quota next to the database. The nodes may have less
          room than the quota: an app that uses most of its CPU budget can
          stay Pending until a node has that much CPU free.
        - `path` and `dockerfile` are relative and have no `..`.
        - `env` keys match `^[A-Z_][A-Z0-9_]*$` and are none of the
          variables the platform sets: `PORT`, `DATABASE_URL`, `PGHOST`,
          `PGPORT`, `PGDATABASE`, `PGUSER`, `PGPASSWORD`,
          `JDBC_DATABASE_URL` and `S3_*`.

        The rules are not repeated as schema keywords, because
        AppSpecValidation returns the spec of a file that breaks them.
      type: object
      required: [name, services]
      properties:
        name: { type: string, example: moimroom }
        services:
          type: array
          items: { $ref: "#/components/schemas/AppSpecService" }
        resources:
          type: array
          items: { $ref: "#/components/schemas/AppSpecResource" }
      example:
        name: moimroom
        services:
          - { name: web, path: ".", dockerfile: Dockerfile, port: 8080, healthCheck: /healthz, public: true, replicas: 1, env: { LOG_LEVEL: info } }
          - { name: jobs, path: jobs, dockerfile: Dockerfile, public: false, replicas: 1, memory: 512Mi, cpu: 250m, env: { SPRING_DATASOURCE_URL: "$(JDBC_DATABASE_URL)" } }
        resources:
          - { name: db, type: postgres }
          - { name: photos, type: s3 }

    AppSpecService:
      type: object
      required: [name, path, dockerfile, public, replicas]
      properties:
        name: { type: string, example: web }
        path: { type: string, default: ".", description: "the docker build context, relative to the repository root" }
        dockerfile: { type: string, default: Dockerfile, description: relative to path }
        port:
          type: integer
          example: 8080
          x-go-type-skip-optional-pointer: true
          description: the port the service listens on; the service gets it as PORT. Left out for a worker, which gets no Service, no probes and no PORT.
        healthCheck: { type: string, example: /healthz, description: an HTTP path that answers 2xx once the service is ready }
        public: { type: boolean, default: false, description: "served at https://<app>.hopcharlie.dev through the traffic gateway" }
        replicas: { type: integer, default: 1 }
        memory:
          type: string
          example: 512Mi
          x-go-type-skip-optional-pointer: true
          description: |
            A Kubernetes quantity, a whole number of bytes from 256Mi to
            1536Mi: the container's memory request and limit. Without it the container gets the
            environment's defaults (request 64Mi, limit 256Mi).
        cpu:
          type: string
          example: 250m
          x-go-type-skip-optional-pointer: true
          description: |
            A Kubernetes quantity, a whole number of millicores from 50m
            to 500m: the container's CPU request.
            There is no CPU limit. Without it the request is the
            environment's default (50m).
        env:
          description: |
            Environment variables besides the ones the platform sets. Values
            are strings: a value YAML reads as a number, boolean or null
            (`4`, `yes`, `0755`, `~`) is an error, so quote it. platform.yaml
            is in git, so it holds no secrets. A value may use `$(NAME)` for
            a variable the platform sets, which Kubernetes expands, to give
            it the name the app reads: `KC_DB_URL_HOST: "$(PGHOST)"`,
            `SPRING_DATASOURCE_URL: "$(JDBC_DATABASE_URL)"`,
            `AWS_ACCESS_KEY_ID: "$(S3_ACCESS_KEY)"`.
          type: object
          additionalProperties: { type: string }

    AppSpecResource:
      type: object
      required: [name, type]
      properties:
        name: { type: string, example: db }
        type:
          type: string
          example: postgres
          description: |
            postgres: a CNPG Cluster `<app>-<name>`; every service gets
            DATABASE_URL from key `uri` of its secret `<app>-<name>-app`,
            and from the same secret PGHOST (key `host`), PGPORT (`port`),
            PGDATABASE (`dbname`), PGUSER (`username`), PGPASSWORD
            (`password`) and JDBC_DATABASE_URL (`jdbc-uri`).
            s3: a bucket; every service gets S3_ENDPOINT, S3_BUCKET,
            S3_REGION, S3_PATH_STYLE, S3_ACCESS_KEY and S3_SECRET_KEY.

    AppSpecFieldError:
      type: object
      required: [path, message]
      properties:
        path:
          type: string
          example: "services[0].port"
          description: Where in platform.yaml. Empty for the file as a whole (not found, not YAML, an unknown key).
        message: { type: string, example: must be between 1 and 65535 }

    AppSpecValidation:
      description: |
        The result of checking a platform.yaml. `spec` is set when the file
        decodes, with defaults applied, even when it breaks a rule. `commit`
        is the commit the file was read at, for a check of a repository once
        the branch was found.
      type: object
      required: [valid, errors]
      properties:
        valid: { type: boolean }
        spec: { $ref: "#/components/schemas/AppSpec" }
        commit: { type: string, example: 9fceb02d0ae598e95dc970b74767f19372d61af8 }
        errors:
          description: Empty when valid.
          type: array
          items: { $ref: "#/components/schemas/AppSpecFieldError" }

    AppSpecValidateRequest:
      description: Either `repo` (with `branch`) or `spec`.
      type: object
      additionalProperties: false
      properties:
        repo: { type: string, example: 2026-Softbank-Hackathon-Charlie/moimroom, description: owner/name; platform.yaml is read at the head of branch through the GitHub App }
        branch: { type: string, default: main }
        spec:
          type: string
          description: platform.yaml content to check instead, at most 64 KiB.
          example: "name: moimroom\nservices:\n  - name: web\n    port: 8080\n    public: true\n"

    AppSpecInvalid:
      description: The body of a 422 invalid_app_spec. `error` is the usual Error body; `validation` lists what failed.
      type: object
      required: [error, validation]
      properties:
        error: { $ref: "#/components/schemas/ErrorBody" }
        validation: { $ref: "#/components/schemas/AppSpecValidation" }

    DeploymentTrigger:
      type: string
      description: |
        register: the first deployment of an app (POST /v1/apps) or of an added instance (POST /v1/apps/{name}/instances).
        push: a push to a branch the app deploys (the GitHub webhook).
        manual: POST /v1/apps/{name}/deployments.
        redeploy: POST /v1/apps/{name}/deployments with `redeploy`: the last healthy deployment's commit and images again, without a build, to apply changed secrets.
        environment: POST /v1/apps/{name}/environments or DELETE /v1/apps/{name}/environments/{env}: the default instance's last healthy deployment's commit and images again, without a build, to all of the app's environments after one was added or removed.
      enum: [push, manual, register, redeploy, environment]

    DeploymentStatus:
      type: string
      description: |
        queued: waiting for the deployer. A server without a deployer leaves deployments queued.
        building: building and pushing one image per service.
        committing: writing apps/<instance>/<env>.yaml to the gitops repository.
        syncing: Argo CD is applying the commit; waiting for every environment to be healthy and, for an app
          with a public service, for it to answer in the environments the traffic gateway sends requests to.
        healthy: every environment is synced and healthy, and the public service (if any) answered where the
          traffic gateway sends requests. An environment that gets no requests and did not answer is left out
          of the gateway, with a `message`. Final.
        failed: the deployment stopped; `error` says why. Final.
        superseded: a newer deployment of the same instance to the same environments (or more) was created
          before this one finished. This one stopped, and writes nothing to the gitops repository
          after that. Final.
      enum: [queued, building, committing, syncing, healthy, failed, superseded]

    DeploymentEnvironmentStatus:
      type: string
      description: |
        pending: nothing deployed to the environment yet.
        syncing: apps/<instance>/<env>.yaml is committed and Argo CD is applying it.
        healthy: Argo CD reports Synced and Healthy for the commit.
        degraded: synced, but Argo CD reports the Application <instance>-<env> Degraded.
        failed: the sync failed, or the environment did not become healthy in time, or (Synced and Healthy)
          the public service did not answer there in time though the traffic gateway sends it requests.
      enum: [pending, syncing, healthy, degraded, failed]

    Deployment:
      description: One deployment of an app's commit into one of its instances, in one or more environments.
      type: object
      required: [id, app, branch, instance, ref, commit, trigger, triggeredBy, status, images, environments, createdAt]
      properties:
        id: { type: string, example: dep_3f9c1a0b2d4e }
        app: { type: string, example: moimroom }
        branch: { type: string, example: main, description: "the branch whose instance this deploys: the app's branch or an added one" }
        instance: { type: string, example: moimroom, description: the instance it deploys (AppInstance name) }
        ref: { type: string, example: main, description: "what was asked for: a branch, tag or commit sha" }
        commit: { type: string, example: 9fceb02d0ae598e95dc970b74767f19372d61af8, description: the full commit sha ref resolved to }
        trigger: { $ref: "#/components/schemas/DeploymentTrigger" }
        triggeredBy: { type: string, example: seohyun, description: "the token name (register, manual), or github:<login> of the pusher (push)" }
        status: { $ref: "#/components/schemas/DeploymentStatus" }
        images:
          description: |
            One per service whose image is built, pinned by digest:
            `<registry>/hopcharlie/apps/<app>/<service>@sha256:<digest>`. The
            image is also tagged with the commit.
          type: array
          items: { $ref: "#/components/schemas/DeploymentImage" }
        environments:
          description: One per target environment, in the app's order.
          type: array
          items: { $ref: "#/components/schemas/DeploymentEnvironment" }
        error: { type: string, description: why the deployment failed }
        buildId: { type: string, description: "the AWS CodeBuild build id, or the local docker build's id (E2E)" }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, description: when the deployer took it from the queue }
        finishedAt: { type: string, format: date-time, description: when it reached a final status }

    DeploymentImage:
      type: object
      required: [service, image]
      properties:
        service: { type: string, example: web }
        image: { type: string, example: "123456789012.dkr.ecr.ap-northeast-2.amazonaws.com/hopcharlie/apps/moimroom/web@sha256:4c2e1a..." }

    DeploymentEnvironment:
      type: object
      required: [env, status]
      properties:
        env: { type: string, example: eks }
        status: { $ref: "#/components/schemas/DeploymentEnvironmentStatus" }
        syncStatus: { type: string, example: Synced, description: Argo CD sync status of the Application <instance>-<env> }
        healthStatus: { type: string, example: Healthy, description: Argo CD health status of the Application <instance>-<env> }
        url: { type: string, description: "where the public service answers in this environment, when known" }
        message: { type: string, description: "the latest detail, such as Argo CD's sync message or why the environment failed" }

    DeploymentList:
      type: object
      required: [deployments]
      properties:
        deployments:
          type: array
          items: { $ref: "#/components/schemas/Deployment" }

    DeploymentCreateRequest:
      type: object
      additionalProperties: false
      properties:
        branch:
          type: string
          minLength: 1
          example: dev
          description: "A branch the app deploys: its own branch or one added with POST /v1/apps/{name}/instances. It picks the instance; defaults to the app's branch."
        ref: { type: string, example: main, description: "a branch, tag or commit sha of the app's repository to deploy into that instance; defaults to branch" }
        environments:
          description: A subset of the app's environments; defaults to all of them.
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        redeploy:
          type: boolean
          description: "Deploy the instance's last healthy deployment again (same commit and images, no build) with the current secrets, only to environments it went to. Not with ref."

    AppSecretInfo:
      description: A secret without its value.
      type: object
      required: [name, updatedAt, updatedBy]
      properties:
        name: { type: string, example: HOST_CODE }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string, description: The principal who last set it. }

    InstanceSecrets:
      type: object
      required: [instance, secrets]
      properties:
        instance: { type: string, example: moimroom--dev }
        secrets:
          description: This instance's overrides, by name.
          type: array
          items: { $ref: "#/components/schemas/AppSecretInfo" }

    AppSecrets:
      type: object
      required: [app, instances]
      properties:
        app:
          description: App-wide secrets, by name. Every instance gets them unless it overrides one.
          type: array
          items: { $ref: "#/components/schemas/AppSecretInfo" }
        instances:
          description: The instances that override at least one secret, by instance name.
          type: array
          items: { $ref: "#/components/schemas/InstanceSecrets" }

    AppSecretsUpdate:
      type: object
      additionalProperties: false
      properties:
        instance:
          type: string
          description: Change this instance's overrides (the app's name for the default instance); without it, or empty, the app-wide secrets change.
          example: moimroom--dev
        set:
          description: Secrets to create or replace, name to value. Each value is 1 to 4096 bytes of UTF-8 (maxLength counts characters; the server counts bytes).
          type: object
          maxProperties: 50
          additionalProperties: { type: string, minLength: 1, maxLength: 4096 }
          example: { HOST_CODE: "4821" }
        delete:
          description: Names to remove. A name not present is ignored.
          type: array
          maxItems: 50
          uniqueItems: true
          items: { type: string }

    AppSecretValue:
      type: object
      required: [name, value, updatedAt, updatedBy]
      properties:
        name: { type: string }
        instance: { type: string, description: "The instance whose override this is; absent for an app-wide secret." }
        value: { type: string }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }

    DeploymentEventType:
      type: string
      enum: [phase, log, environment, done]

    DeploymentEvent:
      description: |
        One step of a deployment.
        - phase: the deployment entered `phase`; `message` may say more.
        - log: one line of build or deploy output in `message`, from `phase`.
        - environment: `env` changed state; `message` says how (for example "Synced, Healthy").
        - done: the deployment ended with `phase` (healthy, failed or superseded); `message` is the error when it failed. It is the deployment's last event.
      type: object
      required: [seq, deploymentId, time, type]
      properties:
        seq: { type: integer, format: int64 }
        deploymentId: { type: string }
        time: { type: string, format: date-time }
        type: { $ref: "#/components/schemas/DeploymentEventType" }
        phase: { $ref: "#/components/schemas/DeploymentStatus" }
        env: { type: string }
        message: { type: string }

    GitHubRepo:
      type: object
      required: [fullName, private, defaultBranch, htmlUrl]
      properties:
        fullName: { type: string, example: 2026-Softbank-Hackathon-Charlie/moimroom }
        private: { type: boolean }
        defaultBranch: { type: string, example: main }
        htmlUrl: { type: string, example: https://github.com/2026-Softbank-Hackathon-Charlie/moimroom }

    GitHubRepoList:
      type: object
      required: [repos]
      properties:
        repos:
          type: array
          items: { $ref: "#/components/schemas/GitHubRepo" }

    PushTokenRequest:
      type: object
      additionalProperties: false
      required: [repo]
      properties:
        repo:
          type: string
          pattern: '^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$'
          example: 2026-Softbank-Hackathon-Charlie/gitea
          description: owner/name of a repository scripts/import-repo.sh imported, without .git.

    PushToken:
      description: A GitHub App installation token that may only write the contents of `repo`.
      type: object
      required: [repo, token, expiresAt]
      properties:
        repo:
          type: string
          example: 2026-Softbank-Hackathon-Charlie/gitea
          description: The repository's current owner/name, which differs from the request after a rename.
        token:
          type: string
          description: The token, for git over HTTPS as the password of user `x-access-token`. Keep it out of logs.
        expiresAt:
          type: string
          format: date-time
          description: When GitHub stops accepting the token, an hour after it was created.

    OnboardingRequest:
      type: object
      additionalProperties: false
      required: [repo, serviceUrl]
      properties:
        repo:
          type: string
          pattern: '^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$'
          example: 2026-Softbank-Hackathon-Charlie/moimroom-legacy
          description: owner/name of the app's repository, without .git.
        serviceUrl:
          type: string
          example: https://moimroom-legacy.hopcharlie.dev
          description: Where the app answers now, https://<label>.<app domain>. The label is the app's name.
        targetEnv:
          type: string
          example: eks
          description: The environment to move it to. Default the VM's cloud's (eks for AWS, gke for GCP).

    OnboardingApproveRequest:
      type: object
      additionalProperties: false
      required: [headSha]
      properties:
        headSha: { type: string, description: "The PR head commit the operator reviewed (`pr.headSha`)." }

    OnboardingState:
      description: |
        Where an onboarding is (ADR 0042, "흐름과 상태"). `failed` keeps the
        state it failed in in `failedState`.
      type: string
      enum: [discovering, patching, checking, awaiting_approval, connecting, registering, syncing, ready, cutting_over, decommissioning, done, failed]

    OnboardingList:
      type: object
      required: [onboardings]
      properties:
        onboardings:
          type: array
          items: { $ref: "#/components/schemas/Onboarding" }

    Onboarding:
      type: object
      required: [id, repo, serviceUrl, app, targetEnv, state, deleting, legacyDeployStopped, humanActions, report, legacyChanges, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, example: onb_3f9a1c2b7d4e }
        repo: { type: string, example: 2026-Softbank-Hackathon-Charlie/moimroom-legacy }
        serviceUrl: { type: string, example: https://moimroom-legacy.hopcharlie.dev }
        app: { type: string, example: moimroom-legacy, description: "The app's name: serviceUrl's label." }
        targetEnv: { type: string, example: eks, description: "The environment it moves to; empty until discovery chose it." }
        state: { $ref: "#/components/schemas/OnboardingState" }
        failedState:
          allOf: [{ $ref: "#/components/schemas/OnboardingState" }]
          description: With state failed, the state it failed in, which resume goes back to.
        failure: { type: string, description: "Why it failed, or why a step of a deletion failed." }
        deleting: { type: boolean, description: "DELETE was asked for and is undoing what was done." }
        legacyDeployStopped:
          type: boolean
          description: |
            The source's deploy workflows are disabled (from connecting on,
            until it is deleted). The console says so on every screen while
            it is true.
        humanActions:
          type: array
          description: What a person has to do, which the platform cannot (ADR 0042, "한 번 하는 설정"). The platform checks it itself; resume checks again at once.
          items: { $ref: "#/components/schemas/OnboardingHumanAction" }
        facts: { $ref: "#/components/schemas/OnboardingFactsSummary" }
        report: { $ref: "#/components/schemas/OnboardingReport" }
        pr: { $ref: "#/components/schemas/OnboardingPR" }
        check: { $ref: "#/components/schemas/OnboardingCheck" }
        legacyChanges:
          type: array
          description: What was added to or changed on the source VM, its database, GitHub and the management cluster, in the order it was done. DELETE undoes them in reverse.
          items: { $ref: "#/components/schemas/OnboardingLegacyChange" }
        runId: { type: string, description: "The cutover's migration run, from cutting_over on." }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        approvedBy: { type: string }
        approvedAt: { type: string, format: date-time }
        approvedSha: { type: string, description: "The PR head commit that was approved." }

    OnboardingHumanAction:
      type: object
      required: [kind, done]
      properties:
        kind: { type: string, enum: [install_github_app, delete_dns_record] }
        url: { type: string, description: "install_github_app: the App's installation page", example: https://github.com/apps/hopcharlie-platform/installations/new }
        record: { $ref: "#/components/schemas/OnboardingDNSRecord" }
        done: { type: boolean, description: "The platform saw it done (the App can read the repository; the name resolves to the gateway)." }

    OnboardingDNSRecord:
      description: "delete_dns_record: the individual record to delete, so the wildcard sends the name to the gateway."
      type: object
      required: [name, type, value]
      properties:
        name: { type: string, example: moimroom-legacy.hopcharlie.dev }
        type: { type: string, example: A }
        value: { type: string, example: 203.0.113.10 }

    OnboardingFactsSummary:
      description: The parts of the discovery's facts the console shows. The full facts are pkg/onboard/facts.Facts and go only to hopai.
      type: object
      properties:
        cloud: { type: string, enum: [aws, gcp] }
        region: { type: string, example: ap-northeast-2 }
        instanceId: { type: string, example: i-0abc1234def567890 }
        publicIp: { type: string, example: 203.0.113.10 }
        ssmManaged: { type: boolean }
        defaultBranch: { type: string, example: main }
        head: { type: string, description: "The default branch's head commit." }
        deployWorkflows: { type: array, items: { type: string }, description: "The workflows that deploy to the VM, which connecting disables." }
        composeProject: { type: string, example: moimroom }
        containers: { type: array, items: { type: string }, description: "compose services: container names" }
        dbImage: { type: string, example: postgres:17.11-alpine }
        dbServerVersionNum: { type: integer, example: 170011 }
        dbLibc: { type: string, enum: [glibc, musl] }
        dbDatabase: { type: string, example: moimroom }
        dbOwner: { type: string, example: moimroom }
        dbSizeBytes: { type: integer, format: int64 }
        image: { type: string, description: "The CNPG image chosen, pinned by digest." }
        storageSize: { type: string, example: 2Gi }
        reindex: { type: array, items: { type: string }, description: "\"schema.index\" names rebuilt after the promotion" }
        bucket: { type: string, description: "The source bucket of the app's files." }
        objectCount: { type: integer, format: int64 }

    OnboardingReport:
      type: object
      required: [blockers, warnings]
      properties:
        blockers:
          type: array
          description: Why it cannot go on (pkg/onboard/facts Block* codes). Any blocker stops it in failed.
          items: { $ref: "#/components/schemas/OnboardingFinding" }
        warnings:
          type: array
          description: What the operator should know before approving (pkg/onboard/facts Warn* codes).
          items: { $ref: "#/components/schemas/OnboardingFinding" }
        drift: { $ref: "#/components/schemas/OnboardingDrift" }
        holdSeconds: { type: number, description: "The estimated write hold of the cutover." }
        holdBudgetSeconds: { type: number, example: 40, description: "The gateway's MaxHold less 15 seconds." }

    OnboardingFinding:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: auto_conf_settings }
        message: { type: string }
        subject: { type: string, description: "What it is about, such as a container, setting or index." }

    OnboardingDrift:
      description: What runs differs from the default branch's head. Shown first; it does not block.
      type: object
      required: [head]
      properties:
        head: { type: string }
        runningRevision: { type: string, description: "The org.opencontainers.image.revision label of the running image." }
        lastDeployCommit: { type: string, description: "The commit of the newest successful deploy workflow run." }

    OnboardingPR:
      type: object
      required: [number, url, headSha]
      properties:
        number: { type: integer, example: 12 }
        url: { type: string, example: https://github.com/2026-Softbank-Hackathon-Charlie/moimroom-legacy/pull/12 }
        headSha: { type: string }
        merged: { type: boolean }

    OnboardingCheck:
      description: The test deployment of the PR branch.
      type: object
      required: [app, result, attempts]
      properties:
        app: { type: string, example: moimroom-legacy-onb-1c2b7d, description: "The temporary app, deleted when the test ends." }
        deploymentId: { type: string }
        result: { type: string, enum: [running, passed, failed] }
        attempts: { type: integer, description: "Test deployments so far, at most 2." }
        startSeconds: { type: number, description: "From the Deployment's creation until it was Ready." }
        message: { type: string }

    OnboardingLegacyChange:
      description: |
        One thing added to the source or done for it, in order:
        workflow_disabled (`target` the workflow path), instance_tagged
        (the instance id), postgres_role_created, replication_role_created
        (`hopcharlie_replicator`), tailscale_volume_created,
        tailscale_container_started, tailscale_device_joined (the tailnet
        hostname), hba_line_added (the line), wal_keep_size_added (the
        line), db_route_created (the management cluster's Service).
      type: object
      required: [kind, target, at]
      properties:
        kind:
          type: string
          enum: [workflow_disabled, instance_tagged, postgres_role_created, replication_role_created, tailscale_volume_created, tailscale_container_started, tailscale_device_joined, hba_line_added, wal_keep_size_added, db_route_created]
        target: { type: string }
        at: { type: string, format: date-time }
        undoneAt: { type: string, format: date-time, description: "When DELETE undid it." }

    OnboardingEvent:
      description: |
        One step of an onboarding.
        - state: it entered `state`; `message` may say more.
        - step: something it did or found in `state`.
        - log: one line of output (hopai, the test deployment, an SSM command) in `message`.
        - human: it waits for a person (`humanActions`).
        - error: a step failed; `message` is why.
      type: object
      required: [seq, onboardingId, time, state, kind]
      properties:
        seq: { type: integer, format: int64 }
        onboardingId: { type: string }
        time: { type: string, format: date-time }
        state: { $ref: "#/components/schemas/OnboardingState" }
        kind: { type: string, enum: [state, step, log, human, error] }
        message: { type: string }
        data: { type: object, additionalProperties: true }
