name: Publish platform image

# Builds the platform image (API and gateway) of a main commit once the full
# ci workflow passes on that commit, pushes it to ECR as :<7-char sha>, and
# opens an infra PR that pins the digest (infra ADR 0024). It never deploys:
# the PR is reviewed and merged by hand, then the platform is upgraded.
#
# Settings > Secrets and variables > Actions:
#   variable AWS_DEPLOY_ROLE_ARN      infra output image_publish_role_arns.platform
#   variable ECR_PLATFORM_REPOSITORY  infra output ecr_repository_url
#   variable AWS_REGION               optional, ap-northeast-2
#   secret   MODULE_READ_TOKEN        the one ci already uses (migration-engine)
#   secret   INFRA_PR_TOKEN           fine-grained token: infra only, Contents
#                                     and Pull requests read and write

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: platform-image-publish
  cancel-in-progress: false

jobs:
  ci:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      ECR_PLATFORM_REPOSITORY: ${{ vars.ECR_PLATFORM_REPOSITORY }}
      GOPRIVATE: github.com/2026-Softbank-Hackathon-Charlie
      GOTOOLCHAIN: auto
      AWS_PAGER: ''
    steps:
      - name: Check settings
        id: config
        env:
          HAS_INFRA_PR_TOKEN: ${{ secrets.INFRA_PR_TOKEN != '' }}
          HAS_MODULE_READ_TOKEN: ${{ secrets.MODULE_READ_TOKEN != '' }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ -n "$AWS_DEPLOY_ROLE_ARN" ] || fail "Repository variable AWS_DEPLOY_ROLE_ARN is not set"
          [ -n "$ECR_PLATFORM_REPOSITORY" ] || fail "Repository variable ECR_PLATFORM_REPOSITORY is not set"
          [ "$HAS_INFRA_PR_TOKEN" = true ] || fail "Repository secret INFRA_PR_TOKEN is not set"
          [ "$HAS_MODULE_READ_TOKEN" = true ] || fail "Repository secret MODULE_READ_TOKEN is not set"
          re='^([0-9]{12})\.dkr\.ecr\.([a-z0-9-]+)\.amazonaws\.com/hopcharlie/platform$'
          [[ "$ECR_PLATFORM_REPOSITORY" =~ $re ]] || fail "ECR_PLATFORM_REPOSITORY must be <account>.dkr.ecr.<region>.amazonaws.com/hopcharlie/platform"
          account="${BASH_REMATCH[1]}"
          [ "${BASH_REMATCH[2]}" = "$AWS_REGION" ] || fail "AWS_REGION must match the ECR region"
          [[ "$AWS_DEPLOY_ROLE_ARN" =~ ^arn:aws:iam::${account}:role/[A-Za-z0-9+=,.@_/-]+$ ]] || fail "AWS_DEPLOY_ROLE_ARN must be a role in the ECR account"
          { echo "account=$account"; echo "registry=${ECR_PLATFORM_REPOSITORY%%/*}"; } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Infra PR helper tests
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'

      # migration-engine is a private module (see ci.yml).
      - name: Private modules
        env:
          TOKEN: ${{ secrets.MODULE_READ_TOKEN }}
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/2026-Softbank-Hackathon-Charlie/".insteadOf "https://github.com/2026-Softbank-Hackathon-Charlie/"

      - name: Restore Go cache from main
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-race-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-race-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-race-${{ runner.os }}-

      - name: Go toolchain
        id: go
        run: |
          if command -v go >/dev/null; then go version; else echo "missing=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-go@v6
        if: steps.go.outputs.missing == 'true'
        with:
          go-version-file: go.mod
          cache: false

      # Same binaries as deploy/aws/push-image.sh.
      - name: Build binaries
        run: |
          mkdir -p deploy/docker/bin
          for cmd in api gateway; do
            GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "deploy/docker/bin/hopcharlie-$cmd" "./cmd/$cmd"
          done

      - name: AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ steps.config.outputs.account }}
          role-session-name: platform-publish-${{ github.run_id }}

      # One plain linux/amd64 manifest, no attestations, so the digest is the
      # image the cluster pulls.
      - name: Build and push the image
        id: image
        env:
          REGISTRY: ${{ steps.config.outputs.registry }}
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          tag="${GITHUB_SHA:0:7}"
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false --push \
            --metadata-file "$RUNNER_TEMP/image.json" -t "$ECR_PLATFORM_REPOSITORY:$tag" deploy/docker
          digest="$(jq -r '."containerimage.digest" // empty' "$RUNNER_TEMP/image.json")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::docker did not report the pushed digest"; exit 1; }
          echo "image=$ECR_PLATFORM_REPOSITORY:$tag@$digest" >> "$GITHUB_OUTPUT"

      - name: Open the infra PR
        env:
          GH_TOKEN: ${{ secrets.INFRA_PR_TOKEN }}
          INFRA_REPOSITORY: 2026-Softbank-Hackathon-Charlie/infra
          IMAGE: ${{ steps.image.outputs.image }}
        run: python3 .github/scripts/open-infra-pr.py
