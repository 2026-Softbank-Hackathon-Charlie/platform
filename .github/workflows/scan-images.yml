name: Scan running images

# SEC-04 (ADR 0029): every hour, scans the image digests the clusters run
# with the pinned Grype and posts each result to POST /v1/security/scans.
# The API only stores and shows them; it never scans. A digest is rescanned
# when its scan is a day old, and a failed one after an hour. A digest that
# cannot be pulled is posted as failed, never as zero vulnerabilities.
#
# Settings > Secrets and variables > Actions:
#   secret   SCANNER_TOKEN             the image-scanner entry (role agent) of PLATFORM_TOKENS
#   variable AWS_IMAGE_SCAN_ROLE_ARN   infra output image_scan_role_arn (ECR pull only)
#   variable GCP_IMAGE_SCAN_PROVIDER   infra app-images output image_scan_workload_identity_provider
#   variable GCP_IMAGE_SCAN_SERVICE_ACCOUNT  infra app-images output image_scan_service_account
#                                      (Artifact Registry read only, infra ADR 0065)
#   variable PLATFORM_API_URL          optional, https://api.hopcharlie.dev
#   variable AWS_REGION                optional, ap-northeast-2

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: image-scan
  cancel-in-progress: false

jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, hopcharlie]
    timeout-minutes: 50
    env:
      GRYPE_VERSION: 0.121.0
      # grype_0.121.0_checksums.txt of the GitHub release anchore/grype v0.121.0
      GRYPE_SHA256: 64e07133d3486115de647a66581461dccf5c732748a0a3119077395565f15519
      PLATFORM_API_URL: ${{ vars.PLATFORM_API_URL || 'https://api.hopcharlie.dev' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      AWS_IMAGE_SCAN_ROLE_ARN: ${{ vars.AWS_IMAGE_SCAN_ROLE_ARN }}
      GCP_IMAGE_SCAN_PROVIDER: ${{ vars.GCP_IMAGE_SCAN_PROVIDER }}
      GCP_IMAGE_SCAN_SERVICE_ACCOUNT: ${{ vars.GCP_IMAGE_SCAN_SERVICE_ACCOUNT }}
      AWS_PAGER: ''
    steps:
      # Until the token exists nothing is posted, and the API keeps showing
      # the running images as not scanned (never as zero vulnerabilities).
      - name: Check settings
        id: config
        env:
          HAS_SCANNER_TOKEN: ${{ secrets.SCANNER_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_SCANNER_TOKEN" != true ]; then
            echo "::notice::Repository secret SCANNER_TOKEN is not set: nothing scanned"
            echo "Image scan skipped: SCANNER_TOKEN is not set." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ -n "$AWS_IMAGE_SCAN_ROLE_ARN" ] || echo "::warning::AWS_IMAGE_SCAN_ROLE_ARN is not set: ECR images will be posted as failed scans"
          [ -n "$GCP_IMAGE_SCAN_PROVIDER" ] && [ -n "$GCP_IMAGE_SCAN_SERVICE_ACCOUNT" ] || echo "::warning::GCP_IMAGE_SCAN_PROVIDER or GCP_IMAGE_SCAN_SERVICE_ACCOUNT is not set: Artifact Registry images will be posted as failed scans"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.config.outputs.ready == 'true'
        with:
          persist-credentials: false

      - name: Scanner helper tests
        if: steps.config.outputs.ready == 'true'
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_scan_images.py'

      - name: Install Grype ${{ env.GRYPE_VERSION }} (checksum pinned)
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/grype"
          mkdir -p "$dir"
          tgz="$dir/grype.tar.gz"
          curl -fsSL -o "$tgz" "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "$GRYPE_SHA256  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$dir" grype
          "$dir/grype" version
          echo "GRYPE=$dir/grype" >> "$GITHUB_ENV"

      - name: AWS credentials (OIDC, ECR pull only)
        if: steps.config.outputs.ready == 'true' && env.AWS_IMAGE_SCAN_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_IMAGE_SCAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: platform-image-scan-${{ github.run_id }}

      - name: GCP credentials (OIDC, Artifact Registry read only)
        id: gcp
        if: steps.config.outputs.ready == 'true' && env.GCP_IMAGE_SCAN_PROVIDER != '' && env.GCP_IMAGE_SCAN_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GCP_IMAGE_SCAN_PROVIDER }}
          service_account: ${{ env.GCP_IMAGE_SCAN_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false

      - name: Scan and post
        if: steps.config.outputs.ready == 'true'
        env:
          SCANNER_TOKEN: ${{ secrets.SCANNER_TOKEN }}
          # Masked by the auth action; empty when the GCP variables are unset.
          GAR_TOKEN: ${{ steps.gcp.outputs.access_token }}
          # Logins live in this job's temp dir, not the runner user's ~/.docker.
          DOCKER_CONFIG: ${{ runner.temp }}/docker
          # The vulnerability database is kept between runs on the runner.
          GRYPE_DB_CACHE_DIR: ${{ runner.tool_cache }}/grype-db
        run: |
          set -euo pipefail
          if [ -n "$AWS_IMAGE_SCAN_ROLE_ARN" ]; then
            ECR_PASSWORD="$(aws ecr get-login-password --region "$AWS_REGION")"
            echo "::add-mask::$ECR_PASSWORD"
            export ECR_PASSWORD ECR_REGION="$AWS_REGION"
          fi
          "$GRYPE" db update
          python3 .github/scripts/scan-images.py
