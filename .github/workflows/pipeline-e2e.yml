name: Disposable migration pipeline E2E

on:
  workflow_dispatch:
    inputs:
      tested_sha:
        description: Exact 40-character platform main commit to test
        required: true
        type: string

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GOPRIVATE: github.com/2026-Softbank-Hackathon-Charlie
      GOTOOLCHAIN: auto
      GOMAXPROCS: '2'
      GOFLAGS: -p=2
      TESTED_SHA: ${{ inputs.tested_sha }}
    steps:
      - name: Check out trusted workflow tools
        uses: actions/checkout@v5
        with:
          path: harness
          persist-credentials: false
      - name: Require a main workflow and exact commit
        run: |
          test "$GITHUB_REF" = refs/heads/main
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Check out exact migration fixture
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tested_sha }}
          fetch-depth: 0
          path: subject
          persist-credentials: false
      - name: Require tested code to be on main
        working-directory: subject
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git merge-base --is-ancestor "$TESTED_SHA" origin/main
      - uses: actions/setup-go@v6
        with:
          go-version-file: subject/go.mod
          cache-dependency-path: subject/go.sum
      - name: Private module read access
        env:
          TOKEN: ${{ secrets.MODULE_READ_TOKEN }}
        run: |
          test -n "$TOKEN"
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/pipeline-gitconfig"
          echo "GIT_CONFIG_GLOBAL=$GIT_CONFIG_GLOBAL" >> "$GITHUB_ENV"
          git config --global url."https://x-access-token:${TOKEN}@github.com/2026-Softbank-Hackathon-Charlie/".insteadOf "https://github.com/2026-Softbank-Hackathon-Charlie/"
      - name: Check evidence filtering
        run: python3 -B -m unittest discover -s harness/.github/scripts -p test_pipeline_evidence.py
      - name: Run all four scenarios with real CNPG, PostgreSQL and HTTP load
        run: python3 harness/.github/scripts/pipeline-evidence.py --root "$GITHUB_WORKSPACE/subject" --output "$RUNNER_TEMP/pipeline-evidence/migration.json"
      - name: Remove only disposable fixture resources and verify absence
        if: always()
        run: |
          set -euo pipefail
          nodes=null
          stores=null
          cleanup_status=failed
          record_cleanup() {
            mkdir -p "$RUNNER_TEMP/pipeline-evidence"
            printf '{"kind_nodes_remaining":%s,"fixture_stores_remaining":%s,"cleanup_status":"%s"}\n' "$nodes" "$stores" "$cleanup_status" >"$RUNNER_TEMP/pipeline-evidence/cleanup.json"
            rm -f "$RUNNER_TEMP/pipeline-gitconfig" "$RUNNER_TEMP/pipeline-cleanup.private"
          }
          trap record_cleanup EXIT
          if [ -f subject/test/e2e/down.sh ]; then
            (cd subject && bash test/e2e/down.sh) >"$RUNNER_TEMP/pipeline-cleanup.private" 2>&1 || true
          fi
          # Fallback also covers cancellation before kind was installed.
          ids="$(docker ps -aq --filter label=io.x-k8s.kind.cluster=hop-e2e)"
          if [ -n "$ids" ]; then docker rm -f -v $ids >/dev/null; fi
          # run.sh creates this exact container with --label hopcharlie-e2e=1.
          ids="$(docker ps -aq --filter 'name=^hop-e2e-store$' --filter label=hopcharlie-e2e)"
          if [ -n "$ids" ]; then docker rm -f -v $ids >/dev/null; fi
          # No label restriction on the final exact-name absence check.
          nodes="$(docker ps -aq --filter label=io.x-k8s.kind.cluster=hop-e2e | wc -l | tr -d ' ')"
          stores="$(docker ps -aq --filter 'name=^hop-e2e-store$' | wc -l | tr -d ' ')"
          test "$nodes" -eq 0
          test "$stores" -eq 0
          cleanup_status=verified
      - name: Keep structured evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disposable-pipeline-${{ inputs.tested_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pipeline-evidence/*.json
          if-no-files-found: error
          retention-days: 14
