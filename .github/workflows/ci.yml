name: ci

# Target: a PR is checked in under a minute. Most of a cold run is compiling
# client-go and the AWS SDK (twice: plain and -race), so PRs reuse the Go
# module and build cache that main saves, recompile only what changed, and
# rerun only the tests whose inputs changed (go test's own result cache).

on:
  pull_request:
  push:
    branches: [main]
  # publish-image.yml runs the same checks on the commit it publishes.
  workflow_call:

permissions:
  contents: read

# github.workflow is the caller's name when publish-image.yml calls this, so
# a publish run and a push run on main do not cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOPRIVATE: github.com/2026-Softbank-Hackathon-Charlie
      GOTOOLCHAIN: auto
      # The PostgreSQL store tests run only when this is set.
      PLATFORM_TEST_DATABASE_URL: postgres://charlie:charlie@localhost:5432/charlie?sslmode=disable
    steps:
      # Pulled and started in the background while the rest of the job runs;
      # the test step waits for it. A service container would block the job.
      - name: Start PostgreSQL
        run: |
          docker run -d --name pg -p 5432:5432 \
            -e POSTGRES_USER=charlie -e POSTGRES_PASSWORD=charlie -e POSTGRES_DB=charlie \
            postgres:17.11-alpine >/tmp/pg.log 2>&1 &

      - uses: actions/checkout@v5

      # migration-engine is a private module. MODULE_READ_TOKEN is a repository
      # secret: a fine-grained token with Contents read on migration-engine.
      - name: Private modules
        env:
          TOKEN: ${{ secrets.MODULE_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Repository secret MODULE_READ_TOKEN is not set (read access to migration-engine)."
            exit 1
          fi
          git config --global url."https://x-access-token:${TOKEN}@github.com/2026-Softbank-Hackathon-Charlie/".insteadOf "https://github.com/2026-Softbank-Hackathon-Charlie/"

      - name: Restore Go cache from main
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-race-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-race-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-race-${{ runner.os }}-

      # The runner's own Go switches to the go.mod toolchain by itself
      # (GOTOOLCHAIN=auto). That toolchain is a module, so it comes from the
      # cache above instead of a separate download. setup-go only runs when the
      # runner has no Go at all.
      - name: Go toolchain
        id: go
        run: |
          if command -v go >/dev/null; then go version; else echo "missing=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-go@v6
        if: steps.go.outputs.missing == 'true'
        with:
          go-version-file: go.mod
          cache: false

      # -race: vet compiles the dependencies the same way the race tests do,
      # so both share one set of build artifacts in the cache.
      - name: Vet
        run: go vet -race ./...

      # gofmt of the go.mod toolchain, not the runner's own Go.
      - name: Formatting
        run: |
          unformatted="$("$(go env GOROOT)/bin/gofmt" -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed:"; echo "$unformatted"; exit 1
          fi

      - name: Generated API types match api/openapi.yaml
        run: |
          go generate ./pkg/apiv1/...
          git diff --exit-code -- pkg/apiv1

      # test/charts runs helm lint and helm template on deploy/charts and
      # deploy/argocd; pinned so its results do not change with the runner.
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.1

      # No -count=1: packages whose code, test files and environment did not
      # change since main's run reuse their cached result.
      - name: Test (race, PostgreSQL)
        run: |
          for _ in $(seq 1 60); do
            docker exec pg pg_isready -U charlie -q 2>/dev/null && break
            sleep 1
          done
          docker exec pg pg_isready -U charlie || { cat /tmp/pg.log; exit 1; }
          go test -race ./...

      # Only main saves, so a PR spends no time uploading and always starts
      # from main's latest state.
      - name: Save Go cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-race-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: bash -n
        run: |
          for f in $(git ls-files '*.sh' '*.tftpl'); do
            bash -n "$f" || exit 1
          done
      - name: Terraform handoff compatibility (fake tools, no AWS)
        run: bash test/tf-handoff.sh
      - name: Infra PR helper tests
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
