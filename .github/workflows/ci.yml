name: ci

# Target: a PR is checked in under a minute. Most of a cold run is compiling
# client-go and the AWS SDK (twice: plain and -race), so PRs reuse the Go
# module and build cache that main saves, recompile only what changed, and
# rerun only the tests whose inputs changed (go test's own result cache).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# On main, a newer push cancels the older run, and publish-image.yml runs only
# after a run that finished successfully: only the latest commit is published.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOPRIVATE: github.com/2026-Softbank-Hackathon-Charlie
      GOTOOLCHAIN: auto
      # Self-hosted runners share one host: one container per run, removed at the end.
      PG_CONTAINER: platform-ci-pg-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # Pulled and started in the background while the rest of the job runs;
      # the test step waits for it. A service container would block the job.
      # A random loopback port, so parallel runs on the host do not collide.
      - name: Start PostgreSQL
        run: |
          docker run -d --name "$PG_CONTAINER" -p 127.0.0.1::5432 \
            -e POSTGRES_USER=charlie -e POSTGRES_PASSWORD=charlie -e POSTGRES_DB=charlie \
            postgres:17.11-alpine >"$RUNNER_TEMP/pg.log" 2>&1 &

      - uses: actions/checkout@v5

      # migration-engine is a private module. MODULE_READ_TOKEN is a repository
      # secret: a fine-grained token with Contents read on migration-engine.
      - name: Private modules
        env:
          TOKEN: ${{ secrets.MODULE_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Repository secret MODULE_READ_TOKEN is not set (read access to migration-engine)."
            exit 1
          fi
          # Self-hosted runners keep ~/.gitconfig between jobs: keep the token in this job's temp dir.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig"
          echo "GIT_CONFIG_GLOBAL=$GIT_CONFIG_GLOBAL" >> "$GITHUB_ENV"
          git config --global url."https://x-access-token:${TOKEN}@github.com/2026-Softbank-Hackathon-Charlie/".insteadOf "https://github.com/2026-Softbank-Hackathon-Charlie/"

      # A self-hosted runner keeps ~/go between jobs; restoring over it races with parallel jobs.
      - name: Restore Go cache from main
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-race-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-race-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-race-${{ runner.os }}-

      # The runner's own Go switches to the go.mod toolchain by itself
      # (GOTOOLCHAIN=auto). That toolchain is a module, so it comes from the
      # cache above instead of a separate download. setup-go only runs when the
      # runner has no Go at all.
      - name: Go toolchain
        id: go
        run: |
          if command -v go >/dev/null; then go version; else echo "missing=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-go@v6
        if: steps.go.outputs.missing == 'true'
        with:
          go-version-file: go.mod
          cache: false

      # -race: vet compiles the dependencies the same way the race tests do,
      # so both share one set of build artifacts in the cache.
      - name: Vet
        run: go vet -race ./...

      # gofmt of the go.mod toolchain, not the runner's own Go.
      - name: Formatting
        run: |
          unformatted="$("$(go env GOROOT)/bin/gofmt" -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed:"; echo "$unformatted"; exit 1
          fi

      - name: Generated API types match api/openapi.yaml
        run: |
          go generate ./pkg/apiv1/...
          git diff --exit-code -- pkg/apiv1

      - name: Preserve generated API contract for review when generation differs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-api-contract
          path: pkg/apiv1

      # test/charts runs helm lint and helm template on deploy/charts and
      # deploy/argocd; pinned so its results do not change with the runner.
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.1

      # No -count=1: packages whose code, test files and environment did not
      # change since main's run reuse their cached result.
      # The PostgreSQL store tests run only when PLATFORM_TEST_DATABASE_URL is set.
      - name: Test (race, PostgreSQL)
        run: |
          for _ in $(seq 1 60); do
            docker exec "$PG_CONTAINER" pg_isready -U charlie -q 2>/dev/null && break
            sleep 1
          done
          docker exec "$PG_CONTAINER" pg_isready -U charlie || { cat "$RUNNER_TEMP/pg.log"; exit 1; }
          port="$(docker port "$PG_CONTAINER" 5432/tcp | head -n 1)"
          port="${port##*:}"
          [[ "$port" =~ ^[0-9]+$ ]] || { echo "::error::PostgreSQL has no host port"; exit 1; }
          export PLATFORM_TEST_DATABASE_URL="postgres://charlie:charlie@127.0.0.1:$port/charlie?sslmode=disable"
          echo "PLATFORM_TEST_DATABASE_URL=$PLATFORM_TEST_DATABASE_URL" >> "$GITHUB_ENV"
          go test -race ./...

      # The minio storage driver links madmin-go (AGPL-3.0), so it is only in
      # binaries built with -tags minio (kind E2E, on-prem); the published
      # default image is built without it; the manual minio flavor opts in
      # (publish-image.yml). Keep both paths compiling and
      # tested.
      - name: Test the minio driver (-tags minio)
        run: |
          go vet -race -tags minio ./internal/storage/... ./internal/envs/... ./internal/apps/... ./cmd/api/...
          go test -race -tags minio ./internal/storage/... ./internal/envs/... ./internal/apps/...

      # Only main saves, so a PR spends no time uploading and always starts
      # from main's latest state.
      - name: Save Go cache
        if: runner.environment == 'github-hosted' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-race-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

      - name: Remove PostgreSQL
        if: always()
        run: docker rm -f -v "$PG_CONTAINER" >/dev/null 2>&1 || true

  onprem-cluster:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOPRIVATE: github.com/2026-Softbank-Hackathon-Charlie
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Private module access for disposable fixture
        env:
          TOKEN: ${{ secrets.MODULE_READ_TOKEN }}
        run: |
          test -n "$TOKEN"
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/onprem-gitconfig"
          echo "GIT_CONFIG_GLOBAL=$GIT_CONFIG_GLOBAL" >> "$GITHUB_ENV"
          git config --global url."https://x-access-token:${TOKEN}@github.com/2026-Softbank-Hackathon-Charlie/".insteadOf "https://github.com/2026-Softbank-Hackathon-Charlie/"
      - name: Compile real cluster tests before provisioning
        run: go test -tags onpremkind -run '^$' ./internal/onprem
      - name: Install verified kind binary
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  '"$RUNNER_TEMP/kind" | sha256sum --check
          chmod +x "$RUNNER_TEMP/kind"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Create isolated onprem registration cluster
        run: kind create cluster --name onprem-registration --image kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0 --kubeconfig "$RUNNER_TEMP/onprem-registration.kubeconfig" --wait 120s
      - name: Real admission, delegated credentials and HTTP proof
        env:
          HOPCHARLIE_ONPREM_TEST_KUBECONFIG: ${{ runner.temp }}/onprem-registration.kubeconfig
        run: go test -race -tags onpremkind -run 'Test.*DisposableKind|Test.*Real.*Bootstrap' -timeout 10m -v ./internal/onprem
      - name: Remove disposable registration cluster
        if: always()
        run: kind delete cluster --name onprem-registration

  shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: bash -n
        run: |
          for f in $(git ls-files '*.sh' '*.tftpl'); do
            bash -n "$f" || exit 1
          done
      - name: Terraform handoff compatibility (fake tools, no AWS)
        run: bash test/tf-handoff.sh
      - name: Infra pin helper tests
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
