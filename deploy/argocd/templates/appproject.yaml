{{- if not .Values.environments }}
{{- fail "environments must name at least one environment" }}
{{- end }}
# Apps may only use the hopcharlie-app chart (and read their gitops files),
# only in their environments' clusters, in any namespace but the denied ones,
# and only create what the chart renders.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.argocdNamespace }}
spec:
  description: Apps the HopCharlie platform deploys from GitHub
  sourceRepos:
    - {{ .Values.chart.repoURL | quote }}
    - {{ .Values.gitops.repoURL | quote }}
  destinations:
    {{- range $env, $e := .Values.environments }}
    {{- $cluster := required (printf "environments.%s.cluster needs server or name" $env) $e.cluster }}
    {{- range $.Values.deniedNamespaces }}
    - {{ merge (dict "namespace" (printf "!%s" .)) $cluster | toJson }}
    {{- end }}
    - {{ merge (dict "namespace" "*") $cluster | toJson }}
    {{- end }}
  # The only cluster-scoped object: the app's own namespace, which the chart
  # renders. The denied namespaces above keep an app from adopting a
  # platform one.
  clusterResourceWhitelist:
    - { group: "", kind: Namespace }
  namespaceResourceWhitelist:
    - { group: apps, kind: Deployment }
    - { group: "", kind: Service }
    - { group: postgresql.cnpg.io, kind: Cluster }
    # The Cluster's backups (platform ADR 0025). The Backups the schedule
    # makes are CNPG's, owned by the ScheduledBackup.
    - { group: postgresql.cnpg.io, kind: ScheduledBackup }
    - { group: barmancloud.cnpg.io, kind: ObjectStore }
    - { group: "", kind: ResourceQuota }
    - { group: "", kind: LimitRange }
    - { group: networking.k8s.io, kind: NetworkPolicy }
    # Keys the platform sealed (platform ADR 0016, 0019). The Secret each one
    # becomes is the sealed-secrets controller's, not Argo CD's, so Secret
    # itself stays denied.
    - { group: bitnami.com, kind: SealedSecret }
