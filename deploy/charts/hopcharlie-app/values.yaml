# Argo CD renders this chart with two sets of values (helm/charts/hopcharlie-apps):
#
#   - the gitops file apps/<instance>/<env>.yaml as a values file, exactly as
#     the platform wrote it (platform ADR 0011). It is the contract between the
#     platform and this chart; values.schema.json checks it.
#   - profile, the environment's profile.
#
# The release namespace is the file's namespace: the app's name, or the
# instance's for a branch deploy. The chart renders that Namespace, so
# deleting the Application deletes the namespace and everything in it: the
# database's volumes and any Secret put there, such as the S3 keys. Object
# names inside it start with the app's name.

# The gitops file's header. Only values is rendered; the commit and the
# deployment annotate the Deployments.
app: ""
env: ""
namespace: ""
commit: ""
deployment: ""

values:
  app: ""
  # One Deployment per service and, for a service with a port, one Service
  # <app>-<name> (platform ADR 0024).
  #   - name: web
  #     image: registry/hopcharlie/apps/<app>/web@sha256:...   # pinned by digest
  #     port: 8080            # containerPort, Service port and PORT; without
  #                           # it a worker: no Service, probes or PORT
  #     healthCheck: /healthz # optional HTTP path for the probes; needs port
  #     public: true          # served at https://<app>.<domain>; at most one;
  #                           # needs port
  #     replicas: 1
  #     memory: 512Mi         # optional memory request and limit
  #     cpu: 250m             # optional CPU request; no CPU limit
  #     env: {KEY: value}     # strings; never a platform variable: PORT,
  #                           # DATABASE_URL, PGHOST, PGPORT, PGDATABASE,
  #                           # PGUSER, PGPASSWORD, JDBC_DATABASE_URL, S3_*;
  #                           # "$(PGHOST)" expands to the platform's value
  services: []
  # At most one of each type.
  #   - {name: db, type: postgres}   # CNPG Cluster <app>-db; DATABASE_URL,
  #                                  # PGHOST, PGPORT, PGDATABASE, PGUSER,
  #                                  # PGPASSWORD, JDBC_DATABASE_URL
  #   - {name: photos, type: s3}     # S3_* from profile.s3
  resources: []
  # Values the platform sealed with the cluster's Sealed Secrets certificate,
  # strict scope (platform ADR 0016, 0019). The platform leaves out what it
  # has nothing for.
  #   s3:                       # SealedSecret app-s3: the bucket's key pair
  #     accessKey: <ciphertext>
  #     secretKey: <ciphertext>
  #   app:                      # SealedSecret app-secrets, envFrom in every
  #     HOST_CODE: <ciphertext> # service container
  #   appChecksum: <hex>        # with app; a pod annotation, so the pods
  #                             # restart exactly when the secrets change
  #   pgBackup:                 # SealedSecret app-pgbackup: the key of the
  #     accessKey: <ciphertext> # backup bucket below (platform ADR 0025)
  #     secretKey: <ciphertext>
  sealedSecrets: {}
  # The postgres resource's backup bucket and the path in it, new for every
  # registration of the app (platform ADR 0025). The platform sets it with
  # sealedSecrets.pgBackup; profile.postgres.backup.enabled turns backups on.
  #   backup: {bucket: hopcharlie-eks-moimroom---pg, path: 20261104T082201Z}
  backup: {}

profile:
  # The Service of the public service, which the traffic gateway reaches.
  # Production uses an internal load balancer; other services are always
  # ClusterIP.
  publicService:
    type: ClusterIP
    # Local preserves the source IP for passthrough load balancers; empty keeps the cluster default.
    externalTrafficPolicy: ""
    # Port of that Service; 0 uses the service's own port. A fixed port keeps
    # the platform's egress NetworkPolicy from opening every app's port.
    port: 0
    annotations: {}

  # Names of Secrets in the namespace for pulling the images.
  imagePullSecrets: []

  # Requests and limits of every service's container. A service's memory
  # replaces both memory values, its cpu the CPU request.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

  # How long a new version may take to become ready. Past it the Deployment
  # reports ProgressDeadlineExceeded, which Argo CD shows as Degraded, and
  # the pods of the old version keep serving (maxUnavailable 0).
  progressDeadlineSeconds: 180

  # A pod that is stopping keeps serving this long, until every node has
  # taken it out of its Service, before it gets SIGTERM. 0 turns it off.
  preStopSleepSeconds: 5

  # Pod Security Standard level of the namespace (enforce, audit, warn);
  # empty sets no labels.
  podSecurity: restricted

  # Every container runs as this non-root user, as the restricted Pod
  # Security Standard requires.
  runAsUser: 65532

  # postgres resources: a single-instance CloudNativePG Cluster.
  postgres:
    storageSize: 1Gi
    storageClass: ""     # empty: the cluster's default StorageClass
    resources: {}        # of the Postgres pod
    # WAL archiving and daily backups with the Barman Cloud plugin into
    # values.backup, with the key in values.sealedSecrets.pgBackup and the
    # region in s3.region. Off, or without values.backup, the Cluster has no
    # backups. Turning it on or off restarts the Postgres pod once.
    backup:
      enabled: false
      schedule: "0 0 18 * * *"   # CNPG's six fields, UTC: 03:00 KST
      retentionPolicy: 7d

  # s3 resources. The chart sets the variables; the platform creates the
  # bucket (platform ADR 0016).
  s3:
    endpoint: ""         # S3_ENDPOINT, e.g. https://s3.ap-northeast-2.amazonaws.com
    region: ""           # S3_REGION
    pathStyle: false     # S3_PATH_STYLE; true for MinIO
    bucketPrefix: ""     # S3_BUCKET is <bucketPrefix><namespace>
    # Secret in the namespace with the key pair (S3_ACCESS_KEY,
    # S3_SECRET_KEY). Required when the app has an s3 resource. With
    # values.sealedSecrets.s3 the chart renders it, so it must be app-s3 with
    # the default key names.
    credentialsSecret: ""
    accessKeyKey: accessKey
    secretKeyKey: secretKey

  # Guardrails of the namespace, so a new namespace needs no infra change.
  # With quota, every container needs requests: turn limitRange on too.
  quota:
    enabled: false
    hard: {}             # ResourceQuota spec.hard
  limitRange:
    enabled: false       # for containers that set no resources
    default: {}          # limits
    defaultRequest: {}   # requests
    max: {}
  networkPolicy:
    enabled: false
    # Ingress: the namespace itself, the CNPG operator and gatewayFrom
    # (NetworkPolicyPeers: where the traffic gateway connects from).
    gatewayFrom: []
    operatorNamespace: cnpg-system
    # Egress: the namespace itself, DNS, TCP 443 and extraEgress
    # (NetworkPolicyEgressRules, e.g. an S3 endpoint on another port).
    extraEgress: []
