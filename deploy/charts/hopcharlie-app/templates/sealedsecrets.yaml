{{- /*
What the platform sealed for this instance (platform ADR 0016, 0019). The
cluster's sealed-secrets controller creates each Secret, owned by its
SealedSecret, so Argo CD shows it as a child and does not prune it.
*/}}
{{- $sealed := .Values.values.sealedSecrets }}
{{- with $sealed.s3 }}
{{- $s3 := $.Values.profile.s3 }}
{{- if or (ne ($s3.credentialsSecret | default "") "app-s3") (ne ($s3.accessKeyKey | default "accessKey") "accessKey") (ne ($s3.secretKeyKey | default "secretKey") "secretKey") }}
{{- fail "values.sealedSecrets.s3 renders Secret app-s3 with keys accessKey and secretKey; profile.s3 must read exactly those" }}
{{- end }}
---
# The bucket's key pair, read by S3_ACCESS_KEY and S3_SECRET_KEY.
{{ include "hopcharlie-app.sealedSecret" (dict "root" $ "name" "app-s3" "data" (dict "accessKey" .accessKey "secretKey" .secretKey)) }}
{{- end }}
{{- with $sealed.app }}
---
# The instance's secrets, envFrom in every service container.
{{ include "hopcharlie-app.sealedSecret" (dict "root" $ "name" "app-secrets" "data" .) }}
{{- end }}
