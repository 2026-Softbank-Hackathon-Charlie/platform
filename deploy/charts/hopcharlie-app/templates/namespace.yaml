{{- /*
The release namespace belongs to the app: Argo CD creates it first (wave
-1) and deletes it with the Application, with everything in it.
*/}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  labels:
    {{- if .Values.profile.observability.enabled }}
    observability.hopcharlie.dev/enabled: "true"
    {{- end }}
    hopcharlie.dev/app: {{ .Values.values.app }}
    hopcharlie.dev/instance: {{ .Release.Namespace }}
    {{- if .Values.values.dbTopology }}
    # Where the platform may patch the CNPG Cluster's replica (infra ADR 0063)
    # and the shared database proxies accept replication.
    hopcharlie.dev/db-topology: "true"
    {{- end }}
    app.kubernetes.io/part-of: {{ .Values.values.app }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    {{- with .Values.profile.podSecurity }}
    pod-security.kubernetes.io/enforce: {{ . }}
    pod-security.kubernetes.io/audit: {{ . }}
    pod-security.kubernetes.io/warn: {{ . }}
    {{- end }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
